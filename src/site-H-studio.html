<!doctype html>
<html lang="en">
<head>

<style>
/* Design rules for this direction: one accent, hairlines instead of boxes, generous air,
   a neutral grotesk with small uppercase mono labels. The page is dotted sketch paper.
   If something needs a border to be understood, cut it. */
:root{--bg:#f4f6f7;--acc:#5a8fb1;--ink:#003049;--soft:#4a6676;--hair:rgba(0,48,73,.16);--dot:rgba(0,48,73,.075);--blue:#1b5e85;
  --txt:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace}
:root[data-theme=dark]{--bg:#00202f;--acc:#7fb2d2;--ink:#f0f4f6;--soft:#a3b9c5;--hair:rgba(240,244,246,.17);--dot:rgba(240,244,246,.055);--blue:#a9d0e8}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) radial-gradient(var(--dot) 1px,transparent 1.4px) 0 0/22px 22px;color:var(--ink);font:400 1.0625rem/1.7 var(--txt);font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;padding-bottom:120px;transition:background-color .3s}
::selection{background:var(--acc);color:var(--bg)}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.22em;text-decoration-color:var(--hair);transition:text-decoration-color .2s,color .2s}
a:hover{text-decoration-color:currentColor;color:var(--blue)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:4px;border-radius:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:16px;background:var(--ink);color:var(--bg);padding:8px 12px;z-index:99}
.w{max-width:1180px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}
.k{font:400 .6875rem/1.6 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--soft)}
.s{font-size:.875rem;color:var(--soft)}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:4px 26px;min-height:76px}
.hd .me{font-weight:600;text-decoration:none;margin-right:auto;padding:10px 0;letter-spacing:-.01em}
.hd .k a{text-decoration:none;padding:12px 0;margin-left:18px}
.dock{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:2px;padding:5px;background:var(--ink);border-radius:999px;max-width:calc(100vw - 16px);box-shadow:0 10px 30px -12px rgba(0,48,73,.55)}
.dock a{color:var(--bg);text-decoration:none;font-size:.875rem;padding:10px 15px;border-radius:999px;white-space:nowrap;transition:background .2s}
.dock a:hover{color:var(--bg);background:color-mix(in srgb,var(--bg) 16%,transparent)}
.dock a[aria-current=true]{background:var(--bg);color:var(--ink)}
.dock .cat{position:absolute;bottom:100%;left:16px;line-height:0;will-change:transform}
.dock .lks{display:flex;gap:2px}.dock .mn{display:none}
.dock i{width:1px;height:20px;background:color-mix(in srgb,var(--bg) 30%,transparent);margin:0 4px}
.dock button{color:var(--bg);min-width:40px;height:40px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:background .2s}
.dock button:hover{background:color-mix(in srgb,var(--bg) 16%,transparent)}
.dock button:focus-visible,.dock a:focus-visible{outline-color:var(--acc)}
.dock button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dock .lg{padding:0 10px;font:400 .6875rem var(--mono);letter-spacing:.06em}
.dock .lg b{font-weight:400;opacity:.5}.dock .lg b.on{opacity:1;font-weight:500;text-decoration:underline;text-underline-offset:4px}
.hero{padding:clamp(64px,11vw,150px) 0 0}
h1{font:500 clamp(2.2rem,5.6vw,4.7rem)/1.03 var(--txt);letter-spacing:-.045em;margin:0;max-width:16ch;text-wrap:balance}
h1 span{color:var(--acc)}
.today{margin:clamp(22px,3vw,34px) 0 0;max-width:46ch;font-size:1.125rem;color:var(--soft)}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:clamp(26px,4vw,40px)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:999px;text-decoration:none;font-weight:500;font-size:.9375rem;border:1px solid var(--ink);transition:background .2s,color .2s}
.btn:hover{background:var(--blue);border-color:var(--blue);color:var(--bg)}
.btn.o{background:transparent;color:var(--ink)}.btn.o:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cta .k{margin-left:auto}
.cityw{margin-top:clamp(36px,6vw,72px);overflow:hidden}
.city{display:block;width:100%;height:auto}
.city{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-linecap:square;shape-rendering:geometricPrecision}
.city .g{stroke-width:2.2}.city .l{stroke-width:.6}.city .a{stroke:var(--acc);stroke-width:.8}.city .d{stroke-dasharray:14 4 2 4;stroke-width:.6}
.city text{font:400 8.5px var(--mono);letter-spacing:.09em;fill:var(--soft);stroke:none}
.hi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.hi a{display:block;padding:30px 22px 0 0;text-decoration:none}
.hi b{display:block;font-weight:500}.hi a:hover b{color:var(--blue)}
.hi .s{display:block;margin:2px 0 10px}
.feat{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;padding:clamp(96px,13vw,184px) 0 0;scroll-margin-top:10px}
.feat h2{grid-column:1/7;font:500 clamp(1.8rem,3.5vw,3rem)/1.06 var(--txt);letter-spacing:-.04em;margin:10px 0 28px;text-wrap:balance}
.feat h2 span{color:var(--acc)}
.feat>div:first-child{grid-column:1/6}.feat>div:last-child{grid-column:7/13}
.feat p{font-size:1.125rem;line-height:1.6;max-width:50ch}
dl.f{margin:28px 0 0;display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr);border-top:1px solid var(--hair)}
dl.f dt,dl.f dd{margin:0;padding:16px 0;border-bottom:1px solid var(--hair);font-size:.9375rem}
dl.f dt{font:400 .6875rem/2.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--soft)}
.sec{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;padding:clamp(96px,13vw,184px) 0 0;scroll-margin-top:10px}
.sec>h2{grid-column:1/4;font:400 .6875rem/1.8 var(--mono);letter-spacing:.09em;text-transform:uppercase;margin:0 0 28px;color:var(--ink);position:sticky;top:28px;align-self:start}
.sec>h2 span{display:block;color:var(--soft)}
.sec>div{grid-column:4/13;min-width:0}
h3{font:500 1.3125rem/1.2 var(--txt);letter-spacing:-.025em;margin:0}
p{margin:0 0 1.1em;max-width:56ch;text-wrap:pretty}
.lead{font:400 clamp(1.3rem,2.2vw,1.7rem)/1.32 var(--txt);letter-spacing:-.025em;max-width:30ch;margin-bottom:1.2em}
.cols{display:grid;gap:52px 44px}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cols h3{margin:12px 0 14px}.cols p{font-size:.9688rem;margin:0;line-height:1.65}
.c4 h3{font-size:1.125rem}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin:52px 0 0;padding:0;list-style:none}
.tags li{font:400 .6875rem/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;border:1px solid var(--ink);border-radius:999px;padding:8px 13px;background:var(--bg)}
ul.r{list-style:none;margin:0;padding:0}
ul.r>li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:4px 24px;padding:21px 0;border-top:1px solid var(--hair)}
ul.r>li:first-child{border-top:0;padding-top:0}
.th,summary{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,.9fr) minmax(0,1.1fr) 20px;gap:4px 24px;align-items:baseline}
.th{padding-bottom:12px;border-bottom:1px solid var(--ink)}
details{border-bottom:1px solid var(--hair)}
summary{padding:28px 0;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary h3{transition:color .2s}summary:hover h3{color:var(--blue)}
summary h3 small{display:block;font:400 .875rem/1.5 var(--txt);letter-spacing:0;color:var(--soft);margin-top:4px}
summary .i{font-weight:500;color:var(--ink)}
summary .x{font-size:1.25rem;line-height:1;transition:transform .25s;justify-self:end}
details[open] .x{transform:rotate(45deg)}
.b{padding:0 0 30px;max-width:56ch}
/* "how I think": rows ruled like the croquis, corners overshooting, a loop line back to the start */
.think{list-style:none;margin:36px 0 0;padding:0 34px 0 0;position:relative}
.think li{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1.4fr) minmax(0,1fr);gap:6px 24px;align-items:center;padding:24px 0 24px 18px;position:relative;margin-bottom:34px;border-left:1px solid var(--ink)}
.think li:last-child{margin-bottom:0}
.think li::before{content:"";position:absolute;left:-6px;right:-6px;top:0;bottom:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);pointer-events:none}
.think li:not(:last-child)::after{content:"↓";position:absolute;left:50%;bottom:-30px;font:400 1rem/1 var(--mono);color:var(--soft)}
.think li.ph-b{border-left-color:var(--acc)}.think li.ph-b::before{border-color:var(--acc)}
.think h3{font-size:1.1875rem}.think p{margin:4px 0 0;font-size:.9375rem;color:var(--soft)}
.think .ex{font:400 .75rem/1.6 var(--mono);letter-spacing:.04em;color:var(--soft)}
.think::after{content:"";position:absolute;right:8px;top:44px;bottom:44px;width:20px;border:1px dashed var(--soft);border-left:0}
.think::before{content:"";position:absolute;right:24px;top:40px;width:8px;height:8px;border-left:1px solid var(--soft);border-bottom:1px solid var(--soft);transform:rotate(45deg)}
.more{border:0;margin-top:8px}
.more summary{display:flex;align-items:center;gap:12px;padding:18px 0 6px;font-weight:500;font-size:.9375rem}
.more summary .x{justify-self:auto}
.more dl.f{margin-top:14px}
.portrait{display:block;width:112px;height:112px;border-radius:50%;background:color-mix(in srgb,var(--acc) 28%,transparent);position:relative;overflow:hidden;margin-bottom:26px}
.portrait span{position:absolute;inset:0;display:grid;place-items:center;font-weight:500}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.off{color:var(--soft)}
.spcap{font-size:.875rem;color:var(--soft)}
.end{padding:clamp(96px,14vw,190px) 0 clamp(72px,10vw,136px)}
.end .big{font:500 clamp(2rem,5.4vw,4.4rem)/1.04 var(--txt);letter-spacing:-.045em;margin:0 0 .6em;max-width:16ch;text-wrap:balance}
.end .big span{color:var(--acc)}
.end a.m{font-weight:500;overflow-wrap:anywhere;text-decoration-color:var(--acc);text-decoration-thickness:2px}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;padding:22px 0 20px}
footer a{margin-left:22px;display:inline-block;padding:10px 0}footer a:first-child{margin-left:0}
.rv{opacity:0;transition:opacity .9s ease}.rv.in{opacity:1}
@media(max-width:860px){
  .sec,.feat{display:block}.sec>h2{position:static}
  .hi{grid-template-columns:1fr}.hi a{padding-top:18px}
  .think li{grid-template-columns:1fr;gap:6px;padding:20px 0 20px 14px}
  .c3{grid-template-columns:1fr}.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .th{display:none}details:first-of-type{border-top:1px solid var(--ink)}
  summary{grid-template-columns:minmax(0,1fr) 20px}summary>*{grid-column:1}
  summary .x{grid-row:1;grid-column:2}
  ul.r>li{grid-template-columns:1fr}
  .cta .k{margin-left:0;flex-basis:100%}
}
@media(max-width:640px){
  body{font-size:1rem;padding-bottom:104px}
  .hd{min-height:60px;gap:0 14px}.hd .k a{margin-left:14px}
  .hero{padding-top:44px}
  .today{font-size:1.0625rem}
  .cta .btn{flex:1 1 auto;justify-content:center}
  .city{width:860px;max-width:none;margin-left:calc(50% - 430px)}
  .sec,.feat{padding-top:76px}
  .feat h2{margin-bottom:20px}.feat p{font-size:1.0625rem}
  .cols{gap:36px 24px}
  .spines{zoom:.74;justify-content:flex-start}
  .tags li{padding:7px 11px}
  .end{padding:88px 0 64px}
  footer{flex-direction:column;gap:2px}footer a{margin:0 18px 0 0}
}
@media(max-width:640px){
  .dock{padding:6px;gap:4px}
  .dock .mn{display:inline-flex;padding:0 16px;font-size:.9375rem;min-width:132px;justify-content:space-between;height:44px}
  .dock button{height:44px;min-width:44px}
  .dock .lks{display:none;position:absolute;left:0;right:0;bottom:calc(100% + 10px);flex-direction:column;gap:2px;padding:8px;background:var(--ink);border-radius:22px;box-shadow:0 10px 30px -12px rgba(0,48,73,.55)}
  .dock.open .lks{display:flex}
  .dock .lks a{padding:13px 16px;font-size:1rem;border-radius:14px}
  .dock.open .cat{visibility:hidden}
}
@media(max-width:480px){.c4{grid-template-columns:1fr}.hd .lk a:first-child{display:none}dl.f{grid-template-columns:1fr}dl.f dt{border:0;padding-bottom:0}dl.f dd{padding-top:2px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.rv{opacity:1}}
</style>

<body>
<div id="app"></div>
<script>
/*CORE*/

/* ---------- Site H · Studio ---------- */
let theme = store.get("rj-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
document.documentElement.dataset.theme = theme;
const clock = () => new Date().toLocaleTimeString(lang === "es" ? "es-AR" : "en-GB", { timeZone: "America/Argentina/Buenos_Aires", hour: "2-digit", minute: "2-digit", hour12: false });
const DOCK = [["work", "work"], ["about", "about"], ["offers", "services"], ["books", "books"], ["contact", "contact"]];
const MAIN = ["WK.01", "WK.02", "WK.04"];
/* Buenos Aires as an architect's croquis: an elevation with overshooting corners, centre lines,
   a dimension line, a hatched ground and small annotations. */
const city = alt => {
  const G = 200, o = 5;
  // a building: top edge and two sides, corners overshooting by the same amount everywhere
  const box = (x, w, h, yb = G) => `M${x - o} ${yb - h}H${x + w + o}M${x} ${yb - h - o}V${yb}M${x + w} ${yb - h - o}V${yb}`;
  // windows: an even grid centred inside the given face
  const win = (x, w, yt, h, c, r) => { let p = ""; for (let i = 1; i <= c; i++) for (let j = 1; j <= r; j++) p += `M${(x + w * i / (c + 1)).toFixed(1)} ${(yt + h * j / (r + 1) - 2).toFixed(1)}v4`; return p; };
  const bld = (x, w, h, c, r) => [box(x, w, h), win(x, w, G - h, h - 10, c, r)];
  const tree = (x, r) => `M${x} ${G}v${-r * .6}M${x - r} ${G - r * 1.6}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`;
  const lamp = x => `M${x} ${G}v-22M${x} ${G - 22}h6v3`;
  const man = x => `M${x} ${G}v-9M${x - 2} ${G - 11.5}a2 2 0 1 0 4 0a2 2 0 1 0 -4 0`;
  let hatch = ""; for (let x = 28; x <= 832; x += 12) hatch += `M${x} ${G + 5}l-7 9`;
  let rail = ""; for (let i = 0; i <= 22; i++) rail += `M${(848 + i * 12).toFixed(0)} ${G - 4}v-5`;
  let cols = ""; for (let i = 0; i < 8; i++) cols += `M${(394 + i * 16)} ${G - 38}V${G - 6}`;
  const B = [bld(60, 48, 48, 3, 2), bld(120, 44, 88, 3, 5), bld(664, 40, 64, 3, 3), bld(712, 44, 108, 3, 6), bld(764, 36, 76, 2, 4), bld(1128, 44, 44, 3, 2)];
  const leader = (x, y, dir) => `M${x} ${y}l${12 * dir} -12h${30 * dir}`;
  return `<svg class="city" viewBox="0 0 1200 244" role="img" aria-label="${esc(alt)}">
<g>
<path class="g" d="M14 ${G}H1186"/>
<path class="l" d="${hatch}M880 ${G + 8}h200M920 ${G + 14}h120"/>
<path d="${B.map(b => b[0]).join("")}"/>
<path class="l" d="${B.map(b => b[1]).join("")}"/>
<path d="${box(188, 96, 56)}${box(202, 68, 30, G - 56)}${box(216, 40, 28, G - 86)}${box(226, 20, 22, G - 114)}M236 ${G - 136 - o}V36"/>
<path class="l" d="${win(188, 96, G - 56, 46, 7, 2)}${win(202, 68, G - 86, 30, 5, 1)}${win(216, 40, G - 114, 28, 3, 1)}"/>
<path d="${box(372, 156, 38)}M${404 - o} ${G - 38}H${496 + o}M408 ${G - 38}a42 42 0 0 1 84 0${box(444, 12, 10, G - 80)}M450 ${G - 90 - o}V${G - 108}"/>
<path class="l" d="${cols}M372 ${G - 6}h156M436 ${G - 38}c0-22 6-36 14-42M464 ${G - 38}c0-22-6-36-14-42M422 ${G - 38}c0-20 12-36 28-42M478 ${G - 38}c0-20-12-36-28-42"/>
<path d="M588 ${G}L596.4 56M612 ${G}L603.6 56M${596.4 - o} 56H${603.6 + o}M596.4 56L600 36M603.6 56L600 36"/>
<path class="l" d="M582 ${G - 4}h36"/>
<path d="M846 ${G - 4}H1114M962 ${G - 4}L1052 92M958 ${G - 4}a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/>
<path class="l" d="M1052 92L866 ${G - 4}M1052 92L890 ${G - 4}M1052 92L914 ${G - 4}M1052 92L938 ${G - 4}${rail}M846 ${G - 9}H1114M954 ${G}l4 10h8l4 -10"/>
<path class="l" d="${tree(312, 13)}${tree(560, 10)}${tree(824, 12)}${lamp(344)}${lamp(538)}${lamp(650)}${man(296)}${man(330)}${man(548)}${man(1100)}"/>
</g>
<g class="a">
<path class="d" d="M600 22V${G + 14}M450 76V${G + 14}"/>
<path d="M632 36V${G}M626 36h12M626 ${G}h12M629 39l6-6M629 ${G + 3}l6-6"/>
<path class="l" d="${leader(238, 34, 1)}${leader(452, 90, 1)}${leader(1050, 90, -1)}"/>
<path class="l" d="M132 78c7-11 24-8 26 0 11-4 20 5 13 11h-43c-7-3-5-11 4-11M318 60c7-11 24-8 26 0 11-4 20 5 13 11h-43c-7-3-5-11 4-11M756 54c7-11 24-8 26 0 11-4 20 5 13 11h-43c-7-3-5-11 4-11"/>
</g>
<text x="644" y="${G - 82}" transform="rotate(-90 644 ${G - 82})" text-anchor="middle">67.5 m</text>
<text x="600" y="14" text-anchor="middle">OBELISCO</text>
<text x="284" y="25">KAVANAGH</text><text x="498" y="81">CONGRESO</text><text x="1004" y="81" text-anchor="end">PUENTE DE LA MUJER</text>
<text x="14" y="${G + 38}">BUENOS AIRES · 34°36′S 58°22′W · ALZADO</text>
</svg>`;
};
function render(t) {
  const d = t.d, m = t.pitch.match(/^(.*?)( so | para que )(.*)$/);
  const h1 = m ? `${m[1]}<span>${m[2]}${m[3]}</span>` : t.pitch;
  const sec = (id, title, body, sub = "") => `<section class="sec" id="${id}"><h2>${title}${sub ? `<span>${sub}</span>` : ""}</h2><div class="rv">${body}</div></section>`;
  const main = MAIN.map(c => t.cases.find(x => x.code === c)), rest = t.cases.filter(x => !MAIN.includes(x.code));
  const fid = c => "f" + c.code.replace(".", "");
  $("#app").innerHTML = `
<a class="skip" href="#main">${t.skip}</a>
<header class="w"><div class="hd">
  <a class="me" href="#top">${t.name}</a>
  <span class="k lk"><a href="mailto:${L.email}">${t.footer.email}</a><a href="${L.linkedin}" ${ext}>${t.footer.linkedin}</a><a href="${L.github}" ${ext}>${t.footer.github}</a></span>
</div></header>
<main id="main" class="w">
  <div class="hero" id="top">
    <h1>${h1}</h1>
    <p class="today">${t.today}</p>
    <div class="cta"><a class="btn" href="${mailto()}">${t.cta} ↗</a><a class="btn o" href="#work">${t.seeWork}</a><span class="k">${t.remoteNote} · <span id="clock">${clock()}</span></span></div>
    <div class="cityw">${city(t.illo)}</div>
  </div>
  <nav class="hi" aria-label="${esc(t.h.work)}">${main.map(c => `<a href="#${fid(c)}"><b>${c.name} ›</b><span class="s">${c.org} · ${c.role}</span><span class="k">${c.impact}</span></a>`).join("")}</nav>

  ${sec("thesis", t.why, `<div class="cols c3">${d.thesis.map(x => `<div><h3>${x.h}</h3><p>${x.p}</p></div>`).join("")}</div>`)}

  <div id="work">${main.map(c => `<section class="feat" id="${fid(c)}"><div class="rv"><span class="k">${c.org} · ${c.when}</span><h2 style="grid-column:auto">${c.name}. <span>${c.line}</span></h2></div>
    <div class="rv"><p>${c.body}</p><dl class="f"><dt>${t.fact.scale}</dt><dd>${c.impact}</dd><dt>${t.fact.role}</dt><dd>${c.role}</dd><dt>${t.fact.stack}</dt><dd>${c.tags.join(", ")}</dd></dl>
      ${c.steps ? `<details class="more"><summary><span class="x" aria-hidden="true">+</span>${t.readCase}</summary><dl class="f">${c.steps.map(x => `<dt>${x.k}</dt><dd>${x.v}</dd>`).join("")}</dl></details>` : ""}</div></section>`).join("")}</div>

  ${sec("think", t.think.title, `<p>${t.think.intro}</p>
    <ol class="think">${t.think.steps.map((x, i) => `<li class="ph-${x.ph}"><span class="k">0${i + 1} · ${t.think.phases[x.ph]}</span><div><h3>${x.q}</h3><p>${x.s}</p></div><span class="ex">${x.ex}</span></li>`).join("")}</ol>
    <p class="k" style="text-align:right;margin:14px 0 0;max-width:none">↺ ${t.think.loop}</p>`)}

  ${sec("more", t.moreWork, `<div class="th k" aria-hidden="true"><span>${t.workCols.p}</span><span>${t.workCols.w}</span><span>${t.workCols.i}</span><span></span></div>
    ${rest.map(c => `<details><summary><h3>${c.name}<small>${c.org} · ${c.role}</small></h3><span class="s">${c.when}</span><span class="s i">${c.impact}</span><span class="x" aria-hidden="true">+</span></summary>
    <div class="b"><p>${caseBody(c)}</p><p class="s">${c.tags.join(" · ")}${c.url ? ` · <a href="${c.url}" ${ext}>${t.repo}</a>` : ""}</p></div></details>`).join("")}`)}

  ${sec("about", t.h.about, `${portrait()}<p class="lead">${t.about[2]}</p>
    <div class="cols c4" style="margin-top:60px">${d.story.map((x, i) => `<div><span class="k">[0${i + 1}]</span><h3>${x.h}</h3><p>${x.p}</p></div>`).join("")}</div>
    <ul class="tags">${d.pairs.map(p => `<li>${p}</li>`).join("")}</ul>
    <div style="margin-top:48px">${offClock()}</div>`)}

  ${sec("experience", t.h.experience, `<ul class="r">${expSplit(t, e => `<li><span class="k">${e.when}</span><span><b style="font-weight:500">${e.role}</b><br><span class="s">${e.org}</span></span></li>`, "li", "k")}</ul>`)}

  ${sec("skills", t.h.skills, `<ul class="r">${t.skills.map(s => `<li><span class="k">${s.name}</span><span>${s.items.join(", ")}</span></li>`).join("")}</ul>`)}

  ${sec("offers", t.h.services, `<div class="cols c3" style="margin-bottom:56px">${t.services.map((s, i) => `<div><span class="k">0${i + 1}</span><h3>${s.name}</h3><p>${svcBody(s)}</p></div>`).join("")}</div>
    <p>${t.freelance}</p><div class="cta" style="margin-top:22px"><a class="btn" href="${mailto()}">${t.ctaAlt} ↗</a></div>`)}

  ${sec("lab", t.h.lab, `<p>${t.labIntro}</p><ul class="r" style="margin-top:28px">${t.lab.map(l => `<li><span><span style="font-weight:500">${labName(l)}</span><br><span class="k">${l.status}</span></span><span class="s">${l.why}</span></li>`).join("")}</ul>`)}

  ${sec("books", t.h.books, `<p>${t.booksIntro}</p>${bookShelf()}`)}

  <section class="end" id="contact">
    <p class="big">${t.gotMind} <span>${t.cta}.</span></p>
    <div class="cta" style="margin:0 0 22px"><a class="btn" href="${mailto()}">${t.cta} ↗</a></div>
    <p class="s">${t.reach} <a class="m" href="${mailto()}">${L.email}</a></p>
  </section>
  <footer class="k"><span>${t.footer.rights}</span><span>${footerLinks()}</span></footer>
</main>
<nav class="dock" aria-label="Sections"><span class="cat" id="cat" aria-hidden="true">${pixelCat(2)}</span><button type="button" class="mn" data-menu aria-expanded="false" aria-controls="dlinks"><span id="mlabel">${t.menu}</span><span aria-hidden="true">▾</span></button><span class="lks" id="dlinks">${DOCK.map(([id, k]) => `<a href="#${id}" data-sec="${id}">${t.nav[k]}</a>`).join("")}</span><i aria-hidden="true"></i>
  <button type="button" data-theme-btn aria-label="${esc(t.themeLabel)}" aria-pressed="${theme === "dark"}"><svg viewBox="0 0 24 24" aria-hidden="true">${theme === "dark" ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>' : '<path d="M20 14A8 8 0 0110 4a8 8 0 1010 10z"/>'}</svg></button>
  <button type="button" class="lg" data-lang="${lang === "en" ? "es" : "en"}" aria-label="${esc(t.langLabel)}: ${lang === "en" ? "Español" : "English"}"><b${lang === "en" ? ' class="on"' : ""}>EN</b><b${lang === "es" ? ' class="on"' : ""}>ES</b></button></nav>`;
  walk(); spy();
}
/* The one flourish: a small pixel cat walks along the top of the navigation as you scroll. */
function walk() {
  const c = $("#cat"); if (!c) return;
  const max = document.documentElement.scrollHeight - innerHeight, p = max > 0 ? Math.min(1, scrollY / max) : 0;
  c.style.transform = `translateX(${(p * (c.parentNode.offsetWidth - 60)).toFixed(1)}px)`;
}
let so;
function spy() {
  if (so) so.disconnect();
  if (!("IntersectionObserver" in window)) return;
  so = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    $$(".dock a").forEach(a => a.setAttribute("aria-current", a.dataset.sec === e.target.id));
    const cur = $(`.dock a[data-sec="${e.target.id}"]`), ml = $("#mlabel"); if (cur && ml) ml.textContent = cur.textContent;
  }), { rootMargin: "-40% 0px -55% 0px" });
  DOCK.forEach(([id]) => so.observe($("#" + id)));
}
document.addEventListener("click", e => {
  if (!e.target.closest("[data-theme-btn]")) return;
  theme = theme === "dark" ? "light" : "dark"; store.set("rj-theme", theme);
  document.documentElement.dataset.theme = theme;
  const y = scrollY; apply(); scrollTo(0, y); $("[data-theme-btn]").focus();
});
document.addEventListener("click", e => {
  const dk = $(".dock"); if (!dk) return;
  const open = e.target.closest("[data-menu]") ? !dk.classList.contains("open") : false;
  dk.classList.toggle("open", open); $("[data-menu]").setAttribute("aria-expanded", open);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $(".dock.open")) { $(".dock").classList.remove("open"); $("[data-menu]").setAttribute("aria-expanded", "false"); $("[data-menu]").focus(); } });
addEventListener("scroll", () => requestAnimationFrame(walk), { passive: true });
addEventListener("resize", walk);
setInterval(() => { const c = $("#clock"); if (c) c.textContent = clock(); }, 30000);
apply();
</script>
</body>
</html>
