<style>

:root{--bg:#f4f6f7;--acc:#5a8fb1;--ink:#003049;--soft:#4a6676;--hair:rgba(0,48,73,.16);--dot:rgba(0,48,73,.075);--blue:#1b5e85;

*{box-sizing:border-box}

<script>

/* ---------- Site H · Studio ---------- */
let theme = store.get("rj-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
document.documentElement.dataset.theme = theme;
const clock = () => new Date().toLocaleTimeString(lang === "es" ? "es-AR" : "en-GB", { timeZone: "America/Argentina/Buenos_Aires", hour: "2-digit", minute: "2-digit", hour12: false });
const DOCK = [["work", "work"], ["offers", "services"], ["about", "about"], ["contact", "contact"]];
const MAIN = ["WK.01", "WK.02", "WK.04"];
/* A composed architectural elevation, not a geographic or to-scale survey.
   Each landmark has its own clear silhouette; details stay inside its facade. */
const city = alt => {
  const repeat = (n, draw) => Array.from({ length: n }, (_, i) => draw(i)).join("");
  // Narrow paired jambs read as windows, with equal margins on every facade.
  const windows = (x, y, w, h, cols, rows) => repeat(cols, i => repeat(rows, j => {
    const cx = x + w * (i + .5) / cols, cy = y + h * (j + .5) / rows;
    return `M${cx - 1.6} ${cy - 2.5}v5h3.2v-5`;
  }));
  const block = (x, w, top, cols, rows) => `<path d="M${x} 222V${top}h${w}v${222 - top}M${x - 2} ${top + 5}h${w + 4}"/><path class="detail" d="${windows(x + 5, top + 11, w - 10, 202 - top, cols, rows)}"/>`;
  const tree = x => `M${x} 222v-17m0 7l-5-5m5 2l5-6M${x - 12} 204c-6-5-3-12 2-13-1-9 12-13 17-6 9-1 13 11 6 16 0 7-8 11-13 6-4 3-9 2-12-3Z`;
  const person = x => `<circle cx="${x}" cy="211" r="1.5"/><path d="M${x} 214v4m-2 4 2-4 2 4m-5-6 3-2 3 2"/>`;
  const kavanaghWindows = [
    [179, 151, 18, 61, 2, 7], [275, 151, 18, 61, 2, 7],
    [204, 114, 18, 98, 2, 11], [250, 114, 18, 98, 2, 11],
    [228, 57, 16, 155, 2, 17]
  ].map(args => windows(...args)).join("");
  return `<svg class="city" viewBox="0 0 1200 274" role="img" aria-label="${esc(alt)}">
<g class="context">
  ${block(40, 43, 174, 3, 3)}${block(94, 49, 134, 4, 6)}
  ${block(691, 38, 155, 3, 4)}${block(742, 43, 117, 3, 8)}${block(797, 30, 169, 2, 3)}
  ${block(1137, 37, 180, 3, 2)}
</g>
<!-- Kavanagh: recessed wings, a continuous central shaft and roof terraces. -->
<g>
  <path class="wash" d="M244 48h6v58h24v38h25v78h-55Z"/>
  <path class="outline" d="M173 222V144h25v-38h24V48h7V29h14v19h7v58h24v38h25v78"/>
  <path class="detail" d="M198 144v78m24-174v174m28-116v116m24-78v78M173 149h25m0-38h24m28 0h24m0 38h25M222 53h28M229 35h14M232 29v-5h8v5M226 217h20v5${kavanaghWindows}"/>
</g>
<!-- Congreso: lantern, ribbed dome, drum, pediment, paired columns, steps. -->
<g>
  <path class="wash" d="M450 87c20 10 29 26 30 49h-30ZM455 180h19v32h-19Z"/>
  <path class="outline" d="M356 216V173h49v-9h12v-25h-5v-4h7c0-22 12-40 26-48v-9h10v9c14 8 26 26 26 48h7v4h-5v25h12v9h49v43"/>
  <path d="M443 78v-7q7-9 14 0v7M450 66v-9M417 139h66M417 164h66M405 173l45-20 45 20M405 178h90M356 178h49m90 0h49M352 216h196m-200 3h204m-204 3h204"/>
  <path class="detail" d="M450 87c-8 12-13 28-13 48m13-48c8 12 13 28 13 48m-13-48v48M419 135h62M425 143v15m8-15v15m9-15v9m16-9v9m9-9v15m8-15v15M417 171l33-14 33 14M356 211h49m90 0h49${repeat(6, i => `M${413 + i * 14} 182v30m4-30v30m-5-30h6m-6 30h6`)}${windows(362, 183, 37, 23, 3, 1)}${windows(501, 183, 37, 23, 3, 1)}"/>
</g>
<!-- Obelisco: two faces, a quiet dimension and a stepped plinth. -->
<g>
  <path class="wash" d="M600 35l5 20 9 161h-14Z"/>
  <path class="outline" d="M586 216l9-161 5-20 5 20 9 161ZM582 222v-6h36v6"/>
  <path class="detail" d="M600 35v181M595 55h10M596 203v9h5v-9ZM597 69v6m6-6v6M577 222h46"/>
  <path class="guide axis" d="M600 19v10m0 198v9"/>
  <path class="guide" d="M618 35h22m-17 187h17M635 35v187M632 38l6-6m-6 193 6-6"/>
  <text x="649" y="130" text-anchor="middle" transform="rotate(-90 649 130)">${esc(T().cityHeight)}</text>
</g>
<!-- Puente de la Mujer: tapered mast and an ordered fan of stays. -->
<g>
  <path class="wash" d="M975 212l87-113-78 113Z"/>
  <path class="outline" d="M854 212h264v5H854M975 212l87-113-78 113M976 217l3 12h9l3-12"/>
  <path class="detail" d="${repeat(9, i => `M${870 + i * 12} 208L1058 104`)}M854 208h264${repeat(27, i => `M${858 + i * 10} 208v4`)}"/>

const themeIcon = () => theme === "dark" ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>' : '<path d="M20 14A8 8 0 0110 4a8 8 0 1010 10z"/>';
const dockMarkup = t => `<nav class="dock" aria-label="${esc(t.menu)}"><span class="cat" id="cat" aria-hidden="true">${pixelCat(2)}</span><button type="button" class="mn" data-menu aria-expanded="false" aria-controls="dlinks"><span id="mlabel">${t.menu}</span><span aria-hidden="true">▾</span></button><span class="lks" id="dlinks">${DOCK.map(([id, k]) => `<a href="#${id}" data-sec="${id}">${t.nav[k]}</a>`).join("")}</span><i aria-hidden="true"></i>
  <button type="button" data-theme-btn aria-label="${esc(t.themeLabel)}" aria-pressed="${theme === "dark"}"><svg viewBox="0 0 24 24" aria-hidden="true">${themeIcon()}</svg></button>
  <span class="lg" role="group" aria-label="${esc(t.langLabel)}"><button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="${lang === "en"}">EN</button><button type="button" data-lang="es" lang="es" aria-label="Español" aria-pressed="${lang === "es"}">ES</button></span></nav>`;
function render(t) {
  const m = t.pitch.match(/^(.*?)( into | en )(.*)$/);
  const h1 = m ? `${m[1]} <span>${m[2].trim()}&nbsp;${m[3]}</span>` : t.pitch;
  const sec = (id, title, body) => `<section class="sec" id="${id}"><h2>${title}</h2><div>${body}</div></section>`;
  const main = MAIN.map(c => t.cases.find(x => x.code === c)), rest = t.cases.filter(x => !MAIN.includes(x.code));
  const fid = c => "f" + c.code.replace(".", "");
  $("#app").innerHTML = `
<a class="skip" href="#main">${t.skip}</a>
<header class="w"><div class="hd">
  <a class="me" href="#top">${t.name}</a>
  <span class="k lk"><a href="${L.linkedin}" ${ext}>${t.footer.linkedin}</a><a href="${L.github}" ${ext}>${t.footer.github}</a></span>
</div></header>
<main id="main" class="w">
  <div class="hero" id="top">
    <h1>${h1}</h1>
    <p class="today">${t.heroIntro}</p>
    <p class="availability">${t.availability}</p>
    <div class="cta"><a class="btn" href="#contact">${t.cta} ↗</a><a class="btn o" href="#work">${t.seeWork}</a><span class="k">${t.remoteNote} · <span id="clock">${clock()}</span></span></div>
    <div class="cityw">${city(t.illo)}</div>
  </div>
  <nav class="hi" aria-label="${esc(t.h.work)}">${main.map(c => { const f = t.featured[c.code]; return `<a href="#${fid(c)}"><span class="n">${f.number}</span><span class="metric-label">${f.label}</span><b>${f.title} ›</b></a>`; }).join("")}</nav>

  <div id="work">${main.map(c => { const f = t.featured[c.code]; return `<section class="feat" id="${fid(c)}"><div><span class="k">${c.org} · ${c.when}</span><h2>${f.title}</h2><p class="case-summary">${f.summary}</p><p class="case-result">${c.impact}</p>${c.img ? `<img class="shot" src="${c.img}" alt="${esc(c.name)}" loading="lazy">` : ""}</div>
    <div><p>${c.body}</p><dl class="f"><dt>${t.fact.role}</dt><dd>${c.role}</dd><dt>${t.fact.stack}</dt><dd>${c.tags.join(", ")}</dd></dl>
      ${c.steps ? `<details class="more" id="case-${c.code}"><summary><span class="x" aria-hidden="true">+</span>${t.readCase}</summary><dl class="f">${c.steps.map(x => `<dt>${x.k}</dt><dd>${x.v}</dd>`).join("")}</dl></details>` : ""}</div></section>`; }).join("")}
    <details class="fold related" id="more-work"><summary><h3>${t.moreWork}</h3><span class="x" aria-hidden="true">+</span></summary><div class="b">${rest.map(c => `<h4>${c.name}</h4><p class="s">${c.org} · ${c.role} · ${c.when}</p><p>${caseBody(c)}</p>`).join("")}</div></details>
  </div>

  ${sec("offers", t.h.services, `<div class="services">${t.services.map((s, i) => `<article class="service"><span class="k">0${i + 1}</span><h3>${s.name}</h3><p>${s.body}</p><dl><dt>${t.delivLabel}</dt><dd>${s.deliv}</dd><dt>${t.idealLabel}</dt><dd>${s.ideal}</dd></dl></article>`).join("")}</div>
    <p>${t.freelance}</p>`)}

  ${sec("about", t.h.about, `${portrait()}<p class="lead">${t.profile[0]}</p>${t.profile.slice(1).map(p => `<p>${p}</p>`).join("")}
    <h3 class="sub">${t.approach}</h3>
    <ol class="steps">${t.think.steps.map((x, i) => `<li><span class="k">0${i + 1}</span><b>${x.q}</b><span class="s">${x.s}</span></li>`).join("")}</ol>
    <div style="margin-top:32px">${offClock()}</div>
    <details class="fold related" id="experience"><summary><h3>${t.expFold}</h3><span class="x" aria-hidden="true">+</span></summary><div class="b" style="max-width:none"><ul class="r">${expSplit(t, e => `<li><span class="k">${e.when}</span><span><b style="font-weight:500">${e.role}</b><br><span class="s">${e.org}</span></span></li>`, "li", "k")}</ul></div></details>`)}

  ${sec("books", t.h.books, `<p>${t.booksIntro}</p>${bookShelf()}`)}

  <section class="end" id="contact">
    <p class="big">${t.gotMind}</p>
    <div class="cta" style="margin:0 0 18px"><a class="btn" href="${mailto()}">${t.cta} ↗</a><button type="button" class="btn o" data-copy>${t.copy}</button></div>
    <p class="copy-status" id="copy-status" role="status" aria-live="polite" aria-atomic="true"></p>
    <p class="s"><a class="m" href="${mailto()}">${L.email}</a>, ${t.orLinkedin.replace("LinkedIn", `<a href="${L.linkedin}" ${ext}>LinkedIn</a>`)}.</p>
  </section>
  <footer class="k"><span>${t.footer.rights}</span><span>${footerLinks()}</span></footer>
</main>${dockMarkup(t)}`;
  spy(); walk();
}
/* The little panther walks along the top of the dock as you scroll: left at the top of the page, right at the bottom.
   The dock itself never moves. With reduced motion the panther stays put. */
const calm = matchMedia("(prefers-reduced-motion: reduce)");
function walk() {
  const c = $("#cat"); if (!c) return;
  if (calm.matches) { c.style.transform = ""; return; }
  const max = document.documentElement.scrollHeight - innerHeight, p = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
  c.style.transform = `translateX(${(p * Math.max(0, c.parentNode.clientWidth - c.offsetWidth - 32)).toFixed(1)}px)`;
}
function spy() {
  const readingLine = innerHeight * .35;
  const current = DOCK.find(([id]) => { const r = $("#" + id).getBoundingClientRect(); return r.top <= readingLine && r.bottom > readingLine; });
  $$(".dock a").forEach(a => { if (a.dataset.sec === current?.[0]) a.setAttribute("aria-current", "location"); else a.removeAttribute("aria-current"); });
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-theme-btn]"); if (!b) return;
  theme = theme === "dark" ? "light" : "dark"; store.set("rj-theme", theme);
  document.documentElement.dataset.theme = theme;
  b.setAttribute("aria-pressed", theme === "dark");
  $("svg", b).innerHTML = themeIcon();
  $('meta[name="theme-color"]').content = theme === "dark" ? "#00202f" : "#f4f6f7";
});
function closeMenu() {
  $(".dock")?.classList.remove("open");
  $("[data-menu]")?.setAttribute("aria-expanded", "false");
}
document.addEventListener("click", e => {
  const dk = $(".dock"); if (!dk) return;
  if (e.target.closest("[data-menu]")) {
    const open = !dk.classList.contains("open");
    dk.classList.toggle("open", open);
    $("[data-menu]").setAttribute("aria-expanded", open);
  } else if (!e.target.closest(".dock") || e.target.closest(".dock a")) closeMenu();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $(".dock.open")) { closeMenu(); $("[data-menu]").focus({ preventScroll: true }); } });
document.addEventListener("focusin", e => { if (!e.target.closest(".dock")) closeMenu(); });
let scrollFrame = 0;
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const status = $("#copy-status"); status.textContent = ""; b.disabled = true;
  try {
    if (!navigator.clipboard?.writeText) throw new Error("Clipboard unavailable");
    await navigator.clipboard.writeText(L.email);
    if (!b.isConnected) return;
    b.textContent = T().copied; status.textContent = T().copySuccess;
    setTimeout(() => { if (b.isConnected) b.textContent = T().copy; }, 1800);
  } catch {
    if (b.isConnected) { b.textContent = T().copy; status.textContent = T().copyError; }
  } finally { b.disabled = false; }
});
addEventListener("scroll", () => {
  if (scrollFrame) return;
  scrollFrame = requestAnimationFrame(() => { scrollFrame = 0; spy(); walk(); });
}, { passive: true });
addEventListener("resize", () => { spy(); walk(); if (innerWidth > 640) closeMenu(); });
setInterval(() => { const c = $("#clock"); if (c) c.textContent = clock(); }, 30000);
apply();
$('meta[name="theme-color"]').content = theme === "dark" ? "#00202f" : "#f4f6f7";
</script>
