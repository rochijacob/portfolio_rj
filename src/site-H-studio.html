<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocío Jacob · Product Engineer</title>
<meta name="description" content="">
<meta name="theme-color" content="#fdf0d5">
<meta property="og:type" content="website">
<meta property="og:title" content="Rocío Jacob · Product Engineer">
<meta property="og:description" content="I build products, automation and analytics so organizations decide better and do less manual work.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23003049'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' font-weight='700' text-anchor='middle' fill='%23fdf0d5'%3ERJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..600&family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Design rules for this direction: one accent, hairlines instead of boxes, a fixed
   label column, type does the work. If something needs a border to be understood, cut it.
   The page is a sheet of dotted sketch paper. */
:root{--bg:#fdf0d5;--ink:#003049;--soft:#4a6676;--hair:rgba(0,48,73,.18);--blue:#1b5e85;--sky:#669bbc;
  --dis:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;--txt:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) radial-gradient(rgba(0,48,73,.17) 1px,transparent 1.4px) 0 0/22px 22px;color:var(--ink);font:400 1.0625rem/1.6 var(--txt);font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;padding-bottom:120px}
::selection{background:var(--sky);color:var(--ink)}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.22em;text-decoration-color:var(--hair);transition:text-decoration-color .2s,color .2s}
a:hover{text-decoration-color:currentColor;color:var(--blue)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:4px;border-radius:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:16px;background:var(--ink);color:var(--bg);padding:8px 12px;z-index:99}
.w{max-width:1180px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}
.s{font-size:.875rem;color:var(--soft)}
.hd{display:flex;align-items:center;gap:8px 24px;min-height:72px}
.hd .me{font:500 1.0625rem var(--dis);text-decoration:none;margin-right:auto;padding:10px 0}
.lang{display:inline-flex;align-items:center;color:var(--soft);font-size:.875rem}
.lang button{min-width:36px;min-height:40px;color:var(--soft)}
.lang button[aria-pressed=true]{color:var(--ink);font-weight:500}
/* floating navigation, with the cat walking along its top edge as you scroll */
.dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;display:flex;gap:2px;padding:5px;background:var(--ink);border-radius:999px;max-width:calc(100vw - 16px);box-shadow:0 10px 30px -12px rgba(0,48,73,.55)}
.dock a{color:var(--bg);text-decoration:none;font-size:.875rem;padding:10px 15px;border-radius:999px;white-space:nowrap;transition:background .2s}
.dock a:hover{color:var(--bg);background:rgba(253,240,213,.14)}
.dock a[aria-current=true]{background:var(--bg);color:var(--ink)}
.dock .cat{position:absolute;bottom:100%;left:16px;line-height:0;will-change:transform}
.hero{padding:clamp(56px,10vw,132px) 0 clamp(56px,8vw,104px)}
h1{font:500 clamp(2.15rem,5.5vw,4.6rem)/1.04 var(--dis);letter-spacing:-.035em;margin:0;max-width:17ch;text-wrap:balance}
h1 span{color:#5a8fb1}
.hero .row{display:flex;flex-wrap:wrap;align-items:center;gap:18px 34px;margin-top:clamp(32px,5vw,56px)}
.hero p{margin:0;max-width:44ch;color:var(--soft)}
.btn{display:inline-block;background:var(--ink);color:var(--bg);padding:15px 24px;border-radius:999px;text-decoration:none;font-weight:500;font-size:.9375rem;transition:background .2s}
.btn:hover{background:var(--blue);color:var(--bg)}
.sec{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;padding:clamp(56px,8vw,104px) 0;border-top:1px solid var(--hair);scroll-margin-top:20px}
.sec>h2{grid-column:1/4;font:500 .875rem/1.6 var(--txt);margin:0 0 28px;color:var(--ink);position:sticky;top:28px;align-self:start}
.sec>h2 span{display:block;font-weight:400;color:var(--soft)}
.sec>div{grid-column:4/13;min-width:0}
h3{font:500 1.375rem/1.2 var(--dis);letter-spacing:-.02em;margin:0}
p{margin:0 0 1em;max-width:62ch;text-wrap:pretty}
.lead{font:400 clamp(1.3rem,2.2vw,1.75rem)/1.32 var(--dis);letter-spacing:-.02em;max-width:30ch;margin-bottom:1.2em}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--hair)}
.nums div{padding:26px 20px 30px 0}
.nums b{display:block;font:500 clamp(1.9rem,3.6vw,3rem)/1 var(--dis);letter-spacing:-.04em}
.nums span{display:block;margin-top:10px;font-size:.875rem;color:var(--soft);line-height:1.45;max-width:24ch}
.cols{display:grid;gap:36px 28px}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols h3{margin:10px 0 12px}.cols p{font-size:.9688rem;margin:0}
.c4 h3{font-size:1.1875rem}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:40px 0 0;padding:0;list-style:none}
.tags li{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--ink);border-radius:999px;padding:6px 13px;background:var(--bg)}
ul.r{list-style:none;margin:0;padding:0}
ul.r>li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:4px 24px;padding:16px 0;border-top:1px solid var(--hair)}
ul.r>li:first-child{border-top:0;padding-top:0}
/* track record: a ledger-style table whose rows open */
.th,summary{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,.9fr) minmax(0,1.1fr) 20px;gap:4px 24px;align-items:baseline}
.th{padding-bottom:12px;border-bottom:1px solid var(--ink);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
details{border-bottom:1px solid var(--hair)}
summary{padding:22px 0;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary h3{transition:color .2s}summary:hover h3{color:var(--blue)}
summary h3 small{display:block;font:400 .875rem/1.5 var(--txt);letter-spacing:0;color:var(--soft);margin-top:4px}
summary .i{font-weight:500;color:var(--ink)}
summary .x{font:400 1.25rem/1 var(--dis);transition:transform .25s;justify-self:end}
details[open] .x{transform:rotate(45deg)}
.b{padding:0 0 26px;max-width:62ch}
.portrait{display:block;width:88px;height:88px;border-radius:50%;background:rgba(102,155,188,.3);position:relative;overflow:hidden;margin-bottom:26px}
.portrait span{position:absolute;inset:0;display:grid;place-items:center;font:500 1.125rem var(--dis)}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.off{color:var(--soft)}
.end{padding:clamp(72px,12vw,160px) 0;border-top:1px solid var(--hair)}
.end .big{font:500 clamp(1.9rem,5.2vw,4.2rem)/1.06 var(--dis);letter-spacing:-.035em;margin:0 0 .5em;max-width:18ch;text-wrap:balance}
.end a.m{font:500 clamp(1.2rem,2.6vw,1.9rem)/1.3 var(--dis);letter-spacing:-.02em;text-decoration-color:var(--sky);text-decoration-thickness:2px;overflow-wrap:anywhere}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;padding:22px 0 20px;border-top:1px solid var(--hair);font-size:.875rem;color:var(--soft)}
footer a{margin-left:22px;display:inline-block;padding:10px 0}footer a:first-child{margin-left:0}
.rv{opacity:0;transition:opacity .9s ease}.rv.in{opacity:1}
@media(max-width:860px){
  .sec{display:block}.sec>h2{position:static}
  .nums{grid-template-columns:repeat(2,minmax(0,1fr))}.nums div:nth-child(n+3){border-top:1px solid var(--hair)}
  .c3,.c2{grid-template-columns:1fr}.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .th{display:none}details:first-of-type{border-top:1px solid var(--ink)}
  summary{grid-template-columns:minmax(0,1fr) 20px}summary>*{grid-column:1}
  summary .x{grid-row:1;grid-column:2}
  ul.r>li{grid-template-columns:1fr}
  .hd .clk{display:none}
}
@media(max-width:480px){.c4{grid-template-columns:1fr}.dock a{padding:10px 11px;font-size:.8125rem}.dock .opt{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.rv{opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/*CORE*/

/* ---------- Site H · Studio ---------- */
const clock = () => new Date().toLocaleTimeString(lang === "es" ? "es-AR" : "en-GB", { timeZone: "America/Argentina/Buenos_Aires", hour: "2-digit", minute: "2-digit", hour12: false });
const DOCK = [["work", "work"], ["offers", "services"], ["about", "about"], ["books", "books"], ["contact", "contact"]];
function render(t) {
  const d = t.d, m = t.pitch.match(/^(.*?)( so | para que )(.*)$/);
  const h1 = m ? `${m[1]}<span>${m[2]}${m[3]}</span>` : t.pitch;
  const sec = (id, title, body, sub = "") => `<section class="sec" id="${id}"><h2>${title}${sub ? `<span>${sub}</span>` : ""}</h2><div class="rv">${body}</div></section>`;
  $("#app").innerHTML = `
<a class="skip" href="#main">${t.skip}</a>
<header class="w"><div class="hd">
  <a class="me" href="#top">${t.name}</a>
  <span class="s clk">Buenos Aires, <span id="clock">${clock()}</span></span>
  ${langToggle()}
</div></header>
<main id="main" class="w">
  <div class="hero" id="top">
    <h1>${h1}</h1>
    <div class="row"><a class="btn" href="${mailto()}">${t.cta}</a><p>${t.sub}</p></div>
  </div>

  <div class="nums">${t.stats.slice(0, 4).map(s => `<div><b>${s.n}</b><span>${s.l}</span></div>`).join("")}</div>
  <div style="height:clamp(40px,6vw,72px)"></div>

  ${sec("thesis", d.thesisTitle, `<div class="cols c3">${d.thesis.map(x => `<div><h3>${x.h}</h3><p>${x.p}</p></div>`).join("")}</div>`, d.thesisSub)}

  ${sec("story", d.storyTitle, `<div class="cols c4">${d.story.map((x, i) => `<div><span class="s">[0${i + 1}]</span><h3>${x.h}</h3><p>${x.p}</p></div>`).join("")}</div>
    <ul class="tags">${d.pairs.map(p => `<li>${p}</li>`).join("")}</ul>`)}

  ${sec("work", d.positionsTitle, `<div class="th" aria-hidden="true"><span>${d.cols.position}</span><span>${d.cols.entry}</span><span>${d.cols.impact}</span><span></span></div>
    ${t.cases.map(c => `<details><summary><h3>${c.name}<small>${c.org} · ${c.role}</small></h3><span class="s">${c.when}</span><span class="s i">${c.impact}</span><span class="x" aria-hidden="true">+</span></summary>
    <div class="b"><p>${caseBody(c)}</p><p class="s">${c.tags.join(" · ")}${c.url ? ` · <a href="${c.url}" ${ext}>${t.repo}</a>` : ""}</p></div></details>`).join("")}`, t.h.work)}

  ${sec("offers", t.h.services, `<div class="cols c3" style="margin-bottom:44px">${t.services.map((s, i) => `<div><span class="s">0${i + 1}</span><h3>${s.name}</h3><p>${svcBody(s)}</p></div>`).join("")}</div>
    <p>${t.freelance}</p><a class="btn" href="${mailto()}">${t.ctaAlt}</a>`)}

  ${sec("about", t.h.about, `${portrait()}<p class="lead">${t.about[0]}</p>${t.about.slice(1).map(p => `<p>${p}</p>`).join("")}${offClock()}
    <ul class="r" style="margin-top:44px">${t.finance.map(f => `<li><span class="s">${f.k}</span><span>${f.v}</span></li>`).join("")}</ul>`)}

  ${sec("experience", t.h.experience, `<ul class="r">${t.timeline.map(e => `<li><span class="s">${e.when}</span><span><b style="font-weight:500">${e.role}</b><br><span class="s">${e.org}${e.note ? ". " + e.note : ""}</span></span></li>`).join("")}</ul>`)}

  ${sec("skills", t.h.skills, `<ul class="r">${t.skills.map(s => `<li><span class="s">${s.name}</span><span>${s.items.join(", ")}</span></li>`).join("")}</ul>`)}

  ${sec("lab", t.h.lab, `<p>${t.labIntro}</p><ul class="r" style="margin-top:28px">${t.lab.map(l => `<li><span style="font-weight:500">${labName(l)}</span><span class="s">${l.why}</span></li>`).join("")}</ul>`)}

  ${sec("books", t.h.books, `<p>${t.booksIntro}</p>${bookShelf()}<p class="s" style="margin-top:14px">${t.booksNote}</p>`)}

  ${sec("writing", t.h.writing, `<p>${t.writingIntro}</p><ul class="r" style="margin-top:28px">${content.writing.map(w => `<li><span class="s">${fmtDate(w.date)}${w.url ? "" : " · " + t.soon}</span><span style="font-weight:500">${w.url ? `<a href="${w.url}" ${ext}>${esc(w.title[lang])}</a>` : esc(w.title[lang])}</span></li>`).join("")}</ul>`)}

  <section class="end" id="contact">
    <p class="big">${t.contactTitle}</p>
    <p class="s" style="margin-bottom:26px">${t.contactBody}</p>
    <a class="m" href="${mailto()}">${L.email}</a>
  </section>
  <footer><span>${t.footer.rights}</span><span>${footerLinks()}</span></footer>
</main>
<nav class="dock" aria-label="Sections"><span class="cat" id="cat" aria-hidden="true">${pixelCat(2)}</span>${DOCK.map(([id, k], i) => `<a href="#${id}" data-sec="${id}"${i === 3 ? ' class="opt"' : ""}>${t.nav[k]}</a>`).join("")}</nav>`;
  walk(); spy();
}
/* The one flourish: a small pixel cat walks along the top of the navigation as you scroll. */
function walk() {
  const c = $("#cat"); if (!c) return;
  const max = document.documentElement.scrollHeight - innerHeight, p = max > 0 ? Math.min(1, scrollY / max) : 0;
  c.style.transform = `translateX(${(p * (c.parentNode.offsetWidth - 60)).toFixed(1)}px)`;
}
let so;
function spy() {
  if (so) so.disconnect();
  if (!("IntersectionObserver" in window)) return;
  so = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) $$(".dock a").forEach(a => a.setAttribute("aria-current", a.dataset.sec === e.target.id));
  }), { rootMargin: "-40% 0px -55% 0px" });
  DOCK.forEach(([id]) => so.observe($("#" + id)));
}
addEventListener("scroll", () => requestAnimationFrame(walk), { passive: true });
addEventListener("resize", walk);
setInterval(() => { const c = $("#clock"); if (c) c.textContent = clock(); }, 30000);
apply();
</script>
</body>
</html>
