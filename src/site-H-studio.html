/* The little panther walks along the top of the dock as you scroll: left at the top of the page, right at the bottom.
   The dock itself never moves. With reduced motion the panther stays put. */
const calm = matchMedia("(prefers-reduced-motion: reduce)");
function walk() {
  const c = $("#cat"); if (!c) return;
  if (calm.matches) { c.style.transform = ""; return; }
  const max = document.documentElement.scrollHeight - innerHeight, p = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
  c.style.transform = `translateX(${(p * Math.max(0, c.parentNode.clientWidth - c.offsetWidth - 32)).toFixed(1)}px)`;
  // One step every 28 px of scroll; the cat turns around when the page scrolls back up.
  c.dataset.f = Math.floor(scrollY / 28) % 2;
  if (scrollY !== lastY) c.classList.toggle("back", scrollY < lastY);
  lastY = scrollY;
}
let lastY = 0;
function spy() {
  const readingLine = innerHeight * .35;
  const current = DOCK.find(([id]) => { const r = $("#" + id).getBoundingClientRect(); return r.top <= readingLine && r.bottom > readingLine; });
  $$(".dock a[data-sec]").forEach(a => { if (a.dataset.sec === current?.[0]) a.setAttribute("aria-current", "location"); else a.removeAttribute("aria-current"); });
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-theme-btn]"); if (!b) return;
  theme = theme === "dark" ? "light" : "dark"; store.set("rj-theme", theme);
  document.documentElement.dataset.theme = theme;
  b.setAttribute("aria-pressed", theme === "dark");
  $("svg", b).innerHTML = themeIcon();
  $('meta[name="theme-color"]').content = theme === "dark" ? "#00202f" : "#f4f6f7";
  track("theme_change", { selected_theme: theme });
});
document.addEventListener("click", e => {
  const target = e.target.closest("[data-track-event]"); if (!target) return;
  const parameters = {};
  for (const [key, value] of Object.entries(target.dataset)) {
    if (key.startsWith("track") && key !== "trackEvent") {
      const raw = key.slice(5);
      const name = (raw[0].toLowerCase() + raw.slice(1)).replace(/[A-Z]/g, letter => `_${letter.toLowerCase()}`);
      parameters[name] = value;
    }
  }
  track(target.dataset.trackEvent, parameters);
});
/* A project box opens its case in a dialog. Escape, the close button or a click outside closes it.
   The open case survives a language change (render reopens it). */
function dismissCase(dialog){ if(calm.matches || !dialog.animate){dialog.close();return;} if(dialog.dataset.closing)return; dialog.dataset.closing="1"; dialog.animate([{opacity:1,transform:"translateY(0)"},{opacity:0,transform:"translateY(5px)"}],{duration:140,easing:"ease-in"}).finished.then(()=>{delete dialog.dataset.closing;if(dialog.open)dialog.close();}); }
document.addEventListener("cancel",event=>{if(event.target.matches("dialog.case")){event.preventDefault();dismissCase(event.target);}},true);
const insideDialog = (dialog,event) => { const rect=dialog.getBoundingClientRect(); return event.clientX>=rect.left && event.clientX<=rect.right && event.clientY>=rect.top && event.clientY<=rect.bottom; };
const syncCase = () => { const code=MAIN.find(item=>location.hash==="#f"+item.replace(".","")); const shown=document.querySelector("dialog[open]"); if(shown && shown.id!==location.hash.slice(1)) shown.close(); openCase=code||null; if(code) showCase(code); };
const showCase = code => { const d = document.getElementById("f" + code.replace(".", "")); if (d?.showModal && !d.open) { d.showModal(); d.querySelector("[data-close]").focus({ preventScroll: true }); } };
document.addEventListener("click", e => {
  const a = e.target.closest("[data-case]");
  if (a) { if (!$("#f" + a.dataset.case.replace(".", ""))?.showModal) return; if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return; e.preventDefault(); history.pushState({portfolioCase:true}, "", a.hash); openCase = a.dataset.case; showCase(openCase); track("case_open", { project_code: openCase }); return; }
  const d = e.target.closest("dialog.case");
  if (d && (e.target.closest("[data-close]") || (e.target === d && !insideDialog(d,e)))) dismissCase(d);
});
document.addEventListener("close", e => { if (e.target.matches?.("dialog.case")) { const c = e.target.id; if(location.hash==="#"+c){ if(history.state?.portfolioCase) history.back(); else history.replaceState(null,"",location.pathname+location.search+"#work"); } if(document.querySelector("dialog[open]")) return; openCase = null; $(`[data-case][aria-controls="${c}"]`)?.focus({ preventScroll: true }); } }, true);
document.addEventListener("toggle", e => {
  if (e.target.matches("details.more") && e.target.open) track("case_open", { project_code: e.target.id.replace("case-", "") });
}, true);
function closeMenu() {
  $(".dock")?.classList.remove("open");
  $("[data-menu]")?.setAttribute("aria-expanded", "false");
}
document.addEventListener("click", e => {
  const dk = $(".dock"); if (!dk) return;
  if (e.target.closest("[data-menu]")) {
    const open = !dk.classList.contains("open");
    dk.classList.toggle("open", open);
    $("[data-menu]").setAttribute("aria-expanded", open);
  } else if (!e.target.closest(".dock") || e.target.closest(".dock a")) closeMenu();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $(".dock.open")) { closeMenu(); $("[data-menu]").focus({ preventScroll: true }); } });
document.addEventListener("focusin", e => { if (!e.target.closest(".dock")) closeMenu(); });
let scrollFrame = 0;
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const status = $("#copy-status"); status.textContent = ""; b.disabled = true;
  try {
    if (!navigator.clipboard?.writeText) throw new Error("Clipboard unavailable");
    await navigator.clipboard.writeText(L.email);
    if (!b.isConnected) return;
    setCopy(b, true); status.textContent = T().copySuccess;
    track("email_copy", { result: "success" });
    setTimeout(() => { if (b.isConnected) setCopy(b, false); }, 1800);
  } catch {
    if (b.isConnected) { setCopy(b, false); status.textContent = T().copyError; }
    track("email_copy", { result: "failure" });
  } finally { b.disabled = false; }
});
addEventListener("scroll", () => {
  if (scrollFrame) return;
  scrollFrame = requestAnimationFrame(() => { scrollFrame = 0; spy(); walk(); });
}, { passive: true });
addEventListener("resize", () => { spy(); walk(); if (innerWidth > 640) closeMenu(); });
/* Loader: shown until the web fonts are in (at least 450 ms so it never flashes, at most 1.8 s so a
   slow font never blocks the page). The page is already rendered underneath; the hero intro starts as it lifts. */
document.body.insertAdjacentHTML("beforeend", `<div id="loader" aria-hidden="true"><span>${pixelCat(3)}${pixelCat(3, CAT_STEP)}</span></div>`);
apply();
addEventListener("hashchange",syncCase); syncCase();
const t0 = performance.now();
function lift() {
  const l = $("#loader"); if (!l || l.classList.contains("out")) return;
  document.documentElement.dataset.intro = ""; l.classList.add("out");
  setTimeout(() => l.remove(), 400);
  setTimeout(() => { delete document.documentElement.dataset.intro; }, 2400);
}
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(lift, Math.max(0, 450 - (performance.now() - t0))));
setTimeout(lift, 1800);
$('meta[name="theme-color"]').content = theme === "dark" ? "#00202f" : "#f4f6f7";
</script>
</body>
</html>
