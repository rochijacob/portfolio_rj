<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocío Jacob · Product Engineer</title>
<meta name="description" content="">
<meta name="theme-color" content="#f4f6f7">
<meta property="og:type" content="website">
<meta property="og:title" content="Rocío Jacob · Product Engineer">
<meta property="og:description" content="I build products, automation and analytics so organizations decide better and do less manual work.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23003049'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' font-weight='700' text-anchor='middle' fill='%23fdf0d5'%3ERJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Design rules for this direction: one accent, hairlines instead of boxes, generous air,
   a neutral grotesk with small uppercase mono labels. The page is dotted sketch paper.
   If something needs a border to be understood, cut it. */
:root{--bg:#f4f6f7;--acc:#5a8fb1;--ink:#003049;--soft:#4a6676;--hair:rgba(0,48,73,.16);--dot:rgba(0,48,73,.075);--blue:#1b5e85;
  --txt:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace}
:root[data-theme=dark]{--bg:#00202f;--acc:#7fb2d2;--ink:#f0f4f6;--soft:#a3b9c5;--hair:rgba(240,244,246,.17);--dot:rgba(240,244,246,.055);--blue:#a9d0e8}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) radial-gradient(var(--dot) 1px,transparent 1.4px) 0 0/22px 22px;color:var(--ink);font:400 1.0625rem/1.6 var(--txt);font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;padding-bottom:120px;transition:background-color .3s}
::selection{background:var(--acc);color:var(--bg)}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.22em;text-decoration-color:var(--hair);transition:text-decoration-color .2s,color .2s}
a:hover{text-decoration-color:currentColor;color:var(--blue)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:4px;border-radius:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:16px;background:var(--ink);color:var(--bg);padding:8px 12px;z-index:99}
.w{max-width:1180px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}
.k{font:400 .6875rem/1.6 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--soft)}
.s{font-size:.875rem;color:var(--soft)}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:4px 26px;min-height:76px}
.hd .me{font-weight:600;text-decoration:none;margin-right:auto;padding:10px 0;letter-spacing:-.01em}
.hd .k a{text-decoration:none;padding:12px 0;margin-left:18px}
.lang{display:inline-flex;align-items:center}
.lang button{min-width:34px;min-height:40px;font:400 .6875rem var(--mono);letter-spacing:.09em;color:var(--soft)}
.lang button[aria-pressed=true]{color:var(--ink);font-weight:500;text-decoration:underline;text-underline-offset:5px}
.theme{min-width:40px;min-height:40px;border-radius:50%;display:grid;place-items:center}
.theme svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;display:flex;gap:2px;padding:5px;background:var(--ink);border-radius:999px;max-width:calc(100vw - 16px);box-shadow:0 10px 30px -12px rgba(0,48,73,.55)}
.dock a{color:var(--bg);text-decoration:none;font-size:.875rem;padding:10px 15px;border-radius:999px;white-space:nowrap;transition:background .2s}
.dock a:hover{color:var(--bg);background:color-mix(in srgb,var(--bg) 16%,transparent)}
.dock a[aria-current=true]{background:var(--bg);color:var(--ink)}
.dock .cat{position:absolute;bottom:100%;left:16px;line-height:0;will-change:transform}
.hero{padding:clamp(64px,11vw,150px) 0 0}
h1{font:500 clamp(2.2rem,5.6vw,4.7rem)/1.03 var(--txt);letter-spacing:-.045em;margin:0;max-width:16ch;text-wrap:balance}
h1 span{color:var(--acc)}
.today{margin:clamp(22px,3vw,34px) 0 0;max-width:46ch;font-size:1.125rem;color:var(--soft)}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:clamp(26px,4vw,40px)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:999px;text-decoration:none;font-weight:500;font-size:.9375rem;border:1px solid var(--ink);transition:background .2s,color .2s}
.btn:hover{background:var(--blue);border-color:var(--blue);color:var(--bg)}
.btn.o{background:transparent;color:var(--ink)}.btn.o:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cta .k{margin-left:auto}
.city{display:block;width:100%;height:auto;margin-top:clamp(36px,6vw,72px);overflow:visible}
.city{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-linecap:round}
.city .g{stroke-width:2.2}.city .l{stroke-width:.6}.city .a{stroke:var(--acc);stroke-width:.8}.city .d{stroke-dasharray:14 4 2 4;stroke-width:.6}
.city text{font:400 8.5px var(--mono);letter-spacing:.09em;fill:var(--soft);stroke:none}
.hi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.hi a{display:block;padding:22px 22px 0 0;text-decoration:none}
.hi b{display:block;font-weight:500}.hi a:hover b{color:var(--blue)}
.hi .s{display:block;margin:2px 0 10px}
.feat{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;padding:clamp(72px,10vw,136px) 0 0;scroll-margin-top:10px}
.feat h2{grid-column:1/7;font:500 clamp(1.8rem,3.5vw,3rem)/1.06 var(--txt);letter-spacing:-.04em;margin:10px 0 28px;text-wrap:balance}
.feat h2 span{color:var(--acc)}
.feat>div:first-child{grid-column:1/7}.feat>div:last-child{grid-column:7/13}
.feat p{font-size:1.125rem;line-height:1.55}
dl.f{margin:28px 0 0;display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr);border-top:1px solid var(--hair)}
dl.f dt,dl.f dd{margin:0;padding:13px 0;border-bottom:1px solid var(--hair);font-size:.9375rem}
dl.f dt{font:400 .6875rem/2.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--soft)}
.sec{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;padding:clamp(72px,10vw,136px) 0 0;scroll-margin-top:10px}
.sec>h2{grid-column:1/4;font:400 .6875rem/1.8 var(--mono);letter-spacing:.09em;text-transform:uppercase;margin:0 0 28px;color:var(--ink);position:sticky;top:28px;align-self:start}
.sec>h2 span{display:block;color:var(--soft)}
.sec>div{grid-column:4/13;min-width:0}
h3{font:500 1.3125rem/1.2 var(--txt);letter-spacing:-.025em;margin:0}
p{margin:0 0 1em;max-width:62ch;text-wrap:pretty}
.lead{font:400 clamp(1.3rem,2.2vw,1.7rem)/1.32 var(--txt);letter-spacing:-.025em;max-width:30ch;margin-bottom:1.2em}
.cols{display:grid;gap:36px 28px}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cols h3{margin:10px 0 12px}.cols p{font-size:.9688rem;margin:0}
.c4 h3{font-size:1.125rem}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:40px 0 0;padding:0;list-style:none}
.tags li{font:400 .6875rem/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;border:1px solid var(--ink);border-radius:999px;padding:8px 13px;background:var(--bg)}
ul.r{list-style:none;margin:0;padding:0}
ul.r>li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:4px 24px;padding:16px 0;border-top:1px solid var(--hair)}
ul.r>li:first-child{border-top:0;padding-top:0}
.th,summary{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,.9fr) minmax(0,1.1fr) 20px;gap:4px 24px;align-items:baseline}
.th{padding-bottom:12px;border-bottom:1px solid var(--ink)}
details{border-bottom:1px solid var(--hair)}
summary{padding:22px 0;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary h3{transition:color .2s}summary:hover h3{color:var(--blue)}
summary h3 small{display:block;font:400 .875rem/1.5 var(--txt);letter-spacing:0;color:var(--soft);margin-top:4px}
summary .i{font-weight:500;color:var(--ink)}
summary .x{font-size:1.25rem;line-height:1;transition:transform .25s;justify-self:end}
details[open] .x{transform:rotate(45deg)}
.b{padding:0 0 26px;max-width:62ch}
.portrait{display:block;width:112px;height:112px;border-radius:50%;background:color-mix(in srgb,var(--acc) 28%,transparent);position:relative;overflow:hidden;margin-bottom:26px}
.portrait span{position:absolute;inset:0;display:grid;place-items:center;font-weight:500}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.off{color:var(--soft)}
.spcap{font-size:.875rem;color:var(--soft)}
.end{padding:clamp(96px,14vw,190px) 0 clamp(72px,10vw,136px)}
.end .big{font:500 clamp(2rem,5.4vw,4.4rem)/1.04 var(--txt);letter-spacing:-.045em;margin:0 0 .6em;max-width:16ch;text-wrap:balance}
.end .big span{color:var(--acc)}
.end a.m{font-weight:500;overflow-wrap:anywhere;text-decoration-color:var(--acc);text-decoration-thickness:2px}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;padding:22px 0 20px}
footer a{margin-left:22px;display:inline-block;padding:10px 0}footer a:first-child{margin-left:0}
.rv{opacity:0;transition:opacity .9s ease}.rv.in{opacity:1}
@media(max-width:860px){
  .sec,.feat{display:block}.sec>h2{position:static}
  .hi{grid-template-columns:1fr}.hi a{padding-top:18px}
  .c3{grid-template-columns:1fr}.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .th{display:none}details:first-of-type{border-top:1px solid var(--ink)}
  summary{grid-template-columns:minmax(0,1fr) 20px}summary>*{grid-column:1}
  summary .x{grid-row:1;grid-column:2}
  ul.r>li{grid-template-columns:1fr}
  .hd .lk{display:none}.cta .k{margin-left:0;flex-basis:100%}
}
@media(max-width:480px){.c4{grid-template-columns:1fr}.dock a{padding:10px 11px;font-size:.8125rem}.dock .opt{display:none}dl.f{grid-template-columns:1fr}dl.f dt{border:0;padding-bottom:0}dl.f dd{padding-top:2px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.rv{opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/*CORE*/

/* ---------- Site H · Studio ---------- */
let theme = store.get("rj-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
document.documentElement.dataset.theme = theme;
const clock = () => new Date().toLocaleTimeString(lang === "es" ? "es-AR" : "en-GB", { timeZone: "America/Argentina/Buenos_Aires", hour: "2-digit", minute: "2-digit", hour12: false });
const DOCK = [["work", "work"], ["offers", "services"], ["about", "about"], ["books", "books"], ["contact", "contact"]];
const MAIN = ["WK.01", "WK.02", "WK.04"];
/* Buenos Aires as an architect's croquis: an elevation with overshooting corners, centre lines,
   a dimension line, a hatched ground and small annotations. */
const city = alt => {
  const G = 200, o = 6;
  const box = (x, w, h, yb = G) => `M${x - o} ${yb - h}H${x + w + o}M${x} ${yb - h - o}V${yb}M${x + w} ${yb - h - o}V${yb}`;
  let hatch = ""; for (let x = 30; x < 840; x += 13) hatch += `M${x} ${G + 5}l-7 9`;
  const tree = (x, r) => `M${x} ${G}v${-r * .5}M${x - r} ${G - r * 1.5}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0M${x - r * .6} ${G - r * 2.1}l${r * 1.2} ${r * 1.2}M${x + r * .6} ${G - r * 2.1}l${-r * 1.2} ${r * 1.2}`;
  const man = x => `M${x} ${G}v-9M${x - 2} ${G - 11.5}a2 2 0 1 0 4 0a2 2 0 1 0 -4 0`;
  return `<svg class="city" viewBox="0 0 1200 250" role="img" aria-label="${esc(alt)}">
<defs><filter id="hand" x="-2%" y="-10%" width="104%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="1" seed="5"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter></defs>
<g filter="url(#hand)">
<path class="g" d="M14 ${G}H1186"/>
<path class="l" d="${hatch}M860 ${G + 8}h70M950 ${G + 12}h90M1060 ${G + 8}h70M900 ${G + 16}h50"/>
<path d="${box(72, 44, 50)}${box(124, 40, 82)}"/>
<path d="${box(196, 96, 58)}${box(210, 68, 30, G - 58)}${box(223, 42, 28, G - 88)}${box(233, 22, 24, G - 116)}M244 ${G - 140}V34"/>
<path class="l" d="M196 ${G - 20}h96M210 ${G - 70}h68M132 ${G - 30}h24M132 ${G - 50}h24M80 ${G - 24}h28"/>
<path d="${box(372, 156, 38)}M398 ${G - 38}H502M408 ${G - 38}a42 46 0 0 1 84 0${box(443, 14, 11, G - 84)}M450 ${G - 95}V${G - 116}"/>
<path class="l" d="M392 ${G - 38}V${G}M412 ${G - 38}V${G}M432 ${G - 38}V${G}M468 ${G - 38}V${G}M488 ${G - 38}V${G}M508 ${G - 38}V${G}M428 ${G - 38}c2-26 12-40 22-44M472 ${G - 38}c-2-26-12-40-22-44"/>
<path d="M588 ${G + 4}L596.4 56M612 ${G + 4}L603.6 56M590 62H610M595.5 64L600.6 34M604.5 64L599.4 34"/>
<path d="${box(662, 34, 64)}${box(702, 40, 106)}${box(752, 30, 76)}"/>
<path class="l" d="M670 ${G - 20}h18M670 ${G - 40}h18M710 ${G - 30}h24M710 ${G - 60}h24M710 ${G - 90}h24M760 ${G - 30}h14M760 ${G - 54}h14"/>
<path d="M840 ${G - 4}H1118M954 ${G + 6}L1060 84M958 ${G - 4}a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/>
<path class="l" d="M1052 93L878 ${G - 4}M1052 93L910 ${G - 4}M1052 93L940 ${G - 4}M1052 93L992 ${G - 4}M1052 93l-28 ${G - 97}"/>
<path class="l" d="${tree(330, 15)}${tree(558, 11)}${tree(808, 12)}${man(524)}${man(536)}${man(642)}${man(1090)}"/>
</g>
<g class="a">
<path class="d" d="M600 16V${G + 22}M450 60V${G + 22}"/>
<path d="M634 34V${G}M628 34h12M628 ${G}h12M631 37l6-6M631 ${G + 3}l6-6"/>
<path d="M1146 70V28M1146 28l-6 12M1146 28l6 12M1132 56a14 14 0 1 0 28 0a14 14 0 1 0 -28 0"/>
<path class="l" d="M244 30l14-10h34M450 56l14-10h30M1060 84l-12-12h-36"/>
</g>
<text x="646" y="${G - 78}" transform="rotate(-90 646 ${G - 78})">67.5 m</text>
<text x="600" y="11" text-anchor="middle">OBELISCO</text>
<text x="296" y="23">KAVANAGH</text><text x="498" y="49">CONGRESO</text><text x="1008" y="75" text-anchor="end">PUENTE DE LA MUJER</text>
<text x="1146" y="20" text-anchor="middle">N</text>
<text x="14" y="${G + 40}">BUENOS AIRES · 34°36′S 58°22′W</text>
</svg>`;
};
function render(t) {
  const d = t.d, m = t.pitch.match(/^(.*?)( so | para que )(.*)$/);
  const h1 = m ? `${m[1]}<span>${m[2]}${m[3]}</span>` : t.pitch;
  const sec = (id, title, body, sub = "") => `<section class="sec" id="${id}"><h2>${title}${sub ? `<span>${sub}</span>` : ""}</h2><div class="rv">${body}</div></section>`;
  const main = MAIN.map(c => t.cases.find(x => x.code === c)), rest = t.cases.filter(x => !MAIN.includes(x.code));
  const fid = c => "f" + c.code.replace(".", "");
  $("#app").innerHTML = `
<a class="skip" href="#main">${t.skip}</a>
<header class="w"><div class="hd">
  <a class="me" href="#top">${t.name}</a>
  <span class="k lk"><a href="mailto:${L.email}">${t.footer.email}</a><a href="${L.linkedin}" ${ext}>${t.footer.linkedin}</a><a href="${L.github}" ${ext}>${t.footer.github}</a></span>
  <button class="theme" type="button" data-theme-btn aria-label="${esc(t.themeLabel)}" aria-pressed="${theme === "dark"}"><svg viewBox="0 0 24 24" aria-hidden="true">${theme === "dark" ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>' : '<path d="M20 14A8 8 0 0110 4a8 8 0 1010 10z"/>'}</svg></button>
  ${langToggle()}
</div></header>
<main id="main" class="w">
  <div class="hero" id="top">
    <h1>${h1}</h1>
    <p class="today">${t.today}</p>
    <div class="cta"><a class="btn" href="${mailto()}">${t.cta} ↗</a><a class="btn o" href="#work">${t.seeWork}</a><span class="k">${t.remoteNote} · <span id="clock">${clock()}</span></span></div>
    ${city(t.illo)}
  </div>
  <nav class="hi" aria-label="${esc(t.h.work)}">${main.map(c => `<a href="#${fid(c)}"><b>${c.name} ›</b><span class="s">${c.org} · ${c.role}</span><span class="k">${c.impact}</span></a>`).join("")}</nav>

  <div id="work">${main.map(c => `<section class="feat" id="${fid(c)}"><div class="rv"><span class="k">${c.org} · ${c.when}</span><h2 style="grid-column:auto">${c.name}. <span>${c.line}</span></h2></div>
    <div class="rv"><p>${c.body}</p><dl class="f">${(c.steps || []).map(x => `<dt>${x.k}</dt><dd>${x.v}</dd>`).join("")}<dt>${t.fact.scale}</dt><dd>${c.impact}</dd><dt>${t.fact.role}</dt><dd>${c.role}</dd><dt>${t.fact.stack}</dt><dd>${c.tags.join(", ")}</dd></dl></div></section>`).join("")}</div>

  ${sec("more", t.moreWork, `<div class="th k" aria-hidden="true"><span>${d.cols.position}</span><span>${d.cols.entry}</span><span>${d.cols.impact}</span><span></span></div>
    ${rest.map(c => `<details><summary><h3>${c.name}<small>${c.org} · ${c.role}</small></h3><span class="s">${c.when}</span><span class="s i">${c.impact}</span><span class="x" aria-hidden="true">+</span></summary>
    <div class="b"><p>${caseBody(c)}</p><p class="s">${c.tags.join(" · ")}${c.url ? ` · <a href="${c.url}" ${ext}>${t.repo}</a>` : ""}</p></div></details>`).join("")}`)}

  ${sec("offers", t.h.services, `<div class="cols c3" style="margin-bottom:44px">${t.services.map((s, i) => `<div><span class="k">0${i + 1}</span><h3>${s.name}</h3><p>${svcBody(s)}</p></div>`).join("")}</div>
    <p>${t.freelance}</p><div class="cta" style="margin-top:22px"><a class="btn" href="${mailto()}">${t.ctaAlt} ↗</a></div>`)}

  ${sec("thesis", d.thesisTitle, `<div class="cols c3">${d.thesis.map(x => `<div><h3>${x.h}</h3><p>${x.p}</p></div>`).join("")}</div>`, d.thesisSub)}

  ${sec("about", t.h.about, `${portrait()}<p class="lead">${t.about[2]}</p>
    <div class="cols c4" style="margin-top:44px">${d.story.map((x, i) => `<div><span class="k">[0${i + 1}]</span><h3>${x.h}</h3><p>${x.p}</p></div>`).join("")}</div>
    <ul class="tags">${d.pairs.map(p => `<li>${p}</li>`).join("")}</ul>
    <div style="margin-top:36px">${offClock()}</div>`)}

  ${sec("experience", t.h.experience, `<ul class="r">${expSplit(t, e => `<li><span class="k">${e.when}</span><span><b style="font-weight:500">${e.role}</b><br><span class="s">${e.org}${e.note ? ". " + e.note : ""}</span></span></li>`, "li", "k")}</ul>`)}

  ${sec("skills", t.h.skills, `<ul class="r">${t.skills.map(s => `<li><span class="k">${s.name}</span><span>${s.items.join(", ")}</span></li>`).join("")}</ul>`)}

  ${sec("lab", t.h.lab, `<p>${t.labIntro}</p><ul class="r" style="margin-top:28px">${t.lab.map(l => `<li><span><span style="font-weight:500">${labName(l)}</span><br><span class="k">${l.status}</span></span><span class="s">${l.why}</span></li>`).join("")}</ul>`)}

  ${sec("books", t.h.books, `<p>${t.booksIntro}</p>${bookShelf()}`)}

  <section class="end" id="contact">
    <p class="big">${t.gotMind} <span>${t.cta}.</span></p>
    <div class="cta" style="margin:0 0 22px"><a class="btn" href="${mailto()}">${t.cta} ↗</a></div>
    <p class="s">${t.reach} <a class="m" href="${mailto()}">${L.email}</a></p>
  </section>
  <footer class="k"><span>${t.footer.rights}</span><span>${footerLinks()}</span></footer>
</main>
<nav class="dock" aria-label="Sections"><span class="cat" id="cat" aria-hidden="true">${pixelCat(2)}</span>${DOCK.map(([id, k], i) => `<a href="#${id}" data-sec="${id}"${i === 3 ? ' class="opt"' : ""}>${t.nav[k]}</a>`).join("")}</nav>`;
  walk(); spy();
}
/* The one flourish: a small pixel cat walks along the top of the navigation as you scroll. */
function walk() {
  const c = $("#cat"); if (!c) return;
  const max = document.documentElement.scrollHeight - innerHeight, p = max > 0 ? Math.min(1, scrollY / max) : 0;
  c.style.transform = `translateX(${(p * (c.parentNode.offsetWidth - 60)).toFixed(1)}px)`;
}
let so;
function spy() {
  if (so) so.disconnect();
  if (!("IntersectionObserver" in window)) return;
  so = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) $$(".dock a").forEach(a => a.setAttribute("aria-current", a.dataset.sec === e.target.id));
  }), { rootMargin: "-40% 0px -55% 0px" });
  DOCK.forEach(([id]) => so.observe($("#" + id)));
}
document.addEventListener("click", e => {
  if (!e.target.closest("[data-theme-btn]")) return;
  theme = theme === "dark" ? "light" : "dark"; store.set("rj-theme", theme);
  document.documentElement.dataset.theme = theme;
  const y = scrollY; apply(); scrollTo(0, y); $("[data-theme-btn]").focus();
});
addEventListener("scroll", () => requestAnimationFrame(walk), { passive: true });
addEventListener("resize", walk);
setInterval(() => { const c = $("#clock"); if (c) c.textContent = clock(); }, 30000);
apply();
</script>
</body>
