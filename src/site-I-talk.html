<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocío Jacob · Product Engineer</title>
<meta name="description" content="">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f6f7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23003049'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' font-weight='700' text-anchor='middle' fill='%23fdf0d5'%3ERJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* I · Charla. Lab direction: the copy does the work. Conversational sentences with the
   links inside them, a tall serif for headings, a soft grotesk for everything else. */
:root{--bg:#f4f6f7;--ink:#003049;--soft:#4a6676;--acc:#3d7aa3;--line:rgba(0,48,73,.18);--dot:rgba(0,48,73,.15);--shelf:#003049;
  --serif:"Instrument Serif",Georgia,serif;--txt:"Hanken Grotesk",system-ui,sans-serif}
:root[data-theme=dark]{--bg:#00202f;--ink:#f0f4f6;--soft:#a3b9c5;--acc:#8fbcd6;--line:rgba(240,244,246,.2);--dot:rgba(240,244,246,.09);--shelf:#669bbc}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) radial-gradient(circle,var(--dot) 1.1px,transparent 1.3px) 0 0/22px 22px;color:var(--ink);font:400 1.0625rem/1.7 var(--txt);-webkit-font-smoothing:antialiased;transition:background-color .3s}
a{color:inherit;text-decoration-color:var(--acc);text-underline-offset:4px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:var(--ink);color:var(--bg);padding:8px 12px;z-index:9}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}
header{display:flex;align-items:center;gap:10px;padding:22px 0;border-bottom:1px dashed var(--line)}
header .me{display:flex;align-items:center;gap:12px;margin-right:auto;text-decoration:none}
.portrait{width:40px;height:40px;border-radius:50%;background:var(--line);display:grid;place-items:center;overflow:hidden;position:relative;font-size:.8rem}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
header nav a{text-decoration:none;color:var(--soft);padding:10px 8px;font-size:.95rem}
.lang{display:inline-flex;align-items:center;color:var(--soft);font-size:.85rem}
.lang button,.theme{min-width:40px;min-height:40px;font-size:.85rem}
.lang button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:4px}
.theme{border:1px dashed var(--line);border-radius:50%;font-size:1rem}
h1{font:400 clamp(3.2rem,2rem + 5vw,5.4rem)/1 var(--serif);letter-spacing:-.015em;margin:72px 0 6px}
.tags{color:var(--soft);font-size:1.15rem;margin:0 0 28px}
.tags i{font-style:normal;color:var(--acc);margin:0 10px}
.intro{font-size:1.2rem;line-height:1.6;margin:0 0 18px}
.say{font-size:1.2rem;line-height:1.9;color:var(--soft);margin:0}
/* Inline link chips: a thin dashed border, never a filled pill. */
.chip{display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;border:1px dashed var(--acc);border-radius:6px;padding:0 8px;line-height:1.6;white-space:nowrap;transition:background .2s}
.chip:hover{background:rgba(61,122,163,.12)}
.chip svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
section{margin-top:104px}
h2{font:italic 400 clamp(2rem,1.5rem + 2vw,2.8rem)/1.05 var(--serif);margin:0 0 30px}
.case{border-top:1px dashed var(--line)}
.case summary{list-style:none;display:grid;grid-template-columns:7.5rem 1fr auto;gap:6px 22px;align-items:baseline;padding:22px 0;cursor:pointer}
.case summary::-webkit-details-marker{display:none}
.case .n{font:400 2.6rem/1 var(--serif);grid-row:span 2}
.case h3{font:600 1.15rem/1.3 var(--txt);margin:0}
.case .s{grid-column:2;color:var(--soft);margin:0}
.case .go{font-size:.85rem;color:var(--acc);white-space:nowrap;min-height:28px}
.case[open] .go .o,.case:not([open]) .go .c{display:none}
.case .x{padding:0 0 26px calc(7.5rem + 22px);color:var(--soft)}
.case .x p{margin:0 0 10px}
.svc{display:grid;gap:26px}
.svc h3{font:600 1.15rem var(--txt);margin:0 0 4px}
.svc p{margin:0;color:var(--soft)}
.prof p{color:var(--soft)}
.prof p:first-of-type{color:var(--ink);font-size:1.2rem}
.off{color:var(--soft);font-size:.98rem}
.end{text-align:center;padding-bottom:40px}
.end h2{font-style:normal;font-size:clamp(2.4rem,1.6rem + 3vw,3.8rem)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:0 26px;border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:500;margin-top:14px}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 20px;border-top:1px dashed var(--line);padding:18px 0 40px;color:var(--soft);font-size:.9rem}
footer a{display:inline-block;padding:10px 0;margin-left:16px}
@media(max-width:640px){.wrap{padding:0 18px}header nav{display:none}h1{margin-top:48px}section{margin-top:80px}.case summary{grid-template-columns:5.6rem 1fr}.case .n{font-size:2rem;grid-row:span 3}.case .go{grid-column:2;grid-row:3}.case .x{padding-left:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
/*CORE*/

/* ---------- Site I · Charla ---------- */
let theme = store.get("rj-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
document.documentElement.dataset.theme = theme;
const MAIN = ["WK.01", "WK.02", "WK.04"];
const ICON = { mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>', in: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/>', gh: '<path d="M9 19c-4 1.5-4-2-6-2.5m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12 12 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/>' };
const chip = (href, icon, label, external) => `<a class="chip" href="${href}"${external ? " " + ext : ""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[icon]}</svg>${label}</a>`;

function render(t) {
  const k = t.talk;
  const say = esc(k.avail).replace("{email}", chip(mailto(), "mail", "Email")).replace("{linkedin}", chip(L.linkedin, "in", "LinkedIn", true)).replace("{github}", chip(L.github, "gh", "GitHub", true));
  const cases = t.cases.filter(c => MAIN.includes(c.code));
  $("#app").innerHTML = `
<a class="skip" href="#main">${t.skip}</a>
<header>
  <a class="me" href="#top" id="top">${portrait()}<span>${t.name}</span></a>
  <nav aria-label="${esc(t.menu)}"><a href="#work">${t.nav.work}</a><a href="#about">${t.nav.about}</a></nav>
  ${langToggle()}
  <button class="theme" type="button" data-theme-btn aria-label="${esc(t.themeLabel)}" aria-pressed="${theme === "dark"}">${theme === "dark" ? "☀" : "☾"}</button>
</header>
<main id="main">
  <h1>${k.hello}</h1>
  <p class="tags">${k.tags.join('<i aria-hidden="true">•</i>')}</p>
  <p class="intro">${k.intro}</p>
  <p class="say">${say}</p>

  <section id="work">
    <h2>${k.work}</h2>
    ${cases.map((c, i) => { const f = t.featured[c.code]; return `<details class="case" id="case-${i}"><summary><span class="n">${f.number}</span><h3>${f.title}</h3><span class="go"><span class="o">${k.more} +</span><span class="c">${k.less} −</span></span><p class="s">${f.summary} <span style="color:var(--acc)">${f.label}</span></p></summary><div class="x"><p>${c.body}</p><p>${c.role} · ${c.when}</p></div></details>`; }).join("")}
  </section>

  <section>
    <h2>${k.services}</h2>
    <div class="svc">${t.services.map(s => `<div><h3>${s.name}</h3><p>${s.body}</p></div>`).join("")}</div>
  </section>

  <section id="about" class="prof">
    <h2>${k.about}</h2>
    ${t.profile.map(p => `<p>${p}</p>`).join("")}
    ${offClock()}
  </section>

  <section>
    <h2>${k.books}</h2>
    ${bookShelf(true)}
  </section>

  <section class="end" id="contact">
    <h2>${k.contact}</h2>
    <p style="color:var(--soft);margin:0">${t.contactBody}</p>
    <a class="btn" href="${mailto()}">${t.cta} ↗</a>
  </section>
</main>
<footer><span>${t.footer.rights}</span><span>${footerLinks()}</span></footer>`;
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-theme-btn]")) {
    theme = theme === "dark" ? "light" : "dark"; store.set("rj-theme", theme);
    document.documentElement.dataset.theme = theme; apply(); $("[data-theme-btn]").focus();
  }
});
apply();
</script>
</body>
</html>
