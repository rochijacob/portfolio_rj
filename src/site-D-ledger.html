<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocío Jacob · Product Engineer</title>
<meta name="description" content="">
<meta name="theme-color" content="#f4f6f7">
<meta property="og:type" content="website">
<meta property="og:title" content="Rocío Jacob · Product Engineer">
<meta property="og:description" content="I build products, automation and analytics so organizations decide better and do less manual work.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23003049'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' font-weight='700' text-anchor='middle' fill='%23fdf0d5'%3ERJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f6f7;--card:#ffffff;--ink:#003049;--mut:#48606e;--line:#c5d4da;--grid:#e2e9ed;--up:#1f7a4d;--upbg:#e2efdc;--sky:#669bbc;
  --sans:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;--hand:"Caveat","Segoe Script","Bradley Hand",cursive}
:root[data-theme=dark]{--paper:#00202f;--card:#002a3d;--ink:#f0f4f6;--mut:#a3b9c5;--line:#1b4a60;--grid:#072d40;--up:#63d19b;--upbg:#0c3a36;--sky:#669bbc}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:400 1.02rem/1.6 var(--sans);background:var(--paper) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
a{color:inherit;text-underline-offset:3px}a:hover{color:var(--up)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--up);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:var(--ink);color:var(--paper);padding:8px 12px;z-index:99}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.mono{font:400 .76rem/1.5 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:4px 20px;padding:16px 0;border-bottom:1.5px solid var(--ink)}
.tk{font:500 1rem var(--mono);background:var(--ink);color:var(--paper);padding:9px 12px;border-radius:4px;text-decoration:none;margin-right:auto}
.tk:hover{color:var(--paper);background:var(--up)}
header nav{display:flex;flex-wrap:wrap;gap:2px 16px}
header nav a{font:400 .76rem var(--mono);text-transform:uppercase;text-decoration:none;padding:11px 0;letter-spacing:.04em}
.lang{display:inline-flex;align-items:center;gap:2px;font:400 .76rem var(--mono);color:var(--mut)}
.lang button{min-width:40px;min-height:40px;font:500 .76rem var(--mono);color:var(--mut)}
.lang button[aria-pressed=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--up)}
.theme{min-width:40px;min-height:40px;border:1px solid var(--line);border-radius:6px}
.hero{position:relative;display:grid;gap:36px;padding:64px 0 56px;align-items:center}
.rings{position:absolute;left:50%;top:50%;width:min(900px,150vw);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 46px,var(--sky) 46px 47px);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);pointer-events:none;z-index:-1}
.hero{overflow:hidden;isolation:isolate}
.note{background:var(--card);border:1px solid var(--line);box-shadow:0 1px 0 #fff inset,0 18px 40px -18px rgba(0,48,73,.35);padding:34px 30px 22px;transform:rotate(-1.6deg);max-width:440px;justify-self:center;position:relative}
.note::before{content:"";position:absolute;top:-12px;left:50%;width:92px;height:24px;background:rgba(102,155,188,.45);transform:translateX(-50%) rotate(2deg)}
.note p{font:600 clamp(2.1rem,6vw,3rem)/1.08 var(--hand);margin:0 0 18px}
.note .sig{font:500 1.5rem var(--hand);display:flex;justify-content:space-between;align-items:baseline}
.intro h1{font:600 clamp(1.7rem,4vw,2.5rem)/1.15 var(--sans);letter-spacing:-.02em;margin:10px 0 14px}
.talk{font:600 1.7rem var(--hand);margin:18px 0 10px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);font:500 .82rem var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:14px 22px;border-radius:6px;text-decoration:none;transition:background .2s,transform .2s}
.btn:hover{background:var(--up);color:var(--paper);transform:translateY(-2px)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:clamp(18px,3vw,30px);margin:0 0 26px;scroll-margin-top:16px}
h2{font:600 1.5rem/1.2 var(--sans);letter-spacing:-.015em;margin:0}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
h3{font:600 1.05rem/1.35 var(--sans);margin:0}
p{margin:0 0 .9em}
.quote{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.px{font:500 clamp(2.4rem,7vw,3.6rem)/1 var(--mono);letter-spacing:-.03em}
.chg{font:500 .95rem var(--mono);color:var(--up);background:var(--upbg);padding:3px 8px;border-radius:4px;display:inline-block;margin:6px 0 0 8px}
.rng{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.rng button{min-width:52px;min-height:40px;font:500 .78rem var(--mono);border-right:1px solid var(--line)}
.rng button:last-child{border:0}.rng button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
svg.chart{display:block;width:100%;height:auto;margin:16px 0 6px;overflow:visible}
.chart .ln{fill:none;stroke:var(--up);stroke-width:2.5;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .ar{fill:url(#g);opacity:0;animation:fade .8s .5s forwards}@keyframes fade{to{opacity:1}}
.chart .gr{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart text{font:400 11px var(--mono);fill:var(--mut)}
.chart .pt{fill:var(--card);stroke:var(--up);stroke-width:2.5;cursor:pointer;transition:r .15s}
.chart .pt:hover,.chart .pt:focus,.chart .pt.on{fill:var(--up);r:8;outline:none}
.cap{font:500 .92rem var(--mono);min-height:3em;padding:8px 12px;border-left:3px solid var(--up);background:var(--upbg);border-radius:0 6px 6px 0}
.ms{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:2px 24px;font-size:.9rem}
.ms li{padding:5px 0;border-bottom:1px dotted var(--line)}.ms li::before{content:"▲ ";color:var(--up);font-size:.7rem}
.fine{font-size:.78rem;color:var(--mut);margin:12px 0 0;font-style:italic}
.story{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:22px}
.story .n{font:500 .85rem var(--mono);color:var(--up)}
.story sup a{font:500 .72rem var(--mono);text-decoration:none;color:var(--up);padding:6px 4px}
.pairs{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;list-style:none;padding:0}
.pairs li{font:500 .74rem var(--mono);letter-spacing:.06em;background:color-mix(in srgb,var(--sky) 26%,transparent);border:1px solid var(--sky);border-radius:999px;padding:5px 12px}
.th{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:22px}
.th h3{font:600 1.75rem/1.05 var(--hand)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{font:400 .72rem var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:6px 10px 8px 0;border-bottom:1.5px solid var(--ink)}
td{padding:13px 10px 13px 0;border-bottom:1px solid var(--line);vertical-align:top}
td small{display:block;color:var(--mut);font-size:.88rem;line-height:1.45;margin-top:3px}
.t{font:500 .82rem var(--mono);background:var(--paper);border:1px solid var(--line);padding:2px 7px;border-radius:4px;white-space:nowrap}
.up{color:var(--up);font-weight:500;font-family:var(--mono);font-size:.86rem}
.w{display:flex;align-items:center;gap:8px;font:500 .86rem var(--mono);min-width:110px}
.w i{height:8px;background:var(--up);border-radius:2px;display:block;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scaleX(0)}}
.cv{font:500 .74rem var(--mono);text-transform:uppercase;padding:2px 8px;border-radius:4px;border:1px solid var(--line);white-space:nowrap}
.cv.high{background:var(--upbg);color:var(--up);border-color:transparent}.cv.low{color:var(--mut)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:0 26px}
.two .panel{min-width:0}
.kv{list-style:none;margin:0;padding:0}.kv li{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.portrait{width:64px;height:64px;border-radius:8px;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font:500 1rem var(--mono);position:relative;overflow:hidden}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.end{text-align:center;padding:50px 20px}
.end p.h{font:600 clamp(2.4rem,8vw,4rem)/1 var(--hand);margin:0 0 14px}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;padding:18px 0 40px;border-top:1.5px solid var(--ink)}
footer a{margin-right:16px;display:inline-block;padding:9px 0}
.rv{opacity:0;transition:opacity .8s}.rv.in{opacity:1}
@media(min-width:860px){.hero{grid-template-columns:1fr 1fr}}
@media(max-width:700px){
  thead{position:absolute;left:-9999px}tr{display:block;padding:12px 0;border-bottom:1px solid var(--line)}
  td{display:grid;grid-template-columns:96px 1fr;gap:10px;border:0;padding:4px 0}
  td::before{content:attr(data-l);font:400 .7rem var(--mono);text-transform:uppercase;color:var(--mut);padding-top:3px}
  .kv li{grid-template-columns:1fr;gap:0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important;animation-delay:0s!important;scroll-behavior:auto!important}.rv{opacity:1}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
/*CORE*/

/* ---------- Site D · Ledger ---------- */
let range = "max", activeM = -1;
let theme = store.get("rj-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
document.documentElement.dataset.theme = theme;
const NOW = 2026.87, SPAN = { y1: 1, y3: 3, max: 99 };

function chartData(t) {
  const all = t.d.milestones, t0 = Math.max(all[0].t, NOW - SPAN[range]);
  const at = x => { // linear interpolation of the index at time x
    for (let i = 1; i < all.length; i++) if (x <= all[i].t) { const a = all[i - 1], b = all[i]; return a.v + (b.v - a.v) * (x - a.t) / (b.t - a.t); }
    return all[all.length - 1].v;
  };
  const pts = all.map((m, i) => ({ ...m, i })).filter(m => m.t >= t0);
  const line = pts[0].t > t0 ? [{ t: t0, v: at(t0) }, ...pts] : pts;
  return { pts, line, t0, first: line[0].v, last: all[all.length - 1].v };
}
function chart(t) {
  const { pts, line, t0, first, last } = chartData(t), W = 800, H = 300, P = { l: 8, r: 16, t: 18, b: 28 };
  const lo = Math.max(0, first - 8), hi = last + 8;
  const X = x => P.l + (x - t0) / (NOW - t0) * (W - P.l - P.r), Y = v => H - P.b - (v - lo) / (hi - lo) * (H - P.t - P.b);
  const d = line.map((p, i) => (i ? "L" : "M") + X(p.t).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ");
  const years = []; for (let y = Math.ceil(t0); y <= NOW; y++) years.push(y);
  const step = years.length > 4 ? 1 : 1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="group" aria-label="${esc(t.d.chartTitle)}">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f7a4d" stop-opacity=".22"/><stop offset="1" stop-color="#1f7a4d" stop-opacity="0"/></linearGradient></defs>
    ${years.filter((_, i) => i % step === 0).map(y => `<line class="gr" x1="${X(y)}" x2="${X(y)}" y1="${P.t}" y2="${H - P.b}"/><text x="${X(y) + 4}" y="${H - 8}">${y}</text>`).join("")}
    <line class="gr" x1="${P.l}" x2="${W - P.r}" y1="${Y(first)}" y2="${Y(first)}"/>
    <path class="ar" d="${d} L${X(NOW)} ${H - P.b} L${X(t0)} ${H - P.b} Z"/>
    <path class="ln" pathLength="1" d="${d}"/>
    ${pts.map(p => `<circle class="pt${p.i === activeM ? " on" : ""}" cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="6" tabindex="0" role="button" data-m="${p.i}" aria-label="${esc(p.l)}"/>`).join("")}
  </svg>`;
}
const bookTk = (b, i) => b.title.startsWith("[") ? "BK0" + (i + 1) : b.title.replace(/[^A-Za-z]/g, "").toUpperCase().replace(/(?!^)[AEIOU]/g, "").slice(0, 4);

function render(t) {
  const d = t.d, cd = chartData(t), pct = Math.round((cd.last - cd.first) / cd.first * 100);
  if (activeM < 0 || !cd.pts.some(p => p.i === activeM)) activeM = cd.pts[cd.pts.length - 1].i;
  $("#app").innerHTML = `
<a class="skip" href="#main">${t.skip}</a>
<header>
  <a class="tk" href="#top">${d.ticker}</a>
  <nav aria-label="Sections"><a href="#chart">${d.chartTitle.split(",")[0]}</a><a href="#thesis">${d.thesisTitle}</a><a href="#holdings">${d.holdingsTitle}</a><a href="#positions">${d.positionsTitle}</a><a href="#books">${t.nav.books}</a><a href="#contact">${t.nav.contact}</a></nav>
  ${langToggle()}
  <button class="theme" type="button" data-theme-btn aria-label="${esc(t.themeLabel)}" aria-pressed="${theme === "dark"}">${theme === "dark" ? "☀" : "☾"}</button>
</header>
<main id="main">
  <div class="hero" id="top"><div class="rings" aria-hidden="true"></div>
    <div class="note"><p>“${d.manifesto}”</p><div class="sig"><span>— Rocío</span><span class="mono">${d.scroll} ↓</span></div></div>
    <div class="intro">
      <div class="mono">${t.name} · ${t.role} · ${t.remote}</div>
      <h1>${t.pitch}</h1>
      <p>${t.sub}</p>
      <p class="talk">${d.talk} <span style="margin-left:8px">${pixelCat(3)}</span></p>
      <a class="btn" href="${mailto()}">${t.cta} →</a>
    </div>
  </div>

  <section class="panel" id="chart" aria-labelledby="hc">
    <div class="quote">
      <div><div class="mono"><span class="t">${d.ticker}</span> &nbsp;${d.exchange}</div>
        <h2 id="hc" class="mono" style="margin:8px 0 4px">${d.chartTitle}</h2>
        <span class="px">${cd.last.toFixed(2)}</span><span class="chg">▲ +${(cd.last - cd.first).toFixed(1)} (+${pct}%) ${range === "max" ? d.since : d.ranges[range]}</span></div>
      <div class="rng" role="group" aria-label="Range">${Object.keys(d.ranges).map(k => `<button type="button" data-range="${k}" aria-pressed="${k === range}">${d.ranges[k]}</button>`).join("")}</div>
    </div>
    ${chart(t)}
    <div class="cap" id="cap" aria-live="polite">${d.milestones[activeM].l}</div>
    <ul class="ms">${cd.pts.map(p => `<li>${p.l}</li>`).join("")}</ul>
    <p class="fine">${d.illustrative}</p>
  </section>

  <section class="panel rv" id="story"><div class="ph"><h2>${d.storyTitle}</h2><span class="mono">[01] – [04]</span></div>
    <div class="story">${d.story.map((s, i) => `<div><span class="n">[0${i + 1}]</span><h3>${s.h}</h3><p>${s.p}<sup><a href="${s.href}" aria-label="[${i + 1}] ${s.href.slice(1)}">${i + 1}</a></sup></p></div>`).join("")}</div>
    <ul class="pairs">${d.pairs.map(p => `<li>${p}</li>`).join("")}</ul>
  </section>

  <section class="panel rv" id="thesis"><div class="ph"><h2>${d.thesisTitle}</h2><span class="mono">${d.thesisSub}</span></div>
    <div class="th">${d.thesis.map(x => `<div><h3>${x.h}</h3><p>${x.p}</p></div>`).join("")}</div>
  </section>

  <section class="panel rv" id="holdings"><div class="ph"><h2>${d.holdingsTitle}</h2><span class="mono">${d.holdingsSub}</span></div>
    <table><thead><tr><th>${d.cols.ticker}</th><th>${d.cols.holding}</th><th>${d.cols.weight}</th><th>${d.cols.thesis}</th></tr></thead>
    <tbody>${d.holdings.map(h => `<tr><td data-l="${d.cols.ticker}"><span class="t">${h.tk}</span></td><td data-l="${d.cols.holding}"><b>${h.name}</b></td><td data-l="${d.cols.weight}"><span class="w"><i style="width:${h.w * 2.2}px"></i>${h.w}%</span></td><td data-l="${d.cols.thesis}">${h.p}</td></tr>`).join("")}</tbody></table>
    <p class="fine">${d.illustrative}</p>
  </section>

  <section class="panel rv" id="positions"><div class="ph"><h2>${d.positionsTitle}</h2><span class="mono">${d.positionsSub}</span></div>
    <table><thead><tr><th>${d.cols.position}</th><th>${d.cols.entry}</th><th>${d.cols.impact}</th></tr></thead>
    <tbody>${t.cases.map(c => `<tr><td data-l="${d.cols.position}"><div><b>${c.url ? `<a href="${c.url}" ${ext}>${c.name}</a>` : c.name}</b> <span class="mono">${c.org} · ${c.role}</span><small>${caseBody(c)}</small></div></td><td data-l="${d.cols.entry}"><span class="mono" style="white-space:nowrap">${c.when}</span></td><td data-l="${d.cols.impact}"><span class="up">▲ ${c.impact}</span></td></tr>`).join("")}</tbody></table>
  </section>

  <div class="two">
    <section class="panel rv" id="experience"><div class="ph"><h2>${t.h.experience}</h2></div>
      <ul class="kv">${t.timeline.map(e => `<li><span class="mono">${e.when}</span><span><b>${e.role}</b><br>${e.org}${e.note ? `<small style="display:block;color:var(--mut)">${e.note}</small>` : ""}</span></li>`).join("")}</ul>
    </section>
    <div>
      <section class="panel rv" id="about"><div class="ph"><h2>${t.h.about}</h2>${portrait()}</div>
        <p>${t.about[0]}</p><p>${t.about[1]}</p><p>${t.about[2]}</p>${offClock()}
        <ul class="kv">${t.finance.map(f => `<li><span class="mono">${f.k}</span><span>${f.v}</span></li>`).join("")}</ul>
      </section>
      <section class="panel rv" id="skills"><div class="ph"><h2>${t.h.skills}</h2></div>
        <ul class="kv">${t.skills.map(s => `<li><span class="mono">${s.name}</span><span>${s.items.join(" · ")}</span></li>`).join("")}</ul>
      </section>
    </div>
  </div>

  <section class="panel rv" id="books"><div class="ph"><h2>${d.booksTitle}</h2></div>
    <p>${t.booksIntro}</p>
    <table><thead><tr><th>${d.cols.ticker}</th><th>${d.cols.title}</th><th>${d.cols.conviction}</th><th>${d.cols.thesis}</th></tr></thead>
    <tbody>${content.books.map((b, i) => `<tr><td data-l="${d.cols.ticker}"><span class="t">${bookTk(b, i)}</span></td><td data-l="${d.cols.title}"><div><b>${b.url ? `<a href="${b.url}" ${ext}>${esc(b.title)}</a>` : esc(b.title)}</b><small>${esc(b.author)}</small></div></td><td data-l="${d.cols.conviction}"><span>${b.conviction ? `<span class="cv ${b.conviction}">${d.conviction[b.conviction]}</span>` : "—"}</span></td><td data-l="${d.cols.thesis}">${esc(b.note[lang] || "")}</td></tr>`).join("")}</tbody></table>
  </section>

  <div class="two">
    <section class="panel rv" id="offers"><div class="ph"><h2>${t.h.services}</h2></div>
      <ul class="kv">${t.services.map(s => `<li><span class="mono">${s.sub}</span><span><b>${s.name}</b><small style="display:block;color:var(--mut)">${svcBody(s)}</small></span></li>`).join("")}</ul>
    </section>
    <section class="panel rv" id="lab"><div class="ph"><h2>${t.h.lab}</h2></div>
      <p>${t.labIntro}</p>
      <ul class="kv">${t.lab.map(l => `<li style="grid-template-columns:1fr;gap:0"><b>${labName(l)}</b><span style="color:var(--mut)">${labMeta(l)}</span></li>`).join("")}</ul>
    </section>
  </div>

  <section class="panel rv" id="writing"><div class="ph"><h2>${t.h.writing}</h2><span class="mono">${t.writingIntro}</span></div>
    <ul class="kv">${content.writing.map(w => `<li><span class="mono">${fmtDate(w.date)}</span>${w.url ? `<a href="${w.url}" ${ext}>${esc(w.title[lang])}</a>` : `<span>${esc(w.title[lang])} <span class="mono">· ${t.soon}</span></span>`}</li>`).join("")}</ul>
  </section>

  <section class="end rv" id="contact">
    <p class="h">${d.talk}</p>
    <p style="max-width:56ch;margin:0 auto 8px">${t.freelance}</p><p>${t.contactBody}</p>
    <a class="btn" href="${mailto()}">${t.cta} →</a>
  </section>
</main>
<footer><span class="mono">${t.footer.rights}</span><span class="mono">${footerLinks()}</span></footer>`;
}
function setM(i) {
  activeM = i; $("#cap").textContent = T().d.milestones[i].l;
  $$(".pt").forEach(p => p.classList.toggle("on", +p.dataset.m === i));
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-theme-btn]")) {
    theme = theme === "dark" ? "light" : "dark"; store.set("rj-theme", theme);
    document.documentElement.dataset.theme = theme;
    const y = scrollY; apply(); scrollTo(0, y); $("[data-theme-btn]").focus(); return;
  }
  const r = e.target.closest("[data-range]");
  if (r) { range = r.dataset.range; activeM = -1; const y = scrollY; apply(); scrollTo(0, y); $(`[data-range="${range}"]`).focus(); return; }
  const m = e.target.closest("[data-m]"); if (m) setM(+m.dataset.m);
});
document.addEventListener("mouseover", e => { const m = e.target.closest("[data-m]"); if (m) setM(+m.dataset.m); });
document.addEventListener("focusin", e => { const m = e.target.closest("[data-m]"); if (m) setM(+m.dataset.m); });
apply();
</script>
</body>
</html>
