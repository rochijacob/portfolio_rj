<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocío Jacob · Product Engineer</title>
<meta name="description" content="">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f6f7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23003049'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' font-weight='700' text-anchor='middle' fill='%23fdf0d5'%3ERJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* D · Ledger. Lab direction: the hero is type only, set huge in a condensed grotesk;
   numbers are tabular mono; the Buenos Aires sketch closes the page as a panorama. */
:root{--bg:#f4f6f7;--ink:#003049;--soft:#4a6676;--acc:#3d7aa3;--up:#1f7a4d;--line:rgba(0,48,73,.16);--dot:rgba(0,48,73,.15);
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;--txt:"Barlow",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
:root[data-theme=dark]{--bg:#00202f;--ink:#f0f4f6;--soft:#a3b9c5;--acc:#8fbcd6;--up:#6fcf97;--line:rgba(240,244,246,.17);--dot:rgba(240,244,246,.09)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) radial-gradient(circle,var(--dot) 1.1px,transparent 1.3px) 0 0/22px 22px;color:var(--ink);font:400 1.0625rem/1.65 var(--txt);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;transition:background-color .3s}
a{color:inherit;text-decoration-color:var(--acc);text-underline-offset:4px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:var(--ink);color:var(--bg);padding:8px 12px;z-index:9}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.m{font:400 .78rem/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
header{display:flex;align-items:center;gap:8px 24px;flex-wrap:wrap;padding:20px 0;border-bottom:1px solid var(--ink)}
.tk{font:700 1.4rem/1 var(--cond);letter-spacing:.04em;text-decoration:none;margin-right:auto;padding:10px 0}
.tk span{color:var(--up);font:500 .85rem var(--mono);margin-left:10px;letter-spacing:0}
header nav a{font:500 .8rem var(--mono);text-transform:uppercase;text-decoration:none;color:var(--soft);padding:12px 0;margin-left:18px}
.lang{display:inline-flex;align-items:center;font:400 .78rem var(--mono);color:var(--soft)}
.lang button,.theme{min-width:40px;min-height:40px;font:400 .78rem var(--mono)}
.lang button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.theme{border:1px solid var(--line);font-size:1rem}
/* Hero: nothing but type. */
.hero{padding:clamp(48px,8vw,120px) 0 56px;border-bottom:1px solid var(--line)}
h1{font:700 clamp(3.4rem,1rem + 9.4vw,10rem)/.86 var(--cond);text-transform:uppercase;letter-spacing:-.01em;margin:22px 0 0}
h1 span{color:var(--acc)}
.sub{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;margin-top:44px;align-items:end}
.sub p{grid-column:1/7;margin:0;font-size:1.2rem;color:var(--soft)}
.sub .act{grid-column:9/13;display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;background:var(--ink);color:var(--bg);text-decoration:none;font:600 1.05rem var(--cond);letter-spacing:.06em;text-transform:uppercase}
.btn.o{background:none;color:var(--ink);border:1px solid var(--ink)}
.ticker{display:flex;gap:28px;overflow-x:auto;scrollbar-width:none;white-space:nowrap;padding:14px 0;border-bottom:1px solid var(--line)}
.ticker span b{font:500 1rem var(--mono);margin-right:8px}
.ticker .u{color:var(--up)}
section{padding:96px 0 0}
.sh{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;margin-bottom:34px}
.sh .m{grid-column:1/4;padding-top:14px}
h2{grid-column:4/13;font:600 clamp(2.4rem,1.4rem + 3vw,4rem)/.95 var(--cond);text-transform:uppercase;margin:0}
.body{margin-left:calc(25% + 6px)}
.story{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 48px}
.story .n{font:500 .85rem var(--mono);color:var(--acc)}
.story h3{font:600 1.9rem/1 var(--cond);text-transform:uppercase;margin:8px 0}
.story p{color:var(--soft);margin:0}
.pairs{list-style:none;margin:40px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.pairs li{font:500 .8rem var(--mono);border:1px solid var(--line);padding:6px 12px}
.th{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}
.th h3{font:600 1.5rem/1.05 var(--cond);text-transform:uppercase;margin:0 0 10px}
.th p{color:var(--soft);font-size:.98rem;margin:0}
/* Track record rows open in place. */
.tr{border-top:1px solid var(--ink)}
.tr summary{list-style:none;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,3fr) minmax(0,3fr) 24px;gap:20px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line);cursor:pointer;min-height:48px}
.tr summary::-webkit-details-marker{display:none}
.tr .nm{font:600 1.7rem/1.05 var(--cond);text-transform:uppercase}
.tr .nm small{display:block;font:400 .78rem var(--mono);color:var(--soft);text-transform:uppercase;margin-top:6px}
.tr .up{color:var(--up);font:500 .9rem var(--mono)}
.tr .pl{font:400 1.2rem var(--mono);color:var(--soft);transition:transform .2s}
.tr details[open] .pl{transform:rotate(45deg)}
.tr .x{padding:16px 0 26px;border-bottom:1px solid var(--line);color:var(--soft);max-width:70ch}
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,3fr) minmax(0,3fr) 24px;gap:20px;padding-bottom:10px}
.kv{list-style:none;margin:0;padding:0}
.kv li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:20px;padding:12px 0;border-top:1px solid var(--line)}
.kv li.exh{border:0}
.kv small{display:block;color:var(--soft)}
.svc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}
.svc h3{font:600 1.6rem/1 var(--cond);text-transform:uppercase;margin:0 0 10px}
.svc p{color:var(--soft);font-size:.98rem;margin:0 0 10px}
/* Closing: contact sits on top of the city. */
.end{padding:140px 0 0;text-align:center}
.end .big{font:700 clamp(3rem,1rem + 7vw,7.5rem)/.9 var(--cond);text-transform:uppercase;margin:16px 0 26px}
.end p{color:var(--soft);max-width:52ch;margin:0 auto 26px}
.end .big{color:var(--ink);max-width:none}
.end .act{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}
.pano{margin-top:72px;overflow:hidden}
.city{display:block;width:100%;height:auto;fill:none;stroke:var(--ink);stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round}
.city .outline{stroke-width:1.55}.city .detail{stroke-width:.65}.city .context{stroke:var(--soft);stroke-width:.75;opacity:.65}
.city .guide{stroke:var(--acc);stroke-width:.65;opacity:.85}.city .axis{stroke-dasharray:8 5 1 5;stroke-width:.5;opacity:.5}
.city .wash{fill:var(--acc);fill-opacity:.07;stroke:none}
.city text{font:400 8px var(--mono);letter-spacing:.12em;fill:var(--soft);stroke:none}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 20px;border-top:1px solid var(--ink);padding:16px 0 40px}
footer a{display:inline-block;padding:10px 0;margin-left:18px}
.fine{font:400 .75rem var(--mono);color:var(--soft);margin-top:14px}
@media(max-width:900px){.sh,.sub{display:block}.sh .m{padding:0 0 8px}.sub .act{justify-content:flex-start;margin-top:24px}.body{margin-left:0}.story,.th,.svc{grid-template-columns:1fr}header nav{display:none}}
@media(max-width:640px){.wrap{padding:0 18px}.cols{display:none}.tr summary{grid-template-columns:1fr 24px;gap:6px 12px}.tr summary .up{grid-column:1}.tr summary .w{grid-column:1}.tr summary .pl{grid-row:1;grid-column:2}.kv li{grid-template-columns:1fr;gap:0}
  .city{width:860px;max-width:none;margin-left:calc(50% - 430px)}.city text{font-size:11px}.btn{flex:1 1 100%;justify-content:center}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
/*CORE*/

/* ---------- Site D · Ledger ---------- */
let theme = store.get("rj-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
document.documentElement.dataset.theme = theme;

function render(t) {
  const d = t.d, words = t.pitch.split(" "), cut = Math.ceil(words.length / 2);
  $("#app").innerHTML = `
<a class="skip" href="#main">${t.skip}</a>
<header>
  <a class="tk" href="#top" id="top">${d.ticker}<span>▲ ${d.since}</span></a>
  <nav aria-label="${esc(t.menu)}"><a href="#story">${d.storyTitle}</a><a href="#positions">${d.positionsTitle}</a><a href="#contact">${t.nav.contact}</a></nav>
  ${langToggle()}
  <button class="theme" type="button" data-theme-btn aria-label="${esc(t.themeLabel)}" aria-pressed="${theme === "dark"}">${theme === "dark" ? "☀" : "☾"}</button>
</header>
<main id="main">
  <div class="hero">
    <div class="m">${t.name} · ${t.role} · ${t.remote}</div>
    <h1>${words.slice(0, cut).join(" ")} <span>${words.slice(cut).join(" ")}</span></h1>
    <div class="sub"><p>${t.heroIntro}</p><div class="act"><a class="btn" href="#contact">${t.cta} ↗</a><a class="btn o" href="#positions">${t.seeWork}</a></div></div>
  </div>
  <div class="ticker m" aria-label="${esc(t.h.numbers)}">${t.stats.slice(0, 6).map(s => `<span><b class="u">▲ ${s.n}</b>${s.l}</span>`).join("")}</div>

  <section id="story">
    <div class="sh"><span class="m">[01] – [04]</span><h2>${d.storyTitle}</h2></div>
    <div class="body"><div class="story">${d.story.map((s, i) => `<div><span class="n">[0${i + 1}]</span><h3>${s.h}</h3><p>${s.p}</p></div>`).join("")}</div>
    <ul class="pairs">${d.pairs.map(p => `<li>${p}</li>`).join("")}</ul></div>
  </section>

  <section id="thesis">
    <div class="sh"><span class="m">${d.thesisSub}</span><h2>${d.thesisTitle}</h2></div>
    <div class="body th">${d.thesis.map(x => `<div><h3>${x.h}</h3><p>${x.p}</p></div>`).join("")}</div>
  </section>

  <section id="positions">
    <div class="sh"><span class="m">${d.positionsSub}</span><h2>${d.positionsTitle}</h2></div>
    <div class="body tr">
      <div class="cols m"><span>${d.cols.position}</span><span>${d.cols.entry}</span><span>${d.cols.impact}</span><span></span></div>
      ${t.cases.map((c, i) => `<details id="pos-${i}"><summary><span class="nm">${c.name}<small>${c.org} · ${c.role}</small></span><span class="w m">${c.when}</span><span class="up">▲ ${c.impact}</span><span class="pl" aria-hidden="true">+</span></summary><div class="x">${caseBody(c)}</div></details>`).join("")}
    </div>
  </section>

  <section id="services">
    <div class="sh"><span class="m">${t.nav.services}</span><h2>${t.h.services}</h2></div>
    <div class="body svc">${t.services.map(s => `<div><h3>${s.name}</h3><p>${s.body}</p><p class="m">${t.delivLabel}: ${s.deliv}</p></div>`).join("")}</div>
  </section>

  <section id="about">
    <div class="sh"><span class="m">${t.remote}</span><h2>${t.h.about}</h2></div>
    <div class="body">${t.profile.map(p => `<p style="max-width:62ch">${p}</p>`).join("")}${offClock()}
      <ul class="kv" style="margin-top:36px">${expSplit(t, e => `<li><span class="m">${e.when}</span><span>${e.role}<small>${e.org}</small></span></li>`)}</ul></div>
  </section>

  <section class="end" id="contact">
    <div class="m">${t.h.contact}</div>
    <p class="big">${d.talk}</p>
    <p>${t.contactBody}</p>
    <div class="act"><a class="btn" href="${mailto()}">${t.cta} ↗</a><a class="btn o" href="${L.linkedin}" ${ext}>LinkedIn</a></div>
  </section>
</main>
<div class="pano">${city(t.illo)}</div>
<footer><span class="m">${t.footer.rights}</span><span class="m">${footerLinks()}</span></footer>`;
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-theme-btn]")) {
    theme = theme === "dark" ? "light" : "dark"; store.set("rj-theme", theme);
    document.documentElement.dataset.theme = theme; apply(); $("[data-theme-btn]").focus();
  }
});
apply();
</script>
</body>
</html>
