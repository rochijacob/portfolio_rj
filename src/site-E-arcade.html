<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocío Jacob · Product Engineer</title>
<meta name="description" content="">
<meta name="theme-color" content="#001824">
<meta property="og:type" content="website">
<meta property="og:title" content="Rocío Jacob · Product Engineer">
<meta property="og:description" content="I build products, automation and analytics so organizations decide better and do less manual work.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23003049'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' font-weight='700' text-anchor='middle' fill='%23fdf0d5'%3ERJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#001824;--pan:#00293d;--ink:#fdf0d5;--mut:#a9c0cc;--sky:#669bbc;--pink:#e56b9a;--navy:#003049;
  --px:"Press Start 2P","Courier New",monospace;--vt:"VT323","Courier New",monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.42rem/1.22 var(--vt);
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 4px)}
a{color:var(--sky)}a:hover{color:var(--pink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:4px solid var(--pink);outline-offset:4px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:var(--pink);color:var(--navy);padding:8px 12px;z-index:99}
.wrap{max-width:900px;margin:0 auto;padding:0 20px 40px}
.px{box-shadow:0 -4px 0 var(--c,var(--ink)),0 4px 0 var(--c,var(--ink)),-4px 0 0 var(--c,var(--ink)),4px 0 0 var(--c,var(--ink));margin:4px}
.hud{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 18px;padding:14px 0;font:400 .62rem/1.6 var(--px);text-transform:uppercase}
.hud b{color:var(--pink);font-weight:400}
.lang{display:inline-flex;align-items:center;gap:4px}
.lang button{min-width:42px;min-height:40px;font:400 .62rem var(--px);color:var(--mut)}
.lang button[aria-pressed=true]{color:var(--navy);background:var(--ink)}
.hero{text-align:center;padding:46px 14px 0;background:var(--pan)}
.hero .sm{font:400 .62rem/1.8 var(--px);color:var(--sky);text-transform:uppercase}
h1{font:400 clamp(1.25rem,5.2vw,2.7rem)/1.35 var(--px);margin:18px 0 8px;text-transform:uppercase;text-shadow:4px 4px 0 var(--navy),6px 6px 0 var(--pink)}
.role{font:400 clamp(.7rem,2.2vw,1rem)/1.6 var(--px);color:var(--pink);text-transform:uppercase}
.hero p{max-width:34ch;margin:22px auto 6px;font-size:1.6rem}
.hero .sub{font-size:1.25rem;color:var(--mut);max-width:48ch}
.start{display:inline-block;margin:26px 0 30px;padding:18px 22px;background:var(--pink);color:var(--navy);font:400 .8rem/1.5 var(--px);text-transform:uppercase;text-decoration:none;--c:var(--ink)}
.start:hover{background:var(--ink);color:var(--navy)}
.start span{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.walk{position:relative;height:60px;border-bottom:4px dashed var(--sky);overflow:hidden}
.walk span{position:absolute;bottom:0;left:-70px;line-height:0;animation:walk 18s linear infinite,bob .4s steps(2) infinite}
@keyframes walk{to{left:100%}}@keyframes bob{50%{transform:translateY(-3px)}}
.menu{list-style:none;margin:34px 0;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:2px 20px;--c:var(--sky)}
.menu a{display:block;padding:11px 6px 11px 30px;position:relative;font:400 .66rem/1.6 var(--px);text-transform:uppercase;text-decoration:none;color:var(--ink)}
.menu a:hover,.menu a:focus-visible{color:var(--pink)}
.menu a:hover::before,.menu a:focus-visible::before{content:"▶";position:absolute;left:6px}
section{padding:40px 0 8px;scroll-margin-top:10px}
h2{font:400 clamp(.95rem,3.2vw,1.35rem)/1.5 var(--px);text-transform:uppercase;margin:0 0 22px;color:var(--pink)}
h2::before{content:"► ";color:var(--sky)}
h3{font:400 .78rem/1.6 var(--px);text-transform:uppercase;margin:0 0 8px}
p{margin:0 0 .8em}.mut{color:var(--mut)}
.tag{font:400 .56rem/1.8 var(--px);text-transform:uppercase;color:var(--sky)}
table{width:100%;border-collapse:collapse}
td{padding:9px 8px;vertical-align:top;border-bottom:2px dotted var(--pan)}
td:first-child{font:400 .66rem/2 var(--px);color:var(--sky);width:44px}
td:nth-child(2){font:400 clamp(.8rem,2.6vw,1.05rem)/1.6 var(--px);color:var(--pink);white-space:nowrap;width:1%;padding-right:18px}
.card{background:var(--pan);padding:20px;margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,255px),1fr));gap:22px}
.grid .card{margin:4px}
.loot{color:var(--pink)}
.who{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.portrait{width:64px;height:64px;background:var(--sky);color:var(--navy);display:grid;place-items:center;font:400 .8rem var(--px);position:relative;overflow:hidden;flex:none;image-rendering:pixelated}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kv{list-style:none;margin:10px 0 0;padding:0}.kv li{padding:7px 0;border-top:2px dotted var(--bg)}
.kv b{font:400 .58rem/2 var(--px);color:var(--sky);text-transform:uppercase;margin-right:10px}
.inv{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 22px}
.inv span{background:var(--pan);padding:5px 12px;border:4px solid var(--sky);font-size:1.25rem}
.cart{background:var(--sky);color:var(--navy);padding:22px 16px 16px;clip-path:polygon(0 0,62% 0,62% 12px,100% 12px,100% 100%,0 100%);transition:transform .1s steps(2)}
.cart:hover{transform:translateY(-8px)}
.cart div{background:var(--ink);padding:12px;min-height:150px;border:4px solid var(--navy)}
.cart .tag{color:var(--navy)}.cart a{color:var(--navy)}
.cart h3{font-size:.66rem;overflow-wrap:anywhere}
.cont{text-align:center;padding:50px 16px;background:var(--pan);margin-top:40px}
.cont h2{color:var(--ink);font-size:clamp(1.1rem,5vw,2rem)}.cont h2::before{content:""}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;padding:26px 0;font:400 .56rem/2 var(--px);text-transform:uppercase}
footer a{margin-right:16px;display:inline-block;padding:10px 0}
.off .eq{height:16px}
.rv{opacity:0;transition:opacity .01s steps(1)}.rv.in{opacity:1;animation:pop .35s steps(4)}
@keyframes pop{from{transform:translateY(16px);opacity:0}}
@media(max-width:520px){body{font-size:1.3rem}td:nth-child(2){white-space:normal}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1}.walk span{left:24px}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
/*CORE*/

/* ---------- Site E · Arcade ---------- */
const n2 = i => String(i + 1).padStart(2, "0");
function render(t) {
  const e = t.e;
  const menu = [["scores", e.scores], ["about", t.h.about], ["work", e.levels], ["offers", e.missions], ["experience", e.quest], ["skills", e.inventory], ["lab", e.side], ["books", e.saves], ["writing", e.patch], ["contact", e.cont]];
  $("#app").innerHTML = `
<a class="skip" href="#main">${t.skip}</a>
<header class="hud"><span>1UP <b>${t.name}</b></span><span>${e.hiscore} <b>${t.stats[0].n}</b></span>${langToggle()}</header>
<main id="main">
  <div class="hero px" id="top">
    <div class="sm">${e.player} · ${t.remote}</div>
    <h1>${t.name}</h1>
    <div class="role">${t.role}</div>
    <p>${t.pitch}</p>
    <p class="sub">${t.sub}</p>
    <a class="start px" href="${mailto()}"><span aria-hidden="true">▶</span> ${t.cta}</a>
    <div class="walk" aria-hidden="true"><span>${pixelCat(5)}</span></div>
  </div>

  <nav aria-label="${e.start}"><ul class="menu px">${menu.map(([id, l]) => `<li><a href="#${id}">${l}</a></li>`).join("")}</ul></nav>

  <section id="scores" class="rv"><h2>${e.scores}</h2>
    <table><tbody>${t.stats.map((s, i) => `<tr><td>${n2(i)}</td><td>${s.n}</td><td>${s.l}</td></tr>`).join("")}</tbody></table>
  </section>

  <section id="about" class="rv"><h2>${t.h.about}</h2>
    <div class="card px" style="--c:var(--sky)">
      <div class="who">${portrait()}<div><h3>${t.name}</h3><span class="tag">${e.player} · ${t.location}</span></div></div>
      ${t.about.map(p => `<p>${p}</p>`).join("")}${offClock()}
      <h3 style="margin-top:20px">${t.h.finance}</h3>
      <ul class="kv">${t.finance.map(f => `<li><b>${f.k}</b>${f.v}</li>`).join("")}</ul>
    </div>
  </section>

  <section id="work" class="rv"><h2>${e.levels}</h2>
    ${t.cases.map((c, i) => `<article class="card px"><span class="tag">${e.level} ${n2(i)} · ${c.org} · ${c.when}</span><h3>${c.url ? `<a href="${c.url}" ${ext}>${c.name}</a>` : c.name}</h3>
      <p class="mut">${c.role}</p><p>${caseBody(c)}</p><p class="loot">★ ${e.loot}: ${c.impact}</p><div class="inv" style="margin:0">${c.tags.map(x => `<span>${x}</span>`).join("")}</div></article>`).join("")}
  </section>

  <section id="offers" class="rv"><h2>${e.missions}</h2>
    <div class="grid">${t.services.map((s, i) => `<div class="card px" style="--c:var(--pink)"><span class="tag">${n2(i)} · ${s.sub}</span><h3>${s.name}</h3><p>${svcBody(s)}</p></div>`).join("")}</div>
    <p style="margin-top:20px">${t.freelance}</p>
  </section>

  <section id="experience" class="rv"><h2>${e.quest}</h2>
    ${t.timeline.map(x => `<div class="card px" style="--c:var(--pan);padding:14px 18px;margin-bottom:14px"><span class="tag">${x.when} · ${x.org}</span><h3>${x.role}</h3>${x.note ? `<p class="mut" style="margin:0">${x.note}</p>` : ""}</div>`).join("")}
  </section>

  <section id="skills" class="rv"><h2>${e.inventory}</h2>
    ${t.skills.map(s => `<h3>${s.name}</h3><div class="inv">${s.items.map(i => `<span>${i}</span>`).join("")}</div>`).join("")}
  </section>

  <section id="lab" class="rv"><h2>${e.side}</h2><p>${t.labIntro}</p>
    <div class="grid">${t.lab.map(l => `<div class="card px" style="--c:var(--sky)"><h3>${labName(l)}</h3><p class="mut" style="margin:0">${l.why}</p></div>`).join("")}</div>
  </section>

  <section id="books" class="rv"><h2>${e.saves}</h2><p>${t.booksIntro}</p>
    <div class="grid">${content.books.map((b, i) => `<div class="cart"><div><span class="tag">${e.slot} ${n2(i)}</span><h3>${b.url ? `<a href="${b.url}" ${ext}>${esc(b.title)}</a>` : esc(b.title)}</h3><p>${esc(b.author)}</p><p style="margin:0">${esc(b.note[lang] || "")}</p></div></div>`).join("")}</div>
    <p class="mut" style="margin-top:16px">${t.booksNote}</p>
  </section>

  <section id="writing" class="rv"><h2>${e.patch}</h2><p>${t.writingIntro}</p>
    <ul class="kv">${content.writing.map(w => `<li><b>${fmtDate(w.date)}</b>${w.url ? `<a href="${w.url}" ${ext}>${esc(w.title[lang])}</a>` : `${esc(w.title[lang])} <span class="mut">· ${t.soon}</span>`}</li>`).join("")}</ul>
  </section>

  <section id="contact" class="cont px rv" style="--c:var(--pink)">
    <h2>${e.cont}</h2>
    <p>${t.contactTitle}</p><p class="mut">${t.contactBody}</p>
    <a class="start px" href="${mailto()}" style="margin-bottom:0"><span aria-hidden="true">▶</span> ${e.yes}: ${t.cta}</a>
  </section>
</main>
<footer><span>${t.footer.rights}</span><span>${footerLinks()}</span></footer>`;
}
apply();
</script>
</body>
</html>
