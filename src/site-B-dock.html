<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocío Jacob · Product Engineer</title>
<meta name="description" content="">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#001824">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23003049'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' font-weight='700' text-anchor='middle' fill='%23fdf0d5'%3ERJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
/* B · Terminal. Lab direction: the whole page is a manual page set in one monospace,
   with Buenos Aires birds drawn in characters drifting behind the text. */
:root{--bg:#001824;--dot:rgba(240,244,246,.09);--ink:#e8eef1;--soft:#93abb8;--acc:#7fb2d2;--line:rgba(240,244,246,.16);--code:#002233;
  --c1:#7fb2d2;--c2:#9fb0bb;--c3:#c9a46b;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;--sig:"Mrs Saint Delafield",cursive}
:root[data-theme=light]{--bg:#f4f6f7;--dot:rgba(0,48,73,.15);--ink:#003049;--soft:#4a6676;--acc:#1b5e85;--line:rgba(0,48,73,.18);--code:#ffffff;--c1:#3d7aa3;--c2:#6b7f8b;--c3:#9a6f2e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:400 .95rem/1.75 var(--mono);background:var(--bg) radial-gradient(circle,var(--dot) 1.1px,transparent 1.3px) 0 0/22px 22px;overflow-x:hidden}
a{color:inherit;text-decoration-color:var(--acc);text-underline-offset:3px}
a:hover{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:var(--ink);color:var(--bg);padding:8px 12px;z-index:99}
/* Critters: fixed layer under the text, never clickable. */
.critters{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.critter{position:absolute;margin:0;font:600 9px/1 var(--mono);white-space:pre;opacity:.32;will-change:transform}
.cr1{color:var(--c1);top:16%;animation:fly 70s linear infinite}
.cr2{color:var(--c2);top:58%;animation:fly 95s linear infinite reverse;animation-delay:-40s}
.cr3{color:var(--c3);bottom:4%;right:4%;opacity:.28}
@keyframes fly{from{transform:translateX(-30vw)}to{transform:translateX(120vw)}}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:22px 22px 64px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px dotted var(--soft);padding-bottom:6px;font-size:.85rem}
.bar .mid{text-align:center;color:var(--soft)}
.tools{display:flex;justify-content:flex-end;gap:2px;align-items:center;margin:6px 0 0}
.tools button{min-width:40px;min-height:40px;font-size:.8rem;color:var(--soft)}
.tools button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:4px}
h2{font:600 .95rem/1 var(--mono);letter-spacing:.04em;margin:46px 0 12px}
.in{padding-left:7ch}
p{margin:0 0 1em;max-width:68ch}
.lead{font-size:1.15rem;line-height:1.55}
.flag{color:var(--acc);font-weight:500}
.cmd{display:block;background:var(--code);border:1px solid var(--line);padding:12px 16px;overflow-x:auto;white-space:pre;margin:0 0 14px}
.cmd::before{content:"$ ";color:var(--soft)}
.opt{margin:0 0 22px}
.opt>b{display:block;font-weight:500;color:var(--acc)}
.opt p{color:var(--soft);margin:2px 0 0}
.ex{margin:0 0 30px}
.ex h3{font:600 .95rem var(--mono);margin:0}
.ex .r{color:var(--acc)}
.ex p{color:var(--soft);margin:4px 0 0}
.files li,.hist li{list-style:none;padding:3px 0}
.files,.hist{margin:0;padding:0}
.files .perm{color:var(--soft)}
.hist li{display:grid;grid-template-columns:22ch 1fr;gap:12px}
.hist small{color:var(--soft);font-size:.85rem}
.hist .exh{padding-top:14px!important;color:var(--soft)}
.see a{display:inline-flex;align-items:center;min-height:40px;margin-right:22px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--soft);margin:12px 0 8px}
#game{display:block;width:100%;height:auto;border:1px solid var(--line);background:var(--code);cursor:pointer;touch-action:manipulation}
.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-top:1px dotted var(--soft);margin-top:64px;padding-top:8px;font-size:.85rem;color:var(--soft)}
.sig{font:400 3.1rem/1 var(--sig);color:var(--ink);transform:rotate(-4deg);display:inline-block;margin:0 0 -6px}
.who{display:flex;gap:14px;align-items:center;margin:0 0 16px}
.portrait{width:52px;height:52px;background:var(--code);border:1px solid var(--line);display:grid;place-items:center;position:relative;overflow:hidden;flex:none}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:640px){.in{padding-left:2ch}.hist li{grid-template-columns:1fr;gap:0}.bar .mid{display:none}.critter{font-size:7px}}
@media(prefers-reduced-motion:reduce){.critter{animation:none!important}.cr1{left:58%}.cr2{left:6%}}
</style>
</head>
<body>
<div class="critters" aria-hidden="true" id="critters"></div>
<div id="app" class="wrap"></div>
<script>
/*CORE*/

/* ---------- Site B · Terminal ---------- */
let theme = store.get("rj-theme-b") || "dark";
document.documentElement.dataset.theme = theme;
/* Original silhouettes: X is body, o an eye. Filled with characters, like ASCII shading. */
const BIRDS = {
  cotorra: ["......XXXX..........", ".....XXXXXX.........", "....XXoXXXX.........", "...>XXXXXXX.........", "....XXXXXXXX........", ".....XXXXXXXX.......", ".....XXXXXXXXX......", "......XXXXXXXXX.....", ".......XXXXXXXXX....", "........XXX..XXXX...", "........X.X....XXXX.", "...............XXXX.", ".................XXX"],
  paloma: ["..............XXX...", ".............XXXXX..", ".............XXoXX>.", "............XXXXX...", "...........XXXXX....", "....XXXXXXXXXXXX....", "..XXXXXXXXXXXXXX....", "XXXXXXXXXXXXXXX.....", "..XXXXXXXXXXXX......", "......XX...XX.......", "......X.....X......."],
  hornero: ["..........XXX.......", ".........XXoX>......", ".........XXXX.......", "........XXXXXX......", ".......XXXXXXX......", "........XX..X.......", "....XXXXXXXXXXXX....", "..XXXXXXXXXXXXXXXX..", ".XXXXXXXXXXXXXXXXXX.", "XXXXXXX......XXXXXXX", "XXXXXX........XXXXXX", "XXXXXX........XXXXXX", "XXXXXXXXXXXXXXXXXXXX"]
};
const INK = "$#%&@*+=x";
const shade = (g, seed) => g.map((r, j) => [...r].map((c, i) => c === "." ? " " : c === "o" ? "o" : c === ">" ? ">" : INK[(hash(seed + i + "," + j)) % INK.length]).join("")).join("\n");
const scale = (g, k) => g.flatMap(r => Array(k).fill([...r].map(c => c.repeat(k)).join("")));
$("#critters").innerHTML = `<pre class="critter cr1">${shade(scale(BIRDS.cotorra, 2), "c")}</pre><pre class="critter cr2">${shade(scale(BIRDS.paloma, 2), "p")}</pre><pre class="critter cr3">${shade(scale(BIRDS.hornero, 2), "h")}</pre>`;
const slug = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function render(t) {
  const M = t.b.man;
  const reach = esc(M.reach).replace("{email}", `<a href="${mailto()}">${t.footer.email.toLowerCase()}</a>`).replace("{linkedin}", `<a href="${L.linkedin}" ${ext}>LinkedIn</a>`);
  $("#app").innerHTML = `
<a class="skip" href="#main">${t.skip}</a>
<div class="bar"><span>${M.page}</span><span class="mid">${M.book}</span><span>${M.page}</span></div>
<div class="tools">${langToggle()}<button type="button" data-theme-btn aria-label="${esc(t.themeLabel)}" aria-pressed="${theme === "light"}">[${theme === "dark" ? "light" : "dark"}]</button></div>
<main id="main">
  <h2>${M.name}</h2>
  <div class="in"><p class="lead"><b>rocío jacob</b> — ${t.pitch.charAt(0).toLowerCase() + t.pitch.slice(1)}</p></div>

  <h2>${M.synopsis}</h2>
  <div class="in"><code class="cmd">${esc(M.cmd)}</code><p>${t.heroIntro} ${t.availability}</p><p>${reach}</p></div>

  <h2>${M.desc}</h2>
  <div class="in"><div class="who">${portrait()}<span>${t.remote}</span></div>${t.profile.map(p => `<p>${p}</p>`).join("")}${offClock()}</div>

  <h2>${M.options}</h2>
  <div class="in">${t.services.map(s => `<div class="opt"><b>--${slug(s.name)}</b><span>${s.body}</span><p>${t.delivLabel}: ${s.deliv}</p></div>`).join("")}<p style="color:var(--soft)">${t.freelance}</p></div>

  <h2 id="work">${M.examples}</h2>
  <div class="in">${t.cases.map(c => `<div class="ex"><code class="cmd">rocio ${M.run} ${slug(c.name)}</code><h3>${c.name}</h3><span class="r"># ${M.out}: ${c.impact}</span><p>${c.body}</p><p>${M.stack}: ${c.tags.join(", ")}</p></div>`).join("")}</div>

  <h2>${M.play}</h2>
  <div class="in"><p>${t.b.playBody}</p>
    <div class="hud"><span>${t.b.playHint}</span><span>${t.b.playScore}: <b id="sc">0</b> · ${t.b.playBest}: <b id="bs">0</b></span></div>
    <canvas id="game" width="640" height="300" tabindex="0" role="button" aria-label="${esc(t.b.playTitle)}: ${esc(t.b.playHint)}"></canvas>
    <p style="margin-top:12px">${t.lab.map(l => `${labName(l)} <span style="color:var(--soft)"># ${labMeta(l)}</span>`).join("<br>")}</p></div>

  <h2>${M.files}</h2>
  <div class="in"><p>${t.booksIntro}</p><ul class="files">${content.books.map(b => `<li><span class="perm">-r--r--r--</span> ~/${lang === "es" ? "libros" : "books"}/${slug(b.title)}.txt <span style="color:var(--soft)"># ${esc(b.author)}</span></li>`).join("")}</ul></div>

  <h2>${M.history}</h2>
  <div class="in"><ul class="hist">${expSplit(t, e => `<li><span style="color:var(--soft)">${e.when}</span><span>${e.role}<br><small>${e.org}</small></span></li>`)}</ul></div>

  <h2 id="contact">${M.see}</h2>
  <div class="in see"><a href="${mailto()}">mail(1)</a><a href="${L.linkedin}" ${ext}>linkedin(1)</a><a href="${L.github}" ${ext}>github(1)</a></div>
  <p class="sr">${M.critters}</p>
</main>
<div class="foot"><span>${M.updated}: 2026-11</span><span class="sig" aria-label="${esc(t.name)}">Rocío</span><span>${M.page}</span></div>`;
  game();
}
/* Tiny hop-through-the-gaps loop, kept from the earlier B. */
let raf;
function game() {
  cancelAnimationFrame(raf);
  const c = $("#game"), x = c.getContext("2d"), W = 640, H = 300;
  let st = "idle", y, v, pipes, score, best = +store.get("rj-best") || 0, f = 0;
  $("#bs").textContent = best;
  const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  const reset = () => { y = H / 2; v = 0; pipes = []; score = 0; f = 0; $("#sc").textContent = 0; };
  const hop = () => { if (st !== "play") { reset(); st = "play"; loop(); } v = -6; };
  function draw() {
    x.clearRect(0, 0, W, H);
    x.fillStyle = css("--soft"); x.font = '500 14px "IBM Plex Mono",monospace';
    pipes.forEach(p => { for (let j = 0; j < H; j += 14) if (j < p.g || j > p.g + 110) x.fillText("####", p.x, j + 12); });
    CAT.forEach((r, j) => [...r].forEach((ch, i) => { if (ch !== ".") { x.fillStyle = ch === "o" ? "#003049" : PINK; x.fillRect(113 + i * 2.5, y - 12 + j * 2.5, 2.6, 2.6); } }));
    x.fillStyle = css("--ink"); x.textAlign = "center";
    if (st !== "play") x.fillText(st === "idle" ? T().b.playStart : T().b.playOver, W / 2, H / 2 - 40);
    x.textAlign = "start";
  }
  function loop() {
    if (st !== "play") return;
    f++; v += 0.36; y += v;
    if (f % 95 === 1) pipes.push({ x: W, g: 30 + Math.random() * (H - 170), ok: false });
    pipes.forEach(p => {
      p.x -= 2.6;
      if (!p.ok && p.x + 36 < 120) { p.ok = true; $("#sc").textContent = ++score; }
      if (p.x < 142 && p.x + 36 > 120 && (y - 11 < p.g || y + 11 > p.g + 110)) st = "over";
    });
    pipes = pipes.filter(p => p.x > -50);
    if (y > H - 11 || y < 11) st = "over";
    if (st === "over" && score > best) { best = score; store.set("rj-best", best); $("#bs").textContent = best; }
    draw();
    if (st === "play") raf = requestAnimationFrame(loop);
  }
  c.onpointerdown = e => { e.preventDefault(); c.focus({ preventScroll: true }); hop(); };
  c.onkeydown = e => { if (e.code === "Space" || e.key === "Enter" || e.key === "ArrowUp") { e.preventDefault(); hop(); } };
  reset(); draw();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => st !== "play" && draw());
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-theme-btn]")) {
    theme = theme === "dark" ? "light" : "dark"; store.set("rj-theme-b", theme);
    document.documentElement.dataset.theme = theme; apply(); $("[data-theme-btn]").focus();
  }
});
apply();
</script>
</body>
</html>
