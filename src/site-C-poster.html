<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocio Jacob · Product Engineer</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#669bbc;--k:#003049;--w:#fdf0d5;--f:"Archivo","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--y);color:var(--k);font:500 1.06rem/1.5 var(--f);overflow-x:hidden}
a{color:inherit;text-underline-offset:4px;text-decoration-thickness:2px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--k);outline-offset:3px}
.dark :focus-visible,.case.open :focus-visible{outline-color:var(--y)}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:var(--k);color:var(--w);padding:8px 12px;z-index:99}
.wrap{padding:0 clamp(18px,4vw,56px)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;padding:18px 0;font-weight:600;font-size:.95rem}
header .me{padding:9px 0;font-weight:800;margin-right:auto;text-decoration:none;letter-spacing:-.02em;font-size:1.1rem}
header nav{display:flex;gap:4px 18px;flex-wrap:wrap}
header nav a{text-decoration:none;padding:10px 0}header nav a:hover{text-decoration:underline}
.lang{display:inline-flex;align-items:center;gap:2px}
.lang button{min-width:40px;min-height:40px;font-weight:600}
.lang button[aria-pressed=true]{font-weight:800;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.code{font-weight:700;font-size:.8rem;letter-spacing:.06em;font-variant-numeric:tabular-nums;text-transform:uppercase}
.hero{display:grid;gap:30px;padding:clamp(26px,6vw,80px) 0 50px}
h1{font:700 clamp(2.9rem,10.2vw,10rem)/.94 var(--f);letter-spacing:-.055em;margin:0;max-width:13ch}
h1 span{display:inline-block;animation:up .7s cubic-bezier(.2,.9,.2,1) both}
@keyframes up{from{transform:translateY(60%);opacity:0}}
.hrow{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--k);color:var(--w);font-weight:700;font-size:1.1rem;padding:18px 28px;border-radius:999px;text-decoration:none;border:2px solid var(--k);transition:transform .15s,background .15s,color .15s}
.btn:hover{background:var(--y);color:var(--k);transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--k)}
.dark .btn{background:var(--w);color:var(--k);border-color:var(--w)}.dark .btn:hover{background:var(--k);color:var(--w);box-shadow:5px 5px 0 var(--y)}
.stick{position:relative;height:230px;border:2px dashed var(--k);border-radius:22px;touch-action:none;overflow:hidden}
.stick small{position:absolute;left:14px;bottom:10px;font-weight:600;font-size:.82rem}
.st{position:absolute;padding:10px 18px;border:2px solid var(--k);border-radius:999px;font-weight:800;font-size:clamp(1rem,2.2vw,1.5rem);letter-spacing:-.02em;background:var(--w);cursor:grab;user-select:none;-webkit-user-select:none;transform:translate(var(--dx,0),var(--dy,0)) rotate(var(--r,0deg));transition:transform .25s cubic-bezier(.2,1.5,.4,1);box-shadow:3px 3px 0 var(--k)}
.st:nth-child(2n){background:var(--k);color:var(--w)}.st:nth-child(3n){border-radius:10px}
.st.drag{cursor:grabbing;transition:none;z-index:5}
section{padding:clamp(44px,7vw,96px) 0;border-top:2px solid var(--k)}
h2{font:700 clamp(2.3rem,7vw,6rem)/.95 var(--f);letter-spacing:-.05em;margin:8px 0 34px}
h3{font:700 clamp(1.5rem,3vw,2.3rem)/1 var(--f);letter-spacing:-.035em;margin:0}
p{margin:0 0 1em}.big{font-size:clamp(1.25rem,2.3vw,1.9rem);line-height:1.3;font-weight:600;letter-spacing:-.02em;max-width:32ch}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:26px 22px}
.nums b{display:block;font:800 clamp(2.6rem,6vw,4.6rem)/.9 var(--f);letter-spacing:-.06em}
.nums span{display:block;margin-top:8px;font-size:.95rem;line-height:1.3;font-weight:600}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:18px;grid-auto-flow:dense}
.case{border:2px solid var(--k);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;min-height:270px;transition:transform .15s,box-shadow .15s,background .2s,color .2s}
.case:not(.open):hover{transform:translate(-4px,-4px);box-shadow:7px 7px 0 var(--k)}
.case .top{display:flex;justify-content:space-between;gap:10px}
.case .imp{font-weight:700;margin-top:auto}
.case .view{align-self:flex-start;border:2px solid currentColor;border-radius:999px;padding:10px 20px;font-weight:700;min-height:44px}
.case .view:hover{background:var(--k);color:var(--w)}
.case .det{display:none}
.case.open{grid-column:1/-1;background:var(--k);color:var(--w)}
.case.open .det{display:grid;gap:14px 40px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));animation:up .35s both}
.case.open .view:hover{background:var(--y);color:var(--k)}
.case.open h3{font-size:clamp(2rem,6vw,4.6rem)}
.det p{font-size:1.15rem;margin:0}.det dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-content:start}.det dt{font-weight:800}.det dd{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{border:2px solid currentColor;border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:600}
.sv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:0;border:2px solid var(--k);border-radius:22px;overflow:hidden;margin-bottom:34px}
.sv>div{padding:24px;border-right:2px solid var(--k);border-bottom:2px solid var(--k);margin:0 -2px -2px 0}
.sv h3{font-size:clamp(2.4rem,5vw,4rem);margin:26px 0 4px}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:70px minmax(0,1.1fr) minmax(0,1.6fr);gap:6px 20px;padding:16px 0;border-top:2px solid var(--k);align-items:baseline}
.rows b{font-size:1.15rem;letter-spacing:-.02em}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:16px}
.bk{border:2px solid var(--k);border-radius:6px 18px 18px 6px;padding:18px 18px 18px 26px;min-height:230px;display:flex;flex-direction:column;gap:8px;position:relative;background:var(--w);transition:transform .18s cubic-bezier(.2,1.5,.4,1)}
.bk::before{content:"";position:absolute;left:10px;top:0;bottom:0;border-left:2px solid var(--k)}
.bk:nth-child(3n+2){background:var(--k);color:var(--w)}.bk:nth-child(3n+2)::before{border-color:var(--y)}
.bk:nth-child(3n){background:transparent}
.bk:hover{transform:rotate(-2deg) translateY(-6px)}
.bk b{font-size:1.4rem;line-height:1.05;letter-spacing:-.03em;overflow-wrap:anywhere}
.bk i{margin-top:auto;font-style:normal;font-size:.92rem;line-height:1.3}
.dark{background:var(--k);color:var(--w);border-radius:28px 28px 0 0;padding:clamp(44px,8vw,110px) clamp(18px,4vw,56px) 110px;border:0}
.dark h2{font-size:clamp(3rem,13vw,12rem);margin-bottom:26px}
footer{display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:space-between;margin-top:60px;padding-top:20px;border-top:2px solid var(--y);font-weight:600}
footer a{margin-right:18px;display:inline-block;padding:8px 0}
.tagline{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--k);color:var(--w);font-weight:700;font-size:.72rem;letter-spacing:.02em;padding:6px 14px;text-align:center;border-top:2px solid var(--y)}
.rv{opacity:0;transform:translateX(-46px);transition:opacity .35s,transform .5s cubic-bezier(.15,.9,.2,1)}
.rv.in{opacity:1;transform:none}
@media(min-width:980px){.tagline{left:12px;right:auto;bottom:14px;writing-mode:vertical-rl;transform:rotate(180deg);padding:14px 6px;border:2px solid var(--y);border-radius:999px;font-size:.74rem}.hero{grid-template-columns:minmax(0,1fr) 340px;align-items:end}.hero h1{grid-column:1/-1}.stick{height:250px}}
@media(max-width:640px){.rows li{grid-template-columns:1fr;gap:2px}.tagline{font-size:.64rem;padding:6px 4px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/*CORE*/

/* ---------- Site C · Poster ---------- */
const STICKERS = [["Webflow", 6, 12, -8], ["React", 44, 6, 6], ["Expo", 70, 40, -5], ["Python", 12, 52, 5], ["Jira", 50, 56, -10], ["Anaplan", 28, 30, 9]];
let openCase = -1;
function render(t) {
  const words = t.c.hero.split(" ").map((w, i) => `<span style="animation-delay:${i * 45}ms">${w}</span>`).join(" ");
  $("#app").innerHTML = `
<a class="skip" href="#main">${t.skip}</a>
<div class="wrap">
<header>
  <a class="me" href="#top">Rocio Jacob™</a>
  <nav aria-label="Sections"><a href="#work">${t.nav.work}</a><a href="#services">${t.nav.services}</a><a href="#about">${t.nav.about}</a><a href="#books">${t.nav.books}</a><a href="#contact">${t.nav.contact}</a></nav>
  <span class="code">${t.remote}</span>
  ${langToggle()}
</header>
<main id="main">
  <div class="hero" id="top">
    <h1>${words}</h1>
    <div><p class="big">${t.oneLiner}</p>
      <div class="hrow"><a class="btn" href="${mailto()}">${t.cta} →</a><span class="code">${t.status}</span></div></div>
    <div class="stick" id="stick" aria-hidden="true">${STICKERS.map(([n, l, tp, r]) => `<span class="st" style="left:${l}%;top:${tp}%;--r:${r}deg">${n}</span>`).join("")}<small>${t.c.stickersHint}</small></div>
  </div>

  <section aria-label="${t.h.numbers}" class="rv"><div class="code">NO.00 — ${t.h.numbers}</div>
    <div class="nums" style="margin-top:26px">${t.stats.map(s => `<div><b>${s.n}</b><span>${s.l}</span></div>`).join("")}</div>
  </section>

  <section id="work"><div class="code">WK.00 — ${t.cases.length}</div><h2 class="rv">${t.h.work}</h2>
    <div class="cases">${t.cases.map((c, i) => `<article class="case${i === openCase ? " open" : ""}">
      <div class="top"><span class="code">${c.code}</span><span class="code">${c.org}</span></div>
      <h3>${c.name}</h3>
      <div class="det"><p>${c.body}</p><dl><dt>${c.code}</dt><dd>${c.role}</dd><dt>—</dt><dd>${c.when}</dd><dt>↗</dt><dd>${c.impact}</dd>${c.url ? `<dt>⌘</dt><dd><a href="${c.url}" ${ext}>${t.repo}</a></dd>` : ""}</dl><div class="tags">${c.tags.map(x => `<span>${x}</span>`).join("")}</div></div>
      <div class="imp">${c.impact}</div>
      <button type="button" class="view" data-case="${i}" aria-expanded="${i === openCase}">${i === openCase ? t.close + " ×" : t.view + " +"}</button>
    </article>`).join("")}</div>
  </section>

  <section id="services"><div class="code">SV.00</div><h2 class="rv">${t.c.servicesTitle}</h2>
    <div class="sv">${t.services.map(s => `<div><span class="code">${s.code} — ${s.sub}</span><h3>${s.name}</h3><p>${s.body}</p></div>`).join("")}</div>
    <p class="big" style="max-width:38ch">${t.freelance}</p>
    <a class="btn" href="${mailto()}">${t.ctaAlt} →</a>
  </section>

  <section id="about"><div class="code">AB.00</div><h2 class="rv">${t.h.about}</h2>
    <p class="big" style="max-width:40ch">${t.about[0]}</p>
    <div style="max-width:62ch">${t.about.slice(1).map(p => `<p>${p}</p>`).join("")}</div>
    <ul class="rows" style="margin-top:30px">${t.finance.map((f, i) => `<li><span class="code">FN.0${i + 1}</span><b>${f.k}</b><span>${f.v}</span></li>`).join("")}</ul>
  </section>

  <section id="experience"><div class="code">XP.00</div><h2 class="rv">${t.h.experience}</h2>
    <ul class="rows">${t.timeline.map((e, i) => `<li><span class="code">XP.0${i + 1}</span><span><b>${e.role}</b><br>${e.org}</span><span><span class="code">${e.when}</span><br>${e.note}</span></li>`).join("")}</ul>
  </section>

  <section id="skills"><div class="code">SK.00</div><h2 class="rv">${t.h.skills}</h2>
    <ul class="rows">${t.skills.map(s => `<li><span class="code">${s.code}</span><b>${s.name}</b><span class="tags">${s.items.map(x => `<span>${x}</span>`).join("")}</span></li>`).join("")}</ul>
  </section>

  <section id="books"><div class="code">BK.00</div><h2 class="rv">${t.h.books}</h2>
    <p class="big">${t.booksIntro}</p>
    <div class="books">${content.books.map((b, i) => `<div class="bk"><span class="code">BK.0${i + 1}</span><b>${b.url ? `<a href="${b.url}" ${ext}>${esc(b.title)}</a>` : esc(b.title)}</b><span>${esc(b.author)}</span><i>${esc(b.note[lang] || "")}</i></div>`).join("")}</div>
    <p style="margin-top:18px;font-weight:600">${t.booksNote}</p>
  </section>

  <section id="writing"><div class="code">WR.00</div><h2 class="rv">${t.h.writing}</h2>
    <p class="big">${t.writingIntro}</p>
    <ul class="rows">${content.writing.map((w, i) => `<li><span class="code">WR.0${i + 1}</span><b>${w.url ? `<a href="${w.url}" ${ext}>${esc(w.title[lang])}</a>` : esc(w.title[lang])}</b><span class="code">${fmtDate(w.date)}${w.url ? "" : " · " + t.soon}</span></li>`).join("")}</ul>
  </section>
</main>
</div>
<section id="contact" class="dark">
  <div class="code">CT.00 — ${t.h.contact}</div>
  <h2 class="rv">${t.ctaAlt}.</h2>
  <p class="big">${t.contactTitle}</p><p>${t.contactBody}</p>
  <a class="btn" href="${mailto()}">${t.cta} →</a>
  <footer><span>${t.footer.rights}</span><span>${footerLinks()}</span></footer>
</section>
<div class="tagline">${t.c.tagline}</div>`;
  stickers();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-case]"); if (!b) return;
  const i = +b.dataset.case; openCase = openCase === i ? -1 : i;
  const y = scrollY; apply(); scrollTo(0, y);
  const nb = $(`[data-case="${i}"]`); nb.focus({ preventScroll: true });
  if (openCase === i) nb.closest(".case").scrollIntoView({ block: "nearest", behavior: reduced ? "auto" : "smooth" });
});
/* cursor-reactive, draggable stickers */
function stickers() {
  const box = $("#stick"), els = $$(".st", box);
  if (!reduced) box.onpointermove = e => {
    const r = box.getBoundingClientRect();
    els.forEach(el => {
      if (el.classList.contains("drag")) return;
      const b = el.getBoundingClientRect(), dx = b.left + b.width / 2 - e.clientX, dy = b.top + b.height / 2 - e.clientY, d = Math.hypot(dx, dy) || 1;
      const push = Math.max(0, 110 - d) / 110 * 26;
      el.style.setProperty("--dx", (dx / d * push).toFixed(1) + "px"); el.style.setProperty("--dy", (dy / d * push).toFixed(1) + "px");
    });
  };
  box.onpointerleave = () => els.forEach(el => { el.style.setProperty("--dx", "0px"); el.style.setProperty("--dy", "0px"); });
  els.forEach(el => {
    el.onpointerdown = e => {
      const r = box.getBoundingClientRect(), b = el.getBoundingClientRect(), ox = e.clientX - b.left, oy = e.clientY - b.top;
      el.setPointerCapture(e.pointerId); el.classList.add("drag"); el.style.setProperty("--dx", "0px"); el.style.setProperty("--dy", "0px");
      el.onpointermove = m => {
        el.style.left = Math.min(r.width - b.width, Math.max(0, m.clientX - r.left - ox)) + "px";
        el.style.top = Math.min(r.height - b.height, Math.max(0, m.clientY - r.top - oy)) + "px";
      };
      el.onpointerup = el.onpointercancel = () => { el.classList.remove("drag"); el.onpointermove = null; };
    };
  });
}
apply();
</script>
</body>
</html>
