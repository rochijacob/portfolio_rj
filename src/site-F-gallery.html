<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocío Jacob · Product Engineer</title>
<meta name="description" content="">
<meta name="theme-color" content="#fbf4e3">
<meta property="og:type" content="website">
<meta property="og:title" content="Rocío Jacob · Product Engineer">
<meta property="og:description" content="I build products, automation and analytics so organizations decide better and do less manual work.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23003049'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' font-weight='700' text-anchor='middle' fill='%23fdf0d5'%3ERJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--wall:#fbf4e3;--ink:#003049;--mut:#48606e;--line:#dccfae;--sky:#669bbc;--pink:#e56b9a;--film:#001824;
  --serif:"Instrument Serif","Times New Roman",serif;--sans:"Instrument Sans",system-ui,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--wall);color:var(--ink);font:400 1rem/1.6 var(--sans)}
a{color:inherit;text-underline-offset:4px;text-decoration-thickness:1px}a:hover{color:#1b5e85}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:var(--ink);color:var(--wall);padding:8px 12px;z-index:99}
.cap{font:500 .72rem/1.5 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
aside.idx{padding:22px 24px;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;border-bottom:1px solid var(--line)}
aside.idx .me{font:400 1.5rem/1 var(--serif);font-style:italic;text-decoration:none;margin-right:auto}
aside.idx ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:0 18px;counter-reset:r}
aside.idx li{counter-increment:r}
aside.idx li a{display:block;padding:10px 0;text-decoration:none;font-size:.9rem}
aside.idx li a::before{content:counter(r,decimal-leading-zero) "  ";color:var(--mut);font-size:.72rem;letter-spacing:.1em}
aside.idx li a:hover{font-style:italic}
.lang{display:inline-flex;align-items:center;gap:2px;color:var(--mut)}
.lang button{min-width:40px;min-height:40px;font-size:.8rem;letter-spacing:.1em;color:var(--mut)}
.lang button[aria-pressed=true]{color:var(--ink);font-weight:600;border-bottom:1px solid var(--ink)}
main{padding:0 clamp(22px,6vw,90px)}
.hero{min-height:74vh;display:flex;flex-direction:column;justify-content:center;padding:70px 0}
h1{font:400 clamp(2.5rem,7.4vw,6.6rem)/1.02 var(--serif);letter-spacing:-.02em;margin:18px 0 26px;max-width:15ch}
h1 em{font-style:italic;color:#1b5e85}
.hero p{max-width:52ch;color:var(--mut)}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.btn{display:inline-flex;align-items:center;padding:14px 26px;border:1px solid var(--ink);border-radius:999px;text-decoration:none;font-weight:500;transition:background .3s,color .3s}
.btn.p,.btn:hover{background:var(--ink);color:var(--wall)}.btn.p:hover{background:#1b5e85;color:var(--wall)}
section{padding:clamp(60px,10vw,130px) 0;border-top:1px solid var(--line);scroll-margin-top:10px}
h2{font:400 clamp(2.2rem,5vw,4rem)/1 var(--serif);font-style:italic;margin:8px 0 34px;letter-spacing:-.01em}
h3{font:400 1.55rem/1.15 var(--serif);margin:0}
p{margin:0 0 1em}
.wall{display:flex;gap:clamp(26px,5vw,64px);overflow-x:auto;scroll-snap-type:x proximity;padding:10px 4px 26px;margin:0 calc(-1*clamp(22px,6vw,90px));padding-left:clamp(22px,6vw,90px);padding-right:clamp(22px,6vw,90px)}
.piece{flex:0 0 min(78vw,380px);scroll-snap-align:start}
.frame{border:10px solid var(--ink);padding:22px;background:#fffaf0;box-shadow:0 22px 34px -22px rgba(0,48,73,.55);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.piece:hover .frame{transform:translateY(-8px)}
.frame svg{display:block;width:100%;height:auto}
.label{margin-top:22px;padding-left:14px;border-left:1px solid var(--ink)}
.label p{font-size:.92rem;color:var(--mut);margin:10px 0 0}
.label .cap b{color:var(--ink);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:30px clamp(30px,6vw,80px)}
.stmt p:first-child{font:400 clamp(1.5rem,2.6vw,2.1rem)/1.25 var(--serif)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:26px;margin-top:40px}
.nums b{display:block;font:400 3rem/1 var(--serif);font-style:italic}
.nums span{font-size:.86rem;color:var(--mut);display:block;margin-top:6px;line-height:1.4}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:minmax(0,210px) 1fr;gap:6px 30px;padding:20px 0;border-top:1px solid var(--line)}
.rows small{display:block;color:var(--mut);font-size:.92rem;margin-top:4px}
.portrait{width:120px;height:150px;border:8px solid var(--ink);background:#fffaf0;display:grid;place-items:center;font:400 2rem var(--serif);font-style:italic;position:relative;overflow:hidden;margin-bottom:22px}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plinth{display:inline-flex;flex-direction:column;align-items:center;gap:0;margin-top:40px}
.plinth i{display:block;width:120px;height:46px;background:#fffaf0;border:1px solid var(--line);border-top:3px solid var(--ink)}
/* contact sheet */
.sheet{background:var(--film);color:#fdf0d5;padding:34px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:26px 14px;position:relative;border-radius:3px}
.sheet::before,.sheet::after{content:"";position:absolute;left:0;right:0;height:12px;background:repeating-linear-gradient(90deg,transparent 0 10px,#fdf0d5 10px 20px,transparent 20px 30px);opacity:.5}
.sheet::before{top:10px}.sheet::after{bottom:10px}
.neg{aspect-ratio:3/2;background:#f1d9a7;color:var(--ink);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;outline:1px solid #fdf0d5;outline-offset:3px;transition:filter .4s}
.fr:nth-child(3n+2) .neg{background:var(--sky)}.fr:nth-child(3n) .neg{background:#eeb3c9}
.fr:hover .neg{filter:saturate(1.4) brightness(1.05)}
.neg b{font:400 1.25rem/1.05 var(--serif);overflow-wrap:anywhere}
.fr .cap{color:#f3c9d9;margin-top:12px;display:flex;justify-content:space-between;gap:8px}
.fr p{font-size:.86rem;margin:4px 0 0;color:#d6e2e8}
.end{text-align:center}.end h2{font-size:clamp(3rem,10vw,8rem)}
.end p{max-width:56ch;margin:0 auto 1em}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;padding:26px clamp(22px,6vw,90px) 40px;border-top:1px solid var(--line)}
footer a{margin-right:18px;display:inline-block;padding:10px 0}
.rv{opacity:0;transform:translateY(22px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media(min-width:1080px){
  body{padding-left:230px}
  aside.idx{position:fixed;left:0;top:0;bottom:0;width:230px;flex-direction:column;align-items:flex-start;flex-wrap:nowrap;border:0;border-right:1px solid var(--line);padding:34px 28px;gap:26px}
  aside.idx .me{margin:0}aside.idx ol{flex-direction:column}aside.idx .lang{margin-top:auto}
}
@media(max-width:600px){.rows li{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/*CORE*/

/* ---------- Site F · Gallery ---------- */
/* A small abstract composition per work, generated from its title. */
function art(seed) {
  let h = hash(seed);
  const rnd = () => { h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0; h = Math.imul(h ^ (h >>> 13), 3266489909) >>> 0; h = (h ^ (h >>> 16)) >>> 0; return h / 4294967296; };
  const BG = ["#003049", "#f1d9a7", "#669bbc", "#fdf0d5"], FG = ["#003049", "#669bbc", "#e56b9a", "#fdf0d5", "#1b5e85", "#f1d9a7"];
  const bg = BG[Math.floor(rnd() * BG.length)], pick = () => { let c; do c = FG[Math.floor(rnd() * FG.length)]; while (c === bg); return c; };
  let out = `<rect width="320" height="240" fill="${bg}"/>`;
  for (let i = 0; i < 4; i++) {
    const x = 40 + rnd() * 240, y = 40 + rnd() * 160, r = 26 + rnd() * 60, c = pick(), k = Math.floor(rnd() * 4);
    if (k === 0) out += `<circle cx="${x.toFixed()}" cy="${y.toFixed()}" r="${r.toFixed()}" fill="${c}"/>`;
    else if (k === 1) out += `<rect x="${(x - r).toFixed()}" y="${(y - r / 2).toFixed()}" width="${(r * 2).toFixed()}" height="${r.toFixed()}" fill="${c}"/>`;
    else if (k === 2) out += `<path d="M${(x - r).toFixed()} ${y.toFixed()}a${r.toFixed()} ${r.toFixed()} 0 0 1 ${(2 * r).toFixed()} 0z" fill="${c}"/>`;
    else out += `<line x1="${(x - r).toFixed()}" y1="${(y + r / 2).toFixed()}" x2="${(x + r).toFixed()}" y2="${(y - r / 2).toFixed()}" stroke="${c}" stroke-width="6"/>`;
  }
  return `<svg viewBox="0 0 320 240" aria-hidden="true">${out}</svg>`;
}
function render(t) {
  const f = t.f;
  const rooms = [["work", f.works], ["about", f.statement], ["offers", f.commissions], ["experience", f.provenance], ["skills", f.mediums], ["lab", f.studies], ["books", f.reading], ["writing", f.essays], ["contact", f.enquiries]];
  const words = t.pitch.split(" "), cut = Math.ceil(words.length * .42);
  $("#app").innerHTML = `
<a class="skip" href="#main">${t.skip}</a>
<aside class="idx" aria-label="${f.index}">
  <a class="me" href="#top">${t.name}</a>
  <nav aria-label="${f.index}"><ol>${rooms.map(([id, l]) => `<li><a href="#${id}">${l}</a></li>`).join("")}</ol></nav>
  ${langToggle()}
</aside>
<main id="main">
  <div class="hero" id="top">
    <div class="cap">${t.role} · ${t.remote}</div>
    <h1>${words.slice(0, cut).join(" ")} <em>${words.slice(cut).join(" ")}</em></h1>
    <p>${t.sub}</p>
    <div class="btns"><a class="btn p" href="${mailto()}">${t.cta}</a><a class="btn" href="#work">${f.works} ↓</a></div>
  </div>

  <section id="work"><div class="cap">01 · ${t.cases.length} ${f.works.toLowerCase()} · ${f.hint}</div><h2 class="rv">${f.works}</h2>
    <div class="wall" tabindex="0" role="group" aria-label="${f.works}">${t.cases.map(c => `<article class="piece">
      <div class="frame">${art(c.code + c.impact)}</div>
      <div class="label"><h3>${c.url ? `<a href="${c.url}" ${ext}>${c.name}</a>` : c.name}</h3>
        <div class="cap" style="margin-top:6px">${c.org}, ${c.when}</div>
        <div class="cap"><b>${f.medium}:</b> ${c.tags.join(", ")}</div>
        <div class="cap"><b>${c.impact}</b></div>
        <p>${caseBody(c)}</p></div>
    </article>`).join("")}</div>
  </section>

  <section id="about"><div class="cap">02</div><h2 class="rv">${f.statement}</h2>
    <div class="cols"><div class="stmt">${portrait()}${t.about.map(p => `<p>${p}</p>`).join("")}${offClock()}
        <div class="plinth" aria-hidden="true">${pixelCat(5)}<i></i></div><div class="cap" style="margin-top:10px">${f.mascot}</div></div>
      <div><div class="cap">${t.h.finance}</div><ul class="rows" style="margin-top:14px">${t.finance.map(x => `<li style="grid-template-columns:90px 1fr"><span class="cap">${x.k}</span><span>${x.v}</span></li>`).join("")}</ul></div></div>
    <div class="nums">${t.stats.map(s => `<div><b>${s.n}</b><span>${s.l}</span></div>`).join("")}</div>
  </section>

  <section id="offers"><div class="cap">03</div><h2 class="rv">${f.commissions}</h2>
    <div class="cols">${t.services.map(s => `<div><div class="cap">${s.code} · ${s.sub}</div><h3 style="margin:8px 0 10px">${s.name}</h3><p>${svcBody(s)}</p></div>`).join("")}</div>
    <p style="max-width:60ch;margin-top:30px">${t.freelance}</p>
    <a class="btn p" href="${mailto()}">${t.ctaAlt}</a>
  </section>

  <section id="experience"><div class="cap">04</div><h2 class="rv">${f.provenance}</h2>
    <ul class="rows">${t.timeline.map(e => `<li><span class="cap">${e.when}</span><div><h3>${e.role}</h3><small>${e.org}${e.note ? " · " + e.note : ""}</small></div></li>`).join("")}</ul>
  </section>

  <section id="skills"><div class="cap">05</div><h2 class="rv">${f.mediums}</h2>
    <ul class="rows">${t.skills.map(s => `<li><span class="cap">${s.name}</span><span style="font:400 1.3rem/1.4 var(--serif)">${s.items.join(", ")}</span></li>`).join("")}</ul>
  </section>

  <section id="lab"><div class="cap">06</div><h2 class="rv">${f.studies}</h2><p>${t.labIntro}</p>
    <ul class="rows">${t.lab.map(l => `<li><h3>${labName(l)}</h3><span>${l.why}</span></li>`).join("")}</ul>
  </section>

  <section id="books"><div class="cap">07 · ${t.booksNote}</div><h2 class="rv">${f.reading}</h2><p>${t.booksIntro}</p>
    <div class="sheet">${content.books.map((b, i) => `<div class="fr"><div class="neg"><b>${b.url ? `<a href="${b.url}" ${ext}>${esc(b.title)}</a>` : esc(b.title)}</b></div>
      <div class="cap"><span>${esc(b.author)}</span><span>→ ${i + 1}A</span></div><p>${esc(b.note[lang] || "")}</p></div>`).join("")}</div>
  </section>

  <section id="writing"><div class="cap">08</div><h2 class="rv">${f.essays}</h2><p>${t.writingIntro}</p>
    <ul class="rows">${content.writing.map(w => `<li><span class="cap">${fmtDate(w.date)}${w.url ? "" : " · " + t.soon}</span><h3>${w.url ? `<a href="${w.url}" ${ext}>${esc(w.title[lang])}</a>` : esc(w.title[lang])}</h3></li>`).join("")}</ul>
  </section>

  <section id="contact" class="end"><div class="cap">09 · ${f.enquiries}</div><h2 class="rv">${t.ctaAlt}.</h2>
    <p>${t.contactTitle}</p><p>${t.contactBody}</p>
    <div class="btns" style="justify-content:center"><a class="btn p" href="${mailto()}">${t.cta}</a></div>
  </section>
</main>
<footer><span class="cap">${t.footer.rights}</span><span class="cap">${footerLinks()}</span></footer>`;
}
apply();
</script>
</body>
</html>
