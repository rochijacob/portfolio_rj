<style>
:root{--bg:#fdf0d5;--ink:#003049;--mut:#48606e;--line:#e6d6b4;--acc:#1b5e85;--chip:#c9dde9;--card:#fff8e6;--shelf:#003049;

:root[data-theme=dark]{--bg:#00202f;--ink:#fdf0d5;--mut:#9fb6c3;--line:#123f55;--acc:#8fbcd6;--chip:#0f4560;--card:#00283b;--shelf:#669bbc}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.125rem/1.65 var(--serif);transition:background .3s,color .3s}
a{color:inherit;text-decoration-color:var(--acc);text-underline-offset:3px}
a:hover{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:3px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:var(--ink);color:var(--bg);padding:8px 12px;z-index:9}
.mono{font:400 .78rem/1.4 var(--mono);letter-spacing:.02em;text-transform:uppercase;color:var(--mut)}
.wrap{max-width:1060px;margin:0 auto;padding:0 24px}
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:22px 0 18px;border-bottom:1px solid var(--line)}
.mark{padding:10px 0;font:500 1.15rem var(--serif);text-decoration:none;margin-right:auto;font-style:italic}
nav.n{display:flex;gap:4px 16px;flex-wrap:wrap}
nav.n a{font:400 .78rem var(--mono);text-transform:uppercase;text-decoration:none;color:var(--mut);padding:10px 0}
nav.n a:hover{color:var(--acc)}
.lang{display:inline-flex;align-items:center;gap:2px;font:400 .78rem var(--mono);color:var(--mut)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.lang button,.theme{min-width:40px;min-height:40px;font:400 .78rem var(--mono);color:var(--mut);border-radius:6px}
.lang button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:4px}
.theme{border:1px solid var(--line);color:var(--ink);font-size:1rem}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:56px;padding:56px 0 40px}
main{max-width:660px;min-width:0}
.hero p{font-size:clamp(1.45rem,1.1rem + 1.6vw,2.05rem);line-height:1.42;margin:14px 0 28px;letter-spacing:-.01em}
.chip{background:var(--chip);padding:.05em .38em;border-radius:6px;text-decoration:none;white-space:nowrap;transition:background .2s}
.chip:hover{background:var(--acc);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);font:500 .85rem var(--mono);text-transform:uppercase;letter-spacing:.03em;padding:14px 22px;border-radius:999px;text-decoration:none;transition:transform .2s,background .2s}
.pill:hover{background:var(--acc);color:#fff;transform:translateY(-2px)}
:root[data-theme=dark] .pill:hover{color:#00202f}
section{padding:44px 0;border-top:1px solid var(--line)}
section.hero{border:0;padding-top:0}
h2{font:600 1.9rem/1.15 var(--serif);margin:6px 0 18px;letter-spacing:-.015em}
h3{font:600 1.2rem/1.3 var(--serif);margin:0}
p{margin:0 0 1em}
.list{list-style:none;margin:0;padding:0}
.wr li{display:grid;grid-template-columns:92px 1fr;gap:16px;padding:12px 0;border-bottom:1px dotted var(--line);align-items:baseline}
.wr li>span:last-child,.wr a{font-size:1.15rem}
/* shelf */
.shelf{display:flex;align-items:flex-end;gap:5px;padding:26px 10px 0;border-bottom:10px solid var(--shelf);border-radius:0 0 3px 3px;overflow-x:auto;min-height:250px}
.spine{flex:0 0 auto;border-radius:3px 3px 0 0;color:#fdf0d5;display:flex;align-items:center;justify-content:center;padding:10px 0;position:relative;transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:inset -5px 0 0 rgba(0,0,0,.18),inset 3px 0 0 rgba(255,255,255,.12)}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font:500 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%}
.spine::before,.spine::after{content:"";position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.35)}
.spine::before{top:12px}.spine::after{bottom:12px}
.spine:hover,.spine:focus-visible,.spine[aria-pressed=true]{transform:translateY(-14px)}
.bookd{min-height:104px;padding:16px 0 0}
.bookd b{font-weight:600;font-size:1.2rem}
/* work */
.case{padding:20px 0;border-bottom:1px dotted var(--line)}
.case .meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin:4px 0 8px}
.case .imp{color:var(--acc)}
.case p{margin:0;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 24px;margin:8px 0 28px}
.stats b{display:block;font:600 2rem/1 var(--serif);letter-spacing:-.02em}
.stats span{font-size:.95rem;color:var(--mut);line-height:1.35;display:block;margin-top:4px}
.tl li{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:14px 0;border-bottom:1px dotted var(--line)}
.tl small{display:block;color:var(--mut);font-size:.98rem;line-height:1.45}
.sk{display:grid;grid-template-columns:150px 1fr;gap:6px 16px;padding:10px 0;border-bottom:1px dotted var(--line)}
.fin li{display:grid;grid-template-columns:92px 1fr;gap:16px;padding:9px 0}
.contact h2{font-size:clamp(1.7rem,1.2rem + 2vw,2.5rem)}
/* side */
aside .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.portrait{width:72px;height:72px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font:500 1.2rem var(--serif);font-style:italic;overflow:hidden;position:relative}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
aside h2{font-size:1.35rem;margin:14px 0 2px}
aside .links{display:flex;flex-direction:column;margin:14px 0}
aside .links a{font:400 .8rem var(--mono);text-transform:uppercase;padding:9px 0;text-decoration:none;border-bottom:1px dotted var(--line)}
aside .blk{margin:16px 0 0;font-size:1rem;line-height:1.5}
aside .pill{width:100%;justify-content:center;margin-top:18px}
footer{border-top:1px solid var(--line);padding:26px 0 40px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
footer a{margin-right:18px;padding:10px 0;display:inline-block}
.rv{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
@media(min-width:940px){.grid{grid-template-columns:minmax(0,660px) 290px;justify-content:space-between}aside .card{position:sticky;top:28px}}
@media(max-width:939px){aside{order:2}}
@media(max-width:560px){body{font-size:1.06rem}.tl li,.sk{grid-template-columns:1fr;gap:2px}.wrap{padding:0 18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>

};
let lang = (() => {
  const s = store.get("rj-lang");

  return s.replace(".", "");
};
const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let io;
function reveal() {
  if (io) io.disconnect();
  const els = $$(".rv");
  if (reduced || !("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px" });
  els.forEach(e => io.observe(e));
}
function langToggle(cls = "") {

}

function apply() {

}
document.addEventListener("click", e => {

});

const SPINES = ["#003049", "#1b5e85", "#2f6f94", "#0b4a6b", "#7a2e1d", "#5a4a2a", "#234b5c", "#8a3b2a"];
let book = 0;
let theme = store.get("rj-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
document.documentElement.dataset.theme = theme;

function bookDetail(t) {
  const b = content.books[book];
  const title = b.url ? `<a href="${b.url}" ${ext}>${esc(b.title)}</a>` : esc(b.title);
  return `<b>${title}</b><br><span class="mono">${esc(b.author)}</span><br>${esc(b.note[lang] || "")}`;
}
function render(t) {
  const nav = ["writing", "books", "about", "work", "experience", "skills"].map(k => `<a href="#${k}">${t.nav[k]}</a>`).join("");
  $("#app").innerHTML = `
<a class="skip" href="#main">${t.skip}</a>
<header class="top">
  <a class="mark" href="#top" id="top">rocio jacob</a>
  <nav class="n" aria-label="Sections">${nav}</nav>
  ${langToggle()}
  <button class="theme" type="button" data-theme-btn aria-label="${esc(t.themeLabel)}" aria-pressed="${theme === "dark"}">${theme === "dark" ? "☀" : "☾"}</button>
</header>
<div class="grid">
<main id="main">
  <section class="hero">
    <div class="mono">${t.a.kicker} · ${t.location}</div>
    <p>${t.a.hero}</p>
    <div class="mono" style="margin:-10px 0 24px">${t.sub}</div>
    <a class="pill" href="${mailto()}">${t.cta} →</a>
  </section>

  <section id="writing" class="rv">
    <div class="mono">01</div><h2>${t.h.writing}</h2><p>${t.writingIntro}</p>
    <ul class="list wr">${content.writing.map(w => `<li><span class="mono">${fmtDate(w.date)}</span>${w.url ? `<a href="${w.url}" ${ext}>${esc(w.title[lang])}</a>` : `<span>${esc(w.title[lang])} <span class="mono">· ${t.soon}</span></span>`}</li>`).join("")}</ul>
  </section>

  <section id="books" class="rv">
    <div class="mono">02</div><h2>${t.h.books}</h2><p>${t.booksIntro}</p>
    <div class="shelf">${content.books.map((b, i) => { const h = hash(b.title); return `<button type="button" class="spine" data-book="${i}" aria-pressed="${i === book}" aria-label="${esc(b.title)}, ${esc(b.author)}" style="height:${150 + h % 64}px;width:${38 + (h >>> 7) % 20}px;background:${SPINES[(h >>> 3) % SPINES.length]}"><span>${esc(b.title)}</span></button>`; }).join("")}</div>
    <div class="bookd" id="bookd" aria-live="polite">${bookDetail(t)}</div>
    <p class="mono">${t.booksNote}</p>
  </section>

  <section id="about" class="rv">
    <div class="mono">03</div><h2>${t.h.about}</h2>
    ${t.about.map(p => `<p>${p}</p>`).join("")}
    <h3 id="finance" style="margin-top:28px">${t.h.finance}</h3>
    <ul class="list fin">${t.finance.map(f => `<li><span class="mono">${f.k}</span><span>${f.v}</span></li>`).join("")}</ul>
  </section>

  <section id="work" class="rv">
    <div class="mono">04</div><h2>${t.h.work}</h2>
    <div class="stats">${t.stats.slice(0, 4).map(s => `<div><b>${s.n}</b><span>${s.l}</span></div>`).join("")}</div>
    ${t.cases.map(c => `<article class="case"><h3>${c.url ? `<a href="${c.url}" ${ext}>${c.name}</a>` : c.name}</h3>
      <div class="meta mono"><span>${c.org}</span><span>${c.role}</span><span>${c.when}</span><span class="imp">${c.impact}</span></div><p>${caseBody(c)}</p></article>`).join("")}
    <h3 id="lab" style="margin-top:34px">${t.h.lab}</h3><p>${t.labIntro}</p>
    <ul class="list fin">${t.lab.map(l => `<li style="grid-template-columns:1fr;gap:0"><b>${labName(l)}</b><span>${l.why}</span></li>`).join("")}</ul>
  </section>

  <section id="experience" class="rv">
    <div class="mono">05</div><h2>${t.h.experience}</h2>
    <ul class="list tl">${t.timeline.map(e => `<li><span class="mono">${e.when}</span><div><h3>${e.role}</h3><small>${e.org}${e.note ? " · " + e.note : ""}</small></div></li>`).join("")}</ul>
  </section>

  <section id="skills" class="rv">
    <div class="mono">06</div><h2>${t.h.skills}</h2>
    ${t.skills.map(s => `<div class="sk"><span class="mono">${s.name}</span><span>${s.items.join(", ")}</span></div>`).join("")}
  </section>

  <section id="contact" class="contact rv">
    <div class="mono">07 · ${t.h.contact}</div><h2>${t.contactTitle}</h2>
    <p>${t.freelance}</p>
    ${t.services.map(s => `<article class="case"><h3>${s.name}</h3><div class="meta mono"><span>${s.sub}</span></div><p>${svcBody(s)}</p></article>`).join("")}
    <p style="margin-top:20px">${t.contactBody}</p>
    <a class="pill" href="${mailto()}">${t.cta} →</a>
  </section>
</main>
<aside aria-label="${t.name}">
  <div class="card">
    ${portrait()}
    <h2>${t.name}</h2>
    <div class="mono">${t.role} · ${t.location}</div>
    <div class="blk"><span class="mono">${t.a.cardNow}</span><br>${t.a.cardNowBody}</div>
    <div class="blk"><span class="mono">${t.a.cardReading}</span><br><a href="#books">${t.a.cardReadingLink}</a></div>
    <div class="links">${footerLinks()}</div>
    <a class="pill" href="${mailto()}">${t.cta}</a>
  </div>
</aside>
</div>
<footer><span class="mono">${t.footer.rights}</span><span class="mono">${footerLinks()}</span></footer>`;
}
function pick(i) {
  book = i;
  $$(".spine").forEach((s, j) => s.setAttribute("aria-pressed", j === i));
  $("#bookd").innerHTML = bookDetail(T());
}
document.addEventListener("click", e => {
  const s = e.target.closest("[data-book]"); if (s) pick(+s.dataset.book);
  if (e.target.closest("[data-theme-btn]")) {
    theme = theme === "dark" ? "light" : "dark"; store.set("rj-theme", theme);
    document.documentElement.dataset.theme = theme; apply(); $("[data-theme-btn]").focus();
  }
});
document.addEventListener("mouseover", e => { const s = e.target.closest("[data-book]"); if (s && +s.dataset.book !== book) pick(+s.dataset.book); });
document.addEventListener("focusin", e => { const s = e.target.closest("[data-book]"); if (s && +s.dataset.book !== book) pick(+s.dataset.book); });
apply();
</script>
</body>
</html>
