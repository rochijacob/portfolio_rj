        { tk: "PRDE", name: "Ingeniería de producto", w: 30, p: "React y React Native en producción. La posición central." },
        { tk: "PPMG", name: "Gestión de proyecto y producto", w: 25, p: "Equipo de seis, más de 5 cuentas, roadmap ante stakeholders." },
        { tk: "AUTO", name: "Automatización e IA", w: 18, p: "Agentes, BI y flujos. La posición de crecimiento." },

      cols: { ticker: "Ticker", holding: "Tenencia", weight: "Peso", thesis: "Tesis", position: "Posición", entry: "Entrada", impact: "Impacto", conviction: "Convicción", title: "Título" },
      positionsTitle: "Track record", positionsSub: "Posiciones, entrada e impacto",

/* ============================================================
   CORE — language, helpers. Each site defines render(t, lang).
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const L = content.links;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
let lang = (() => {
  const s = store.get("rj-lang");
  if (s === "en" || s === "es") return s;
  return (navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en";
})();
const T = () => content[lang];
const mailto = () => `mailto:${L.email}?subject=${encodeURIComponent(T().mailSubject)}`;
const ext = 'target="_blank" rel="noopener"';
const fmtDate = d => {
  const [y, m] = d.split("-").map(Number);
  const s = new Date(y, m - 1, 1).toLocaleDateString(lang === "es" ? "es-AR" : "en-US", { month: "short", year: "numeric" });
  return s.replace(".", "");
};
const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let io;
function reveal() {
  if (io) io.disconnect();
  const els = $$(".rv");
  if (reduced || !("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px" });
  els.forEach(e => io.observe(e));
}
function langToggle(cls = "") {
  return `<span class="lang ${cls}" role="group" aria-label="${esc(T().langLabel)}">` +
    ["en", "es"].map(l => `<button type="button" data-lang="${l}" aria-pressed="${l === lang}">${l.toUpperCase()}</button>`).join('<span aria-hidden="true">|</span>') + `</span>`;
}
function footerLinks() {
  const f = T().footer;
  return `<a href="mailto:${L.email}">${f.email}</a><a href="${L.linkedin}" ${ext}>${f.linkedin}</a><a href="${L.github}" ${ext}>${f.github}</a>`;
}
function portrait() {
  return `<span class="portrait"><span aria-hidden="true">RJ</span><img src="profile.jpg" alt="${esc(T().portraitAlt)}" width="96" height="96" onerror="this.remove()"></span>`;
}
const caseBody = c => c.body + (c.steps ? "<br><br>" + c.steps.map(x => `<b>${x.k}.</b> ${x.v}`).join("<br>") : "");
const svcBody = s => s.body + (s.deliv ? `<br><b>${T().delivLabel}:</b> ${s.deliv}` : "") + (s.ideal ? `<br><b>${T().idealLabel}:</b> ${s.ideal}` : "");
const labName = l => l.url ? `<a href="${l.url}" ${ext}>${l.name}</a>` : l.name;
/* Original pixel-art mascot (a generic pink cat) and a small equalizer. Decorative only. */
const PINK = "#e56b9a";
const CAT = ["..........X..X", "X.........XXXX", "X.........XoXo", "X.........XXXX", ".X..XXXXXXXXX.", "..XXXXXXXXXXX.", "...XXXXXXXXXX.", "...XXXXXXXXX..", "...X..X..X.X..", "...X..X..X.X.."];
const pixelCat = (px = 4) => `<svg width="${14 * px}" height="${10 * px}" viewBox="0 0 14 10" shape-rendering="crispEdges" aria-hidden="true">` +
  CAT.map((r, j) => [...r].map((c, i) => c === "." ? "" : `<rect x="${i}" y="${j}" width="1" height="1" fill="${c === "o" ? "#003049" : PINK}"/>`).join("")).join("") + `</svg>`;
document.head.insertAdjacentHTML("beforeend", `<style>.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px;margin-right:8px}.eq i{width:3px;height:14px;background:${PINK};transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){.eq i{animation:none;transform:scaleY(.6)}}</style>`);
const offClock = () => `<p class="off"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><b>${T().off.t}.</b> ${T().off.p}</p>`;
function apply() {
  document.documentElement.lang = lang;
  document.title = T().meta.title;
  const m = $('meta[name="description"]'); if (m) m.content = T().meta.desc;
  render(T(), lang);
  reveal();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-lang]");
  if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang; store.set("rj-lang", lang);
  const y = scrollY; apply(); scrollTo(0, y);
  const again = $(`[data-lang="${lang}"]`); if (again) again.focus();
});


/* ---------- Site G · Record ---------- */
function wave(seed, color) {
  let h = hash(seed), bars = "";
  for (let i = 0; i < 120; i++) { h = (Math.imul(h, 1103515245) + 12345) >>> 0; const v = 4 + (h >>> 16) % 38 * (0.45 + 0.55 * Math.abs(Math.sin(i / 9))); bars += `<rect x="${i * 5}" y="${(46 - v) / 2}" width="3" height="${v.toFixed(1)}"/>`; }
  return `<svg class="wave" viewBox="0 0 600 46" preserveAspectRatio="none" fill="${color}" aria-hidden="true">${bars}</svg>`;
}
function render(t) {
  const g = t.g;
  const tracks = [["A1", "work", g.releases], ["A2", "about", t.h.about], ["A3", "offers", g.bookings], ["A4", "experience", g.disco], ["B1", "skills", g.credits], ["B2", "lab", g.bsides], ["B3", "books", g.crate], ["B4", "writing", g.liner]];
  const hd = (i, extra = "") => `<div class="k">${tracks[i][0].startsWith("A") ? g.sideA : g.sideB} ${extra}</div><h2 class="rv"><span>${tracks[i][0]}</span>${tracks[i][2]}</h2>`;
  $("#app").innerHTML = `
<a class="skip" href="#main">${t.skip}</a>
<header class="bar pad"><a href="#top">${t.name}</a><span><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>${g.playing}: ${t.status}</span>${langToggle()}</header>
<main id="main">
  <div class="hero pad" id="top">
    <div><div class="k" style="color:var(--ink)">${t.role} · ${t.remote}</div>
      <h1>${t.name}</h1>
      <p>${t.pitch}</p><p class="s">${t.sub}</p>
      <a class="btn" href="${mailto()}">${t.cta} →</a></div>
    <div class="deck" aria-hidden="true"><div class="vinyl"></div>
      <div class="sleeve"><span>RJ-000 · 2026</span><b>${t.role}</b><span style="display:flex;justify-content:space-between;align-items:flex-end">${t.location}${pixelCat(4)}</span></div></div>
  </div>

  <nav class="tl pad" aria-label="${g.tracklist}"><div class="k">${g.tracklist}</div>
    <ol>${tracks.map(([n, id, l]) => `<li><a href="#${id}"><b>${n}</b><i>${l}</i></a></li>`).join("")}</ol>
  </nav>

  <section id="work" class="pad">${hd(0)}
    <div class="rel">${t.cases.map((c, i) => `<article class="rc"><div class="cv"><span class="k">${g.cat} RJ-00${i + 1} · ${c.org}</span><h3>${c.name}</h3></div>
      <div class="bd"><b>${c.impact}</b><br><span class="k">${c.role} · ${c.when}</span>
        <details><summary>${g.notes}</summary><p>${caseBody(c)}</p><div class="tags">${c.tags.map(x => `<span>${x}</span>`).join("")}</div>${c.url ? `<p style="margin:10px 0 0"><a href="${c.url}" ${ext}>${t.repo} ↗</a></p>` : ""}</details></div></article>`).join("")}</div>
    ${wave("a1", "#669bbc")}
  </section>

  <section id="about" class="pad">${hd(1)}
    <div class="two"><div>${portrait()}${t.about.map(p => `<p>${p}</p>`).join("")}${offClock()}</div>
      <div><div class="k">${t.h.finance}</div><ul class="rows" style="margin-top:10px">${t.finance.map(f => `<li style="grid-template-columns:90px 1fr"><b>${f.k}</b><span>${f.v}</span></li>`).join("")}</ul></div></div>
    <div class="nums">${t.stats.map(s => `<div><b>${s.n}</b><span>${s.l}</span></div>`).join("")}</div>
  </section>

  <section id="offers" class="pad dk" style="padding-bottom:clamp(46px,7vw,90px);margin-top:40px">${hd(2)}
    <div class="bk">${t.services.map(s => `<div><span class="k" style="color:inherit">${s.code} · ${s.sub}</span><h3 style="margin:8px 0 10px;font-size:1.7rem">${s.name}</h3><p style="margin:0">${svcBody(s)}</p></div>`).join("")}</div>
    <p style="max-width:66ch;margin:26px 0 20px">${t.freelance}</p>
    <a class="btn" style="background:var(--pink);color:var(--ink);border-color:var(--pink)" href="${mailto()}">${t.ctaAlt} →</a>
  </section>

  <section id="experience" class="pad">${hd(3)}
    <ul class="rows">${t.timeline.map(e => `<li><span class="k">${e.when}</span><div><h3>${e.role}</h3><small>${e.org}${e.note ? " · " + e.note : ""}</small></div></li>`).join("")}</ul>
    ${wave("a4", "#e56b9a")}
  </section>

  <section id="skills" class="pad">${hd(4)}
    <ul class="rows">${t.skills.map(s => `<li><h3>${s.name}</h3><span class="tags">${s.items.map(x => `<span>${x}</span>`).join("")}</span></li>`).join("")}</ul>
  </section>

  <section id="lab" class="pad">${hd(5)}<p>${t.labIntro}</p>
    <ul class="rows">${t.lab.map(l => `<li><h3>${labName(l)}</h3><span>${l.why}</span></li>`).join("")}</ul>
  </section>

  <section id="books" class="pad">${hd(6)}<p>${t.booksIntro}</p>
    <div class="crate" tabindex="0" role="group" aria-label="${g.crate}">${content.books.map((b, i) => `<div class="lp" style="--r:${[-3, 2, -1, 3, -2, 1][i % 6]}deg"><b>${b.url ? `<a href="${b.url}" ${ext}>${esc(b.title)}</a>` : esc(b.title)}</b><span style="padding-right:30px">${esc(b.note[lang] || "")}</span><span class="k" style="color:var(--ink)">${esc(b.author)}</span></div>`).join("")}</div>
    <p class="k" style="margin-top:14px">${t.booksNote}</p>
  </section>

  <section id="writing" class="pad" style="padding-bottom:clamp(46px,7vw,90px)">${hd(7)}<p>${t.writingIntro}</p>
    <ul class="rows">${content.writing.map(w => `<li><span class="k">${fmtDate(w.date)}${w.url ? "" : " · " + t.soon}</span><h3>${w.url ? `<a href="${w.url}" ${ext}>${esc(w.title[lang])}</a>` : esc(w.title[lang])}</h3></li>`).join("")}</ul>
  </section>

  <section id="contact" class="end pad"><div class="k" style="color:var(--ink)">${t.h.contact}</div><h2 class="rv">${t.ctaAlt}.</h2>
    <p>${t.contactTitle}</p><p style="font-weight:400">${t.contactBody}</p>
    <a class="btn" href="${mailto()}">${t.cta} →</a>
  </section>
</main>
<footer class="pad"><span>${t.footer.rights}</span><span>${footerLinks()}</span></footer>`;
}
apply();
</script>
</body>
</html>
