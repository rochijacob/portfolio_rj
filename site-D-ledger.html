.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--line)}

p{margin:0 0 .9em}

.up{color:var(--up);font-weight:500;font-family:var(--mono);font-size:.86rem}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important;animation-delay:0s!important;scroll-behavior:auto!important}.rv{opacity:1}}

  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px" });

function chartData(t) {
  const all = t.d.milestones, t0 = Math.max(all[0].t, NOW - SPAN[range]);
  const at = x => { // linear interpolation of the index at time x
    for (let i = 1; i < all.length; i++) if (x <= all[i].t) { const a = all[i - 1], b = all[i]; return a.v + (b.v - a.v) * (x - a.t) / (b.t - a.t); }
    return all[all.length - 1].v;
  };
  const pts = all.map((m, i) => ({ ...m, i })).filter(m => m.t >= t0);
  const line = pts[0].t > t0 ? [{ t: t0, v: at(t0) }, ...pts] : pts;
  return { pts, line, t0, first: line[0].v, last: all[all.length - 1].v };
}
function chart(t) {
  const { pts, line, t0, first, last } = chartData(t), W = 800, H = 300, P = { l: 8, r: 16, t: 18, b: 28 };
  const lo = Math.max(0, first - 8), hi = last + 8;
  const X = x => P.l + (x - t0) / (NOW - t0) * (W - P.l - P.r), Y = v => H - P.b - (v - lo) / (hi - lo) * (H - P.t - P.b);
  const d = line.map((p, i) => (i ? "L" : "M") + X(p.t).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ");
  const years = []; for (let y = Math.ceil(t0); y <= NOW; y++) years.push(y);
  const step = years.length > 4 ? 1 : 1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="group" aria-label="${esc(t.d.chartTitle)}">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f7a4d" stop-opacity=".22"/><stop offset="1" stop-color="#1f7a4d" stop-opacity="0"/></linearGradient></defs>
    ${years.filter((_, i) => i % step === 0).map(y => `<line class="gr" x1="${X(y)}" x2="${X(y)}" y1="${P.t}" y2="${H - P.b}"/><text x="${X(y) + 4}" y="${H - 8}">${y}</text>`).join("")}
    <line class="gr" x1="${P.l}" x2="${W - P.r}" y1="${Y(first)}" y2="${Y(first)}"/>
    <path class="ar" d="${d} L${X(NOW)} ${H - P.b} L${X(t0)} ${H - P.b} Z"/>
    <path class="ln" pathLength="1" d="${d}"/>
    ${pts.map(p => `<circle class="pt${p.i === activeM ? " on" : ""}" cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="6" tabindex="0" role="button" data-m="${p.i}" aria-label="${esc(p.l)}"/>`).join("")}
  </svg>`;
}
const bookTk = (b, i) => b.title.startsWith("[") ? "BK0" + (i + 1) : b.title.replace(/[^A-Za-z]/g, "").toUpperCase().replace(/(?!^)[AEIOU]/g, "").slice(0, 4);

      <div class="rng" role="group" aria-label="Range">${Object.keys(d.ranges).map(k => `<button type="button" data-range="${k}" aria-pressed="${k === range}">${d.ranges[k]}</button>`).join("")}</div>

  </section>

    <table><thead><tr><th>${d.cols.ticker}</th><th>${d.cols.holding}</th><th>${d.cols.weight}</th><th>${d.cols.thesis}</th></tr></thead>
    <tbody>${d.holdings.map(h => `<tr><td data-l="${d.cols.ticker}"><span class="t">${h.tk}</span></td><td data-l="${d.cols.holding}"><b>${h.name}</b></td><td data-l="${d.cols.weight}"><span class="w"><i style="width:${h.w * 2.2}px"></i>${h.w}%</span></td><td data-l="${d.cols.thesis}">${h.p}</td></tr>`).join("")}</tbody></table>
    <p class="fine">${d.illustrative}</p>
  </section>

  <section class="panel rv" id="positions"><div class="ph"><h2>${d.positionsTitle}</h2><span class="mono">${d.positionsSub}</span></div>
    <table><thead><tr><th>${d.cols.position}</th><th>${d.cols.entry}</th><th>${d.cols.impact}</th></tr></thead>
    <tbody>${t.cases.map(c => `<tr><td data-l="${d.cols.position}"><div><b>${c.url ? `<a href="${c.url}" ${ext}>${c.name}</a>` : c.name}</b> <span class="mono">${c.org} · ${c.role}</span><small>${c.body}</small></div></td><td data-l="${d.cols.entry}"><span class="mono" style="white-space:nowrap">${c.when}</span></td><td data-l="${d.cols.impact}"><span class="up">▲ ${c.impact}</span></td></tr>`).join("")}</tbody></table>

  </section>

  <section class="panel rv" id="writing"><div class="ph"><h2>${t.h.writing}</h2><span class="mono">${t.writingIntro}</span></div>
    <ul class="kv">${content.writing.map(w => `<li><span class="mono">${fmtDate(w.date)}</span>${w.url ? `<a href="${w.url}" ${ext}>${esc(w.title[lang])}</a>` : `<span>${esc(w.title[lang])} <span class="mono">· ${t.soon}</span></span>`}</li>`).join("")}</ul>

function setM(i) {
  activeM = i; $("#cap").textContent = T().d.milestones[i].l;
  $$(".pt").forEach(p => p.classList.toggle("on", +p.dataset.m === i));
}
document.addEventListener("click", e => {
  const r = e.target.closest("[data-range]");
  if (r) { range = r.dataset.range; activeM = -1; const y = scrollY; apply(); scrollTo(0, y); $(`[data-range="${range}"]`).focus(); return; }
  const m = e.target.closest("[data-m]"); if (m) setM(+m.dataset.m);
});
document.addEventListener("mouseover", e => { const m = e.target.closest("[data-m]"); if (m) setM(+m.dataset.m); });
document.addEventListener("focusin", e => { const m = e.target.closest("[data-m]"); if (m) setM(+m.dataset.m); });
apply();
</script>
