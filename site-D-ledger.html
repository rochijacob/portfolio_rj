:root{--bg:#f4f6f7;--ink:#003049;--soft:#4a6676;--acc:#3d7aa3;--up:#1f7a4d;--line:rgba(0,48,73,.16);--dot:rgba(0,48,73,.15);

.m{font:400 .78rem/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}

.tk{font:700 1.4rem/1 var(--cond);letter-spacing:.04em;text-decoration:none;margin-right:auto;padding:10px 0}

header nav a{font:500 .8rem var(--mono);text-transform:uppercase;text-decoration:none;color:var(--soft);padding:12px 0;margin-left:18px}
.lang{display:inline-flex;align-items:center;font:400 .78rem var(--mono);color:var(--soft)}

.theme{border:1px solid var(--line);font-size:1rem}
/* Hero: nothing but type. */
.hero{padding:clamp(48px,8vw,120px) 0 56px;border-bottom:1px solid var(--line)}
h1{font:700 clamp(3.4rem,1rem + 9.4vw,10rem)/.86 var(--cond);text-transform:uppercase;letter-spacing:-.01em;margin:22px 0 0}

.sub{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;margin-top:44px;align-items:end}
.sub p{grid-column:1/7;margin:0;font-size:1.2rem;color:var(--soft)}
.sub .act{grid-column:9/13;display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;background:var(--ink);color:var(--bg);text-decoration:none;font:600 1.05rem var(--cond);letter-spacing:.06em;text-transform:uppercase}

.sh{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;margin-bottom:34px}

.tr{border-top:1px solid var(--ink)}
.tr summary{list-style:none;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,3fr) minmax(0,3fr) 24px;gap:20px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line);cursor:pointer;min-height:48px}

.tr .up{color:var(--up);font:500 .9rem var(--mono)}
.tr .pl{font:400 1.2rem var(--mono);color:var(--soft);transition:transform .2s}
.tr details[open] .pl{transform:rotate(45deg)}
.tr .x{padding:16px 0 26px;border-bottom:1px solid var(--line);color:var(--soft);max-width:70ch}
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,3fr) minmax(0,3fr) 24px;gap:20px;padding-bottom:10px}
.kv{list-style:none;margin:0;padding:0}
.kv li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:20px;padding:12px 0;border-top:1px solid var(--line)}
.kv li.exh{border:0}
.kv small{display:block;color:var(--soft)}
.svc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}
.svc h3{font:600 1.6rem/1 var(--cond);text-transform:uppercase;margin:0 0 10px}
.svc p{color:var(--soft);font-size:.98rem;margin:0 0 10px}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}

  const c = $("#spcap"); if (c) c.textContent = spineCap().replace(/&amp;/g, "&");
}
document.addEventListener("click", e => { const d = e.target.closest("[data-spine]"); if (d) pickSpine(+d.dataset.spine); });
document.addEventListener("mouseover", e => { const d = e.target.closest("[data-spine]"); if (d && +d.dataset.spine !== openBook) pickSpine(+d.dataset.spine); });
document.addEventListener("focusin", e => { const d = e.target.closest("[data-spine]"); if (d && +d.dataset.spine !== openBook) pickSpine(+d.dataset.spine); });
function apply() {
  const expanded = $$("details[id][open]").map(e => e.id);
  document.documentElement.lang = lang;
  document.title = T().meta.title;
  const m = $('meta[name="description"]'); if (m) m.content = T().meta.desc;
  render(T(), lang);
  expanded.forEach(id => { const e = document.getElementById(id); if (e?.tagName === "DETAILS") e.open = true; });
  reveal();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-lang]");
  if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang; store.set("rj-lang", lang);
  /* Prerendered pages use real links (for crawlers and no-JS). With JS, switch in place and only
     update the address, so the page never reloads. */
  if (b.matches("a[href]")) {
    e.preventDefault();
    document.documentElement.dataset.pageLanguage = lang;
    try { history.replaceState(null, "", b.getAttribute("href") + location.search + location.hash); } catch (err) {}
  }
  swap(() => {
    const y = scrollY; apply(); scrollTo(0, y);
    const again = $(`[data-lang="${lang}"]`) || $("[data-lang]"); if (again) again.focus();
  });
});
/* Re-render behind a short cross-fade where the browser supports view transitions, so a language
   change does not snap. Without support, or with reduced motion, it runs straight away. */
function swap(fn) { if (!reduced && document.startViewTransition) document.startViewTransition(fn); else fn(); }
/* Text selection as a pink highlighter stroke (the mascot's pink), on every direction. */
document.head.insertAdjacentHTML("beforeend", `<style>::selection{background:color-mix(in srgb,${PINK} 42%,transparent);color:inherit}::view-transition-old(root),::view-transition-new(root){animation-duration:.26s}</style>`);
/* Every <details> opens and closes with a height animation instead of snapping. */
document.addEventListener("click", e => {
  const s = e.target.closest("summary"), d = s && s.parentNode;
  if (!d || d.tagName !== "DETAILS" || reduced || !d.animate) return;
  e.preventDefault();
  const closing = d._anim ? !d._closing : d.open, from = d.offsetHeight;
  if (d._anim) { d._anim.onfinish = null; d._anim.cancel(); }
  d.open = true;
  const cs = getComputedStyle(d), shut = s.getBoundingClientRect().bottom - d.getBoundingClientRect().top + parseFloat(cs.paddingBottom) + parseFloat(cs.borderBottomWidth);
  d.style.height = ""; const full = d.offsetHeight;
  d._closing = closing; d.style.overflow = "hidden";
  d._anim = d.animate({ height: [from + "px", (closing ? shut : full) + "px"] }, { duration: 340, easing: "cubic-bezier(.22,.7,.2,1)" });
  d._anim.onfinish = () => { if (closing) d.open = false; d.style.overflow = ""; d._anim = null; };
});

/* Buenos Aires sketch, shared by A, D and H. Each site styles .city with its own variables. */
/* A composed architectural elevation, not a geographic or to-scale survey.
   Each landmark has its own clear silhouette; details stay inside its facade. */
const city = alt => {
  const repeat = (n, draw) => Array.from({ length: n }, (_, i) => draw(i)).join("");
  // Narrow paired jambs read as windows, with equal margins on every facade.
  const windows = (x, y, w, h, cols, rows) => repeat(cols, i => repeat(rows, j => {
    const cx = x + w * (i + .5) / cols, cy = y + h * (j + .5) / rows;
    return `M${cx - 1.6} ${cy - 2.5}v5h3.2v-5`;
  }));
  const block = (x, w, top, cols, rows) => `<path d="M${x} 222V${top}h${w}v${222 - top}M${x - 2} ${top + 5}h${w + 4}"/><path class="detail" d="${windows(x + 5, top + 11, w - 10, 202 - top, cols, rows)}"/>`;
  const tree = x => `M${x} 222v-17m0 7l-5-5m5 2l5-6M${x - 12} 204c-6-5-3-12 2-13-1-9 12-13 17-6 9-1 13 11 6 16 0 7-8 11-13 6-4 3-9 2-12-3Z`;
  const person = x => `<circle cx="${x}" cy="211" r="1.5"/><path d="M${x} 214v4m-2 4 2-4 2 4m-5-6 3-2 3 2"/>`;
  const kavanaghWindows = [
    [179, 151, 18, 61, 2, 7], [275, 151, 18, 61, 2, 7],
    [204, 114, 18, 98, 2, 11], [250, 114, 18, 98, 2, 11],
    [228, 57, 16, 155, 2, 17]
  ].map(args => windows(...args)).join("");
  return `<svg class="city" viewBox="0 0 1200 274" role="img" aria-label="${esc(alt)}">
<g class="context">
  ${block(40, 43, 174, 3, 3)}${block(94, 49, 134, 4, 6)}
  ${block(691, 38, 155, 3, 4)}${block(742, 43, 117, 3, 8)}${block(797, 30, 169, 2, 3)}
  ${block(1137, 37, 180, 3, 2)}
</g>
<!-- Kavanagh: recessed wings, a continuous central shaft and roof terraces. -->
<g>
  <path class="wash" d="M244 48h6v58h24v38h25v78h-55Z"/>
  <path class="outline" d="M173 222V144h25v-38h24V48h7V29h14v19h7v58h24v38h25v78"/>
  <path class="detail" d="M198 144v78m24-174v174m28-116v116m24-78v78M173 149h25m0-38h24m28 0h24m0 38h25M222 53h28M229 35h14M232 29v-5h8v5M226 217h20v5${kavanaghWindows}"/>
</g>
<!-- Congreso: lantern, ribbed dome, drum, pediment, paired columns, steps. -->
<g>
  <path class="wash" d="M450 87c20 10 29 26 30 49h-30ZM455 180h19v32h-19Z"/>
  <path class="outline" d="M356 216V173h49v-9h12v-25h-5v-4h7c0-22 12-40 26-48v-9h10v9c14 8 26 26 26 48h7v4h-5v25h12v9h49v43"/>
  <path d="M443 78v-7q7-9 14 0v7M450 66v-9M417 139h66M417 164h66M405 173l45-20 45 20M405 178h90M356 178h49m90 0h49M352 216h196m-200 3h204m-204 3h204"/>
  <path class="detail" d="M450 87c-8 12-13 28-13 48m13-48c8 12 13 28 13 48m-13-48v48M419 135h62M425 143v15m8-15v15m9-15v9m16-9v9m9-9v15m8-15v15M417 171l33-14 33 14M356 211h49m90 0h49${repeat(6, i => `M${413 + i * 14} 182v30m4-30v30m-5-30h6m-6 30h6`)}${windows(362, 183, 37, 23, 3, 1)}${windows(501, 183, 37, 23, 3, 1)}"/>
</g>
<!-- Obelisco: two faces, a quiet dimension and a stepped plinth. -->
<g>
  <path class="wash" d="M600 35l5 20 9 161h-14Z"/>
  <path class="outline" d="M586 216l9-161 5-20 5 20 9 161ZM582 222v-6h36v6"/>
  <path class="detail" d="M600 35v181M595 55h10M596 203v9h5v-9ZM597 69v6m6-6v6M577 222h46"/>
  <path class="guide axis" d="M600 19v10m0 198v9"/>

  <text x="649" y="130" text-anchor="middle" transform="rotate(-90 649 130)">${esc(T().cityHeight)}</text>

};

<g class="guide"><path d="M244 40h28m-28 360h28M264 40v360M260 44l8-8m-8 368 8-8"/></g>
<text x="278" y="220" text-anchor="middle" transform="rotate(-90 278 220)">${esc(T().cityHeight)}</text>

/* ---------- Site D · Ledger ---------- */
let theme = store.get("rj-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
document.documentElement.dataset.theme = theme;

function render(t) {
  const d = t.d, words = t.pitch.split(" "), cut = Math.ceil(words.length / 2);
  $("#app").innerHTML = `
<a class="skip" href="#main">${t.skip}</a>
<header>
  <a class="tk" href="#top" id="top">${d.ticker}<span>▲ ${d.since}</span></a>
  <nav aria-label="${esc(t.menu)}"><a href="#story">${d.storyTitle}</a><a href="#positions">${d.positionsTitle}</a><a href="#contact">${t.nav.contact}</a></nav>
  ${langToggle()}
  <button class="theme" type="button" data-theme-btn aria-label="${esc(t.themeLabel)}" aria-pressed="${theme === "dark"}">${theme === "dark" ? "☀" : "☾"}</button>
</header>
<main id="main">
  <div class="hero">
    <div class="m">${t.name} · ${t.role} · ${t.remote}</div>
    <h1>${words.slice(0, cut).join(" ")} <span>${words.slice(cut).join(" ")}</span></h1>
    <div class="sub"><p>${t.heroIntro}</p><div class="act"><a class="btn" href="#contact">${t.cta} ↗</a><a class="btn o" href="#positions">${t.seeWork}</a></div></div>
  </div>
  <div class="ticker m" aria-label="${esc(t.h.numbers)}">${t.stats.slice(0, 6).map(s => `<span><b class="u">▲ ${s.n}</b>${s.l}</span>`).join("")}</div>

  <section id="story">
    <div class="sh"><span class="m">[01] – [04]</span><h2>${d.storyTitle}</h2></div>
    <div class="body"><div class="story">${d.story.map((s, i) => `<div><span class="n">[0${i + 1}]</span><h3>${s.h}</h3><p>${s.p}</p></div>`).join("")}</div>
    <ul class="pairs">${d.pairs.map(p => `<li>${p}</li>`).join("")}</ul></div>
  </section>

  <section id="thesis">
    <div class="sh"><span class="m">${d.thesisSub}</span><h2>${d.thesisTitle}</h2></div>
    <div class="body th">${d.thesis.map(x => `<div><h3>${x.h}</h3><p>${x.p}</p></div>`).join("")}</div>
  </section>

  <section id="positions">
    <div class="sh"><span class="m">${d.positionsSub}</span><h2>${d.positionsTitle}</h2></div>
    <div class="body tr">
      <div class="cols m"><span>${d.cols.position}</span><span>${d.cols.entry}</span><span>${d.cols.impact}</span><span></span></div>
      ${t.cases.map((c, i) => `<details id="pos-${i}"><summary><span class="nm">${c.name}<small>${c.org} · ${c.role}</small></span><span class="w m">${c.when}</span><span class="up">▲ ${c.impact}</span><span class="pl" aria-hidden="true">+</span></summary><div class="x">${caseBody(c)}</div></details>`).join("")}
    </div>
  </section>

  <section id="services">
    <div class="sh"><span class="m">${t.nav.services}</span><h2>${t.h.services}</h2></div>
    <div class="body svc">${t.services.map(s => `<div><h3>${s.name}</h3><p>${s.body}</p><p class="m">${t.delivLabel}: ${s.deliv}</p></div>`).join("")}</div>
  </section>

  <section id="about">
    <div class="sh"><span class="m">${t.remote}</span><h2>${t.h.about}</h2></div>
    <div class="body">${t.profile.map(p => `<p style="max-width:62ch">${p}</p>`).join("")}${offClock()}
      <ul class="kv" style="margin-top:36px">${expSplit(t, e => `<li><span class="m">${e.when}</span><span>${e.role}<small>${e.org}</small></span></li>`)}</ul></div>
  </section>

  <section class="end" id="contact">
    <div class="m">${t.h.contact}</div>
    <p class="big">${d.talk}</p>
    <p>${t.contactBody}</p>
    <div class="act"><a class="btn" href="${mailto()}">${t.cta} ↗</a><a class="btn o" href="${L.linkedin}" ${ext}>LinkedIn</a></div>
  </section>
</main>
<div class="pano">${city(t.illo)}</div>
<footer><span class="m">${t.footer.rights}</span><span class="m">${footerLinks()}</span></footer>`;
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-theme-btn]")) {
    theme = theme === "dark" ? "light" : "dark"; store.set("rj-theme", theme);
    document.documentElement.dataset.theme = theme; apply(); $("[data-theme-btn]").focus();
  }
});
apply();
</script>
