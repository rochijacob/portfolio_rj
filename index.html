function render(t) {
  const m = t.pitch.match(/^(.*?)( into | en )(.*)$/);
  const h1 = m ? `${m[1]}<span>${m[2]}${m[3]}</span>` : t.pitch;
  const sec = (id, title, body) => `<section class="sec" id="${id}"><h2>${title}</h2><div>${body}</div></section>`;
  const main = MAIN.map(c => t.cases.find(x => x.code === c)), rest = t.cases.filter(x => !MAIN.includes(x.code));
  const fid = c => "f" + c.code.replace(".", "");
  $("#app").innerHTML = `
<a class="skip" href="#main">${t.skip}</a>
<header class="w"><div class="hd">
  <a class="me" href="#top">${t.name}</a>
  <span class="k lk"><a href="${L.linkedin}" ${ext}>${t.footer.linkedin}</a><a href="${L.github}" ${ext}>${t.footer.github}</a></span>
</div></header>
<main id="main" class="w">
  <div class="hero" id="top">
    <h1>${h1}</h1>
    <p class="today">${t.today}</p>
    <div class="cta"><a class="btn" href="#contact">${t.cta} ↗</a><a class="btn o" href="#work">${t.seeWork}</a><span class="k">${t.remoteNote} · <span id="clock">${clock()}</span></span></div>
    <div class="cityw">${city(t.illo)}</div>
  </div>
  <nav class="hi" aria-label="${esc(t.h.work)}">${main.map(c => `<a href="#${fid(c)}"><span class="n">${c.impact}</span><b>${c.name} ›</b><span class="s">${c.org} · ${c.role}</span></a>`).join("")}</nav>

  <div id="work">${main.map(c => `<section class="feat" id="${fid(c)}"><div><span class="k">${c.org} · ${c.when}</span><h2 style="grid-column:auto">${c.name}. <span>${c.line}</span></h2>${c.img ? `<img class="shot" src="${c.img}" alt="${esc(c.name)}" loading="lazy">` : ""}</div>
    <div><p>${c.body}</p><dl class="f"><dt>${t.fact.scale}</dt><dd>${c.impact}</dd><dt>${t.fact.role}</dt><dd>${c.role}</dd><dt>${t.fact.stack}</dt><dd>${c.tags.join(", ")}</dd></dl>
      ${c.steps ? `<details class="more"><summary><span class="x" aria-hidden="true">+</span>${t.readCase}</summary><dl class="f">${c.steps.map(x => `<dt>${x.k}</dt><dd>${x.v}</dd>`).join("")}</dl></details>` : ""}</div></section>`).join("")}</div>

  ${sec("offers", t.h.services, `<div class="cols c3" style="margin-bottom:44px">${t.services.map((s, i) => `<div><span class="k">0${i + 1}</span><h3>${s.name}</h3><p>${svcBody(s)}</p></div>`).join("")}</div>
    <p>${t.freelance}</p><div class="cta" style="margin-top:22px"><a class="btn" href="#contact">${t.ctaAlt} ↗</a></div>`)}

  ${sec("about", t.h.about, `${portrait()}<p class="lead">${t.profile[0]}</p>${t.profile.slice(1).map(p => `<p>${p}</p>`).join("")}
    <h3 class="sub">${t.approach}</h3>
    <ol class="steps">${t.think.steps.map((x, i) => `<li><span class="k">0${i + 1}</span><b>${x.q}</b><span class="s">${x.s}</span></li>`).join("")}</ol>
    <div style="margin-top:40px">${offClock()}</div>`)}

  ${sec("books", t.h.books, `<p>${t.booksIntro}</p>${bookShelf()}`)}

  ${sec("more", t.moreTitle, `<details class="fold"><summary><h3>${t.expFold}</h3><span class="x" aria-hidden="true">+</span></summary><div class="b" style="max-width:none"><ul class="r">${expSplit(t, e => `<li><span class="k">${e.when}</span><span><b style="font-weight:500">${e.role}</b><br><span class="s">${e.org}</span></span></li>`, "li", "k")}</ul></div></details>
    <details class="fold"><summary><h3>${t.moreWork}</h3><span class="x" aria-hidden="true">+</span></summary><div class="b">${rest.map(c => `<h3 style="font-size:1.125rem;margin-top:22px">${c.name}</h3><p class="s" style="margin:4px 0 10px">${c.org} · ${c.role} · ${c.when}</p><p>${caseBody(c)}</p>`).join("")}</div></details>`)}

  <section class="end" id="contact">
    <p class="big">${t.gotMind}</p>
    <div class="cta" style="margin:0 0 18px"><a class="btn" href="${mailto()}">${t.cta} ↗</a><button type="button" class="btn o" data-copy>${t.copy}</button></div>
    <p class="s"><a class="m" href="${mailto()}">${L.email}</a>, ${t.orLinkedin.replace("LinkedIn", `<a href="${L.linkedin}" ${ext}>LinkedIn</a>`)}.</p>
  </section>
  <footer class="k"><span>${t.footer.rights}</span><span>${footerLinks()}</span></footer>
</main>
<nav class="dock" aria-label="Sections"><span class="cat" id="cat" aria-hidden="true">${pixelCat(2)}</span><button type="button" class="mn" data-menu aria-expanded="false" aria-controls="dlinks"><span id="mlabel">${t.menu}</span><span aria-hidden="true">▾</span></button><span class="lks" id="dlinks">${DOCK.map(([id, k]) => `<a href="#${id}" data-sec="${id}">${t.nav[k]}</a>`).join("")}</span><i aria-hidden="true"></i>
  <button type="button" data-theme-btn aria-label="${esc(t.themeLabel)}" aria-pressed="${theme === "dark"}"><svg viewBox="0 0 24 24" aria-hidden="true">${theme === "dark" ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>' : '<path d="M20 14A8 8 0 0110 4a8 8 0 1010 10z"/>'}</svg></button>
  <button type="button" class="lg" data-lang="${lang === "en" ? "es" : "en"}" aria-label="${esc(t.langLabel)}: ${lang === "en" ? "Español" : "English"}"><b${lang === "en" ? ' class="on"' : ""}>EN</b><b${lang === "es" ? ' class="on"' : ""}>ES</b></button></nav>`;
  walk(); spy();
}
/* The one flourish: a small pixel cat walks along the top of the navigation as you scroll. */
function walk() {
  const c = $("#cat"); if (!c) return;
  const max = document.documentElement.scrollHeight - innerHeight, p = max > 0 ? Math.min(1, scrollY / max) : 0;
  c.style.transform = `translateX(${(p * (c.parentNode.offsetWidth - 60)).toFixed(1)}px)`;
}
let so;
function spy() {
  if (so) so.disconnect();
  if (!("IntersectionObserver" in window)) return;
  so = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    $$(".dock a").forEach(a => a.setAttribute("aria-current", a.dataset.sec === e.target.id));
    const cur = $(`.dock a[data-sec="${e.target.id}"]`), ml = $("#mlabel"); if (cur && ml) ml.textContent = cur.textContent;
  }), { rootMargin: "-40% 0px -55% 0px" });
  DOCK.forEach(([id]) => so.observe($("#" + id)));
}
document.addEventListener("click", e => {
  if (!e.target.closest("[data-theme-btn]")) return;
  theme = theme === "dark" ? "light" : "dark"; store.set("rj-theme", theme);
  document.documentElement.dataset.theme = theme;
  const y = scrollY; apply(); scrollTo(0, y); $("[data-theme-btn]").focus();
});
document.addEventListener("click", e => {
  const dk = $(".dock"); if (!dk) return;
  const open = e.target.closest("[data-menu]") ? !dk.classList.contains("open") : false;
  dk.classList.toggle("open", open); $("[data-menu]").setAttribute("aria-expanded", open);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $(".dock.open")) { $(".dock").classList.remove("open"); $("[data-menu]").setAttribute("aria-expanded", "false"); $("[data-menu]").focus(); } });
/* The dock steps aside while you read down, and comes back when you scroll up or stop near the top. */
let lastY = 0;
addEventListener("scroll", () => {
  const dk = $(".dock"), y = scrollY; if (!dk) return;
  if (!dk.classList.contains("open")) { if (y > lastY + 6 && y > 240) dk.classList.add("hide"); else if (y < lastY - 6 || y < 240) dk.classList.remove("hide"); }
  lastY = y;
}, { passive: true });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const done = () => { b.textContent = T().copied; setTimeout(() => { b.textContent = T().copy; }, 1800); };
  if (navigator.clipboard) navigator.clipboard.writeText(L.email).then(done, done); else done();
});
addEventListener("scroll", () => requestAnimationFrame(walk), { passive: true });
addEventListener("resize", walk);
setInterval(() => { const c = $("#clock"); if (c) c.textContent = clock(); }, 30000);
apply();
</script>
