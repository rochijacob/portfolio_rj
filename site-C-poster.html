document.addEventListener("click", e => {
  const b = e.target.closest("[data-case]"); if (!b) return;
  const i = +b.dataset.case; openCase = openCase === i ? -1 : i;
  const y = scrollY; apply(); scrollTo(0, y);
  const nb = $(`[data-case="${i}"]`); nb.focus({ preventScroll: true });
  if (openCase === i) nb.closest(".case").scrollIntoView({ block: "nearest", behavior: reduced ? "auto" : "smooth" });

/* cursor-reactive, draggable stickers */
function stickers() {
  const box = $("#stick"), els = $$(".st", box);
  if (!reduced) box.onpointermove = e => {
    const r = box.getBoundingClientRect();
    els.forEach(el => {
      if (el.classList.contains("drag")) return;
      const b = el.getBoundingClientRect(), dx = b.left + b.width / 2 - e.clientX, dy = b.top + b.height / 2 - e.clientY, d = Math.hypot(dx, dy) || 1;
      const push = Math.max(0, 110 - d) / 110 * 26;
      el.style.setProperty("--dx", (dx / d * push).toFixed(1) + "px"); el.style.setProperty("--dy", (dy / d * push).toFixed(1) + "px");
    });
  };
  box.onpointerleave = () => els.forEach(el => { el.style.setProperty("--dx", "0px"); el.style.setProperty("--dy", "0px"); });
  els.forEach(el => {
    el.onpointerdown = e => {
      const r = box.getBoundingClientRect(), b = el.getBoundingClientRect(), ox = e.clientX - b.left, oy = e.clientY - b.top;
      el.setPointerCapture(e.pointerId); el.classList.add("drag"); el.style.setProperty("--dx", "0px"); el.style.setProperty("--dy", "0px");
      el.onpointermove = m => {
        el.style.left = Math.min(r.width - b.width, Math.max(0, m.clientX - r.left - ox)) + "px";
        el.style.top = Math.min(r.height - b.height, Math.max(0, m.clientY - r.top - oy)) + "px";
      };
      el.onpointerup = el.onpointercancel = () => { el.classList.remove("drag"); el.onpointermove = null; };
    };
  });
}
