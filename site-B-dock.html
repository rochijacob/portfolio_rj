};

/* ============================================================
   CORE — language, helpers. Each site defines render(t, lang).
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const L = content.links;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
let lang = (() => {
  const s = store.get("rj-lang");
  if (s === "en" || s === "es") return s;
  return (navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en";
})();
const T = () => content[lang];
const mailto = () => `mailto:${L.email}?subject=${encodeURIComponent(T().mailSubject)}`;
const ext = 'target="_blank" rel="noopener"';
const fmtDate = d => {
  const [y, m] = d.split("-").map(Number);
  const s = new Date(y, m - 1, 1).toLocaleDateString(lang === "es" ? "es-AR" : "en-US", { month: "short", year: "numeric" });
  return s.replace(".", "");
};
const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let io;
function reveal() {
  if (io) io.disconnect();
  const els = $$(".rv");
  if (reduced || !("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px" });
  els.forEach(e => io.observe(e));
}
function langToggle(cls = "") {
  return `<span class="lang ${cls}" role="group" aria-label="${esc(T().langLabel)}">` +
    ["en", "es"].map(l => `<button type="button" data-lang="${l}" aria-pressed="${l === lang}">${l.toUpperCase()}</button>`).join('<span aria-hidden="true">|</span>') + `</span>`;
}
function footerLinks() {
  const f = T().footer;
  return `<a href="mailto:${L.email}">${f.email}</a><a href="${L.linkedin}" ${ext}>${f.linkedin}</a><a href="${L.github}" ${ext}>${f.github}</a>`;
}
function portrait() {
  return `<span class="portrait"><span aria-hidden="true">RJ</span><img src="profile.jpg" alt="${esc(T().portraitAlt)}" width="96" height="96" onerror="this.remove()"></span>`;
}
const caseBody = c => c.body + (c.steps ? "<br><br>" + c.steps.map(x => `<b>${x.k}.</b> ${x.v}`).join("<br>") : "");
const svcBody = s => s.body + (s.deliv ? `<br><b>${T().delivLabel}:</b> ${s.deliv}` : "") + (s.ideal ? `<br><b>${T().idealLabel}:</b> ${s.ideal}` : "");
const labName = l => l.url ? `<a href="${l.url}" ${ext}>${l.name}</a>` : l.name;
/* Original pixel-art mascot (a generic pink cat) and a small equalizer. Decorative only. */
const PINK = "#e56b9a";
const CAT = ["..........X..X", "X.........XXXX", "X.........XoXo", "X.........XXXX", ".X..XXXXXXXXX.", "..XXXXXXXXXXX.", "...XXXXXXXXXX.", "...XXXXXXXXX..", "...X..X..X.X..", "...X..X..X.X.."];
const pixelCat = (px = 4) => `<svg width="${14 * px}" height="${10 * px}" viewBox="0 0 14 10" shape-rendering="crispEdges" aria-hidden="true">` +
  CAT.map((r, j) => [...r].map((c, i) => c === "." ? "" : `<rect x="${i}" y="${j}" width="1" height="1" fill="${c === "o" ? "#003049" : PINK}"/>`).join("")).join("") + `</svg>`;
document.head.insertAdjacentHTML("beforeend", `<style>.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px;margin-right:8px}.eq i{width:3px;height:14px;background:${PINK};transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){.eq i{animation:none;transform:scaleY(.6)}}</style>`);
const offClock = () => `<p class="off"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><b>${T().off.t}.</b> ${T().off.p}</p>`;
/* Books as slim spines, each styled after its cover. Hover or tap to read title and author. */
document.head.insertAdjacentHTML("beforeend", `<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;600&family=Permanent+Marker&family=Playfair+Display:wght@700&display=swap"><style>
.spines{display:flex;align-items:flex-end;gap:5px;overflow-x:auto;padding:26px 6px 0}

.spn{flex:0 0 auto;padding:12px 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:10px;border-radius:2px;transform-origin:bottom center;box-shadow:2px 4px 10px rgba(0,0,0,.2),inset 3px 0 0 rgba(255,255,255,.14),inset -3px 0 0 rgba(0,0,0,.16);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.spn:nth-child(4n+2){transform:rotate(-1.6deg)}.spn:nth-child(5n+4){transform:rotate(1.2deg)}
.spn:hover,.spn:focus-visible,.spn[aria-pressed=true]{transform:translateY(-12px)}

.spn span{writing-mode:vertical-rl;display:flex;align-items:center;gap:14px;min-height:0;white-space:nowrap;overflow:hidden}
.spn b{font-weight:inherit;line-height:1}
.spn em{font:400 .62rem/1 system-ui,sans-serif;font-style:normal;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.spines>.cat{margin-left:auto;align-self:flex-end;line-height:0;padding-left:14px}
.spcap{min-height:1.6em;margin:14px 0 0}
</style>`);
let openBook = -1;
const spineCap = () => openBook < 0 ? T().booksNote : `${esc(content.books[openBook].title)} · ${esc(content.books[openBook].author)}`;
const bookShelf = (shelf = false) => `<div class="spines${shelf ? " shelf" : ""}">${content.books.map((b, i) => { const p = b.spine; return `<button type="button" class="spn" data-spine="${i}" aria-pressed="${i === openBook}" aria-label="${esc(b.title)}, ${esc(b.author)}" style="width:${p.w}px;height:${p.h}px;background:${p.bg};color:${p.fg};--ac:${p.ac};font-family:${p.font};font-weight:${p.wt || 400};font-size:${p.fs || ".95rem"};letter-spacing:${p.ls || ".02em"}${p.up ? ";text-transform:uppercase" : ""}"><i></i><span><b>${esc(b.title)}</b><em>${esc(b.author.split(" ").pop())}</em></span><i></i></button>`; }).join("")}${shelf ? `<span class="cat">${pixelCat(5)}</span>` : ""}</div><p class="spcap" id="spcap" aria-live="polite">${spineCap()}</p>`;
function pickSpine(i) {
  openBook = i; $$("[data-spine]").forEach(x => x.setAttribute("aria-pressed", +x.dataset.spine === i));
  const c = $("#spcap"); if (c) c.textContent = spineCap().replace(/&amp;/g, "&");
}
document.addEventListener("click", e => { const d = e.target.closest("[data-spine]"); if (d) pickSpine(+d.dataset.spine); });
document.addEventListener("mouseover", e => { const d = e.target.closest("[data-spine]"); if (d && +d.dataset.spine !== openBook) pickSpine(+d.dataset.spine); });
document.addEventListener("focusin", e => { const d = e.target.closest("[data-spine]"); if (d && +d.dataset.spine !== openBook) pickSpine(+d.dataset.spine); });
function apply() {
  document.documentElement.lang = lang;
  document.title = T().meta.title;
  const m = $('meta[name="description"]'); if (m) m.content = T().meta.desc;
  render(T(), lang);
  reveal();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-lang]");
  if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang; store.set("rj-lang", lang);
  const y = scrollY; apply(); scrollTo(0, y);
  const again = $(`[data-lang="${lang}"]`); if (again) again.focus();
});


/* ---------- Site B · Dock ---------- */
let theme = store.get("rj-theme-b") || "dark";
document.documentElement.dataset.theme = theme;
const IC = {
  home: '<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
  experience: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3M3 13h18"/>',
  work: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  play: '<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M16 11.5h.01M18 13.5h.01"/>',
  contact: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>',
  moon: '<path d="M20 14A8 8 0 0110 4a8 8 0 1010 10z"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
const DOCK = [["home", "top"], ["experience", "experience"], ["work", "work"], ["play", "play"], ["contact", "contact"]];

function render(t) {
  const chipify = s => esc(s).replace(/\{([^}]+)\}/g, '<span class="chip">$1</span>');
  $("#app").innerHTML = `
<a class="skip" href="#main">${t.skip}</a>
<main id="main" class="card">
  <section id="top" style="padding-top:0">
    <span class="status"><span class="dot" aria-hidden="true"></span>${t.status}</span>
    <div class="who">${portrait()}<div><h3>${t.name}</h3><span class="mut">${t.remote}</span></div></div>
    <h1>Product <em>Engineer</em></h1>
    <p class="lead">${t.pitch}</p>
    <p class="mut">${t.sub}</p>
    <div class="btns"><a class="btn p" href="${mailto()}">${t.cta} →</a><a class="btn" href="${L.github}" ${ext}>GitHub ↗</a><a class="btn" href="${L.linkedin}" ${ext}>LinkedIn ↗</a></div>
    <div class="stats">${t.stats.slice(0, 6).map(s => `<div><b>${s.n}</b><span>${s.l}</span></div>`).join("")}</div>
  </section>

  <section id="about" class="rv"><h2><small>01</small>${t.h.about}</h2>
    ${t.about.map(p => `<p>${p}</p>`).join("")}
    ${offClock()}
  </section>

  <section id="skills" class="rv"><h2><small>02</small>${t.h.skills}</h2>
    <p class="stack">${chipify(t.stackSentence)}</p>
    <div class="groups">${t.skills.map(s => `<div><span>${s.name}</span><span class="chips">${s.items.map(i => `<span class="chip">${i}</span>`).join("")}</span></div>`).join("")}</div>
  </section>

  <section id="experience" class="rv"><h2><small>03</small>${t.h.experience}</h2>
    ${t.timeline.map((e, i) => `<div class="row"><span class="n">${String(i + 1).padStart(2, "0")}</span><div><h3>${e.role}</h3><span class="w">${e.org} · ${e.when}</span>${e.note ? `<p>${e.note}</p>` : "<p></p>"}<span class="chips">${e.tags.map(x => `<span class="chip">${x}</span>`).join("")}</span></div></div>`).join("")}
  </section>

  <section id="work" class="rv"><h2><small>04</small>${t.h.work}</h2>
    ${t.cases.map((c, i) => `<article class="row"><span class="n">${String(i + 1).padStart(2, "0")}</span><div><h3>${c.name}</h3><span class="w">${c.org} · ${c.role} · ${c.when}</span><span class="imp">▲ ${c.impact}</span><p>${caseBody(c)}</p><span class="chips">${c.tags.map(x => `<span class="chip">${x}</span>`).join("")}${c.url ? `<a class="chip" style="padding:7px 10px" href="${c.url}" ${ext}>${t.repo} ↗</a>` : ""}</span></div></article>`).join("")}
  </section>

  <section id="play" class="rv"><h2><small>05</small>${t.b.playTitle}</h2>
    <p>${t.b.playBody}</p>
    <div class="hud"><span>${t.b.playHint}</span><span>${t.b.playScore}: <b id="sc">0</b> · ${t.b.playBest}: <b id="bs">0</b></span></div>
    <canvas id="game" width="640" height="360" tabindex="0" role="button" aria-label="${esc(t.b.playTitle)}: ${esc(t.b.playHint)}"></canvas>
    <div class="btns"><a class="btn" href="${L.games}" ${ext}>${t.b.originals} ↗</a></div>
    <h3 style="margin-top:34px">${t.h.lab}</h3><p class="mut">${t.labIntro}</p>
    ${t.lab.map(l => `<div class="row" style="grid-template-columns:1fr"><div><b>${labName(l)}${l.url ? " ↗" : ""}</b><p style="margin-bottom:0"># ${l.why}</p></div></div>`).join("")}
  </section>

  <section id="books" class="rv"><h2><small>06</small>${t.h.books}</h2>
    <p>${t.booksIntro}</p>
    <div class="term"><span class="cmd">$ ls ~/books --notes</span>
      <ol>${content.books.map(b => `<li><span>${b.url ? `<a href="${b.url}" ${ext}>${esc(b.title)}</a>` : `<b>${esc(b.title)}</b>`} — ${esc(b.author)}${b.note[lang] ? `<br><span class="mut"># ${esc(b.note[lang])}</span>` : ""}</span></li>`).join("")}</ol>
    </div>
    
  </section>

  <section id="writing" class="rv"><h2><small>07</small>${t.h.writing}</h2>
    <p>${t.writingIntro}</p>
    <ul class="log">${content.writing.map(w => `<li><span class="mut">${fmtDate(w.date)}</span>${w.url ? `<a href="${w.url}" ${ext}>${esc(w.title[lang])}</a>` : `<span>${esc(w.title[lang])} <span class="mut">· ${t.soon}</span></span>`}</li>`).join("")}</ul>
  </section>

  <section id="contact" class="contact rv">
    <h2>${t.h.contact}</h2>
    <p>${t.freelance}</p>
    <div style="text-align:left">${t.services.map((s, i) => `<div class="row"><span class="n">${String(i + 1).padStart(2, "0")}</span><div><h3>${s.name}</h3><span class="w">${s.sub}</span><p style="margin-bottom:0">${svcBody(s)}</p></div></div>`).join("")}</div>
    <p class="mut" style="margin-top:18px">${t.contactBody}</p>

  </section>
</main>
<footer><span>${t.footer.rights}</span><span>${footerLinks()}</span></footer>
<nav class="dock" aria-label="Dock">
  ${DOCK.map(([k, id]) => `<a href="#${id}" data-tip="${esc(t.nav[k])}" aria-label="${esc(t.nav[k])}" data-sec="${id}">${svg(k)}</a>`).join("")}
  <i aria-hidden="true"></i>
  <button type="button" data-theme-btn data-tip="${esc(t.themeLabel)}" aria-label="${esc(t.themeLabel)}">${svg(theme === "dark" ? "sun" : "moon")}</button>
  <button type="button" data-lang="en" aria-pressed="${lang === "en"}" aria-label="English">EN</button>
  <button type="button" data-lang="es" aria-pressed="${lang === "es"}" aria-label="Español">ES</button>
</nav>`;
  spy(); game();
}

/* active dock item on scroll */
let so;
function spy() {
  if (so) so.disconnect();
  if (!("IntersectionObserver" in window)) return;
  so = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) $$(".dock a").forEach(a => a.setAttribute("aria-current", a.dataset.sec === e.target.id));
  }), { rootMargin: "-45% 0px -50% 0px" });
  DOCK.forEach(([, id]) => so.observe($("#" + id)));
}

/* tiny hop-through-the-gaps loop */
let raf;
function game() {
  cancelAnimationFrame(raf);
  const c = $("#game"), x = c.getContext("2d"), W = 640, H = 360;
  let st = "idle", y, v, pipes, score, best = +store.get("rj-best") || 0, f = 0;
  $("#bs").textContent = best;
  const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  const reset = () => { y = H / 2; v = 0; pipes = []; score = 0; f = 0; $("#sc").textContent = 0; };
  const hop = () => { if (st !== "play") { reset(); st = "play"; loop(); } v = -6.2; };
  function draw() {
    const ink = css("--ink"), acc = css("--acc"), mut = css("--mut"), line = css("--line");
    x.clearRect(0, 0, W, H);
    x.fillStyle = line; for (let i = 0; i < W; i += 22) for (let j = 0; j < H; j += 22) x.fillRect(i, j, 1.5, 1.5);
    x.fillStyle = mut; pipes.forEach(p => { x.fillRect(p.x, 0, 46, p.g); x.fillRect(p.x, p.g + 120, 46, H); });
    CAT.forEach((r, j) => [...r].forEach((ch, i) => { if (ch !== ".") { x.fillStyle = ch === "o" ? "#003049" : PINK; x.fillRect(113 + i * 2.5, y - 12 + j * 2.5, 2.6, 2.6); } }));
    x.fillStyle = ink; x.textAlign = "center";
    if (st !== "play") { x.font = '500 20px "JetBrains Mono",monospace'; x.fillText(st === "idle" ? T().b.playStart : T().b.playOver, W / 2, H / 2 - 40); }
  }
  function loop() {
    if (st !== "play") return;
    f++; v += 0.36; y += v;
    if (f % 95 === 1) pipes.push({ x: W, g: 40 + Math.random() * (H - 200), ok: false });
    pipes.forEach(p => {
      p.x -= 2.6;
      if (!p.ok && p.x + 46 < 120) { p.ok = true; $("#sc").textContent = ++score; }
      if (p.x < 142 && p.x + 46 > 120 && (y - 11 < p.g || y + 11 > p.g + 120)) st = "over";
    });
    pipes = pipes.filter(p => p.x > -50);
    if (y > H - 11 || y < 11) st = "over";
    if (st === "over" && score > best) { best = score; store.set("rj-best", best); $("#bs").textContent = best; }
    draw();
    if (st === "play") raf = requestAnimationFrame(loop);
  }
  c.onpointerdown = e => { e.preventDefault(); c.focus({ preventScroll: true }); hop(); };
  c.onkeydown = e => { if (e.code === "Space" || e.key === "Enter" || e.key === "ArrowUp") { e.preventDefault(); hop(); } };
  reset(); draw();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => st !== "play" && draw());
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-theme-btn]")) {
    theme = theme === "dark" ? "light" : "dark"; store.set("rj-theme-b", theme);
    document.documentElement.dataset.theme = theme; apply(); $("[data-theme-btn]").focus();
  }
});
apply();
</script>
