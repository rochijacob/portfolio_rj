*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:var(--ink);color:var(--bg);padding:8px 12px;z-index:99}
.card{max-width:740px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,48px);overflow:hidden}
section{padding:44px 0 0;scroll-margin-top:20px}
.status{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:8px 14px;font-size:.78rem}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.who{display:flex;align-items:center;gap:14px;margin:28px 0 26px}
.portrait{width:56px;height:56px;border-radius:14px;background:var(--chip);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;position:relative;overflow:hidden;flex:none}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
h1{font:400 clamp(3.6rem,17vw,8.6rem)/.92 var(--disp);text-transform:uppercase;margin:10px 0 18px;letter-spacing:.005em}
h1 em{font-style:normal;color:var(--acc)}
h2{font:400 clamp(1.9rem,6vw,2.7rem)/1 var(--disp);text-transform:uppercase;margin:0 0 20px;letter-spacing:.02em}
h2 small{font:400 .78rem var(--mono);color:var(--mut);margin-right:10px;vertical-align:middle}

p{margin:0 0 1em}.mut{color:var(--mut)}
.lead{font-size:1.02rem;max-width:56ch}

.btn.p{background:var(--acc);color:#001824;border-color:var(--acc)}
:root[data-theme=light] .btn.p{color:#fff}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:36px}
.stats div{background:var(--card);padding:16px}

.chip{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:7px;padding:1px 8px;font-size:.8rem;white-space:nowrap;transition:transform .25s cubic-bezier(.3,1.6,.5,1),border-color .2s}
.chip:hover{transform:translateY(-3px);border-color:var(--acc)}
.stack{font-size:1rem;line-height:2.1}
.groups{margin-top:22px;display:grid;gap:12px}
.groups div{display:grid;grid-template-columns:170px 1fr;gap:10px}
.groups span:first-child{color:var(--mut);font-size:.78rem;text-transform:uppercase;padding-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.row{display:grid;grid-template-columns:38px 1fr;gap:12px;padding:18px 0;border-top:1px dashed var(--line)}
.row .n{color:var(--acc);font-weight:700}
.row .w{color:var(--mut);font-size:.78rem}
.row p{margin:6px 0 10px;color:var(--mut)}
.row .imp{color:var(--acc);font-size:.8rem;display:block;margin:4px 0}
canvas{display:block;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:14px;background:var(--bg);cursor:pointer;touch-action:manipulation}
.hud{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--mut);margin:10px 0}
.term{border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:16px;overflow-x:auto}
.term .cmd{color:var(--acc)}
.term ol{list-style:none;margin:10px 0 0;padding:0;counter-reset:b}
.term li{counter-increment:b;display:grid;grid-template-columns:30px 1fr;padding:6px 0}
.term li::before{content:counter(b,decimal-leading-zero);color:var(--mut)}
.log li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.log{list-style:none;margin:0;padding:0}
.contact{text-align:center;padding-bottom:10px}

footer a{margin-left:16px;padding:8px 0;display:inline-block}footer a:first-child{margin-left:0}
/* dock */
.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:7px;background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:999px;z-index:50;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.dock a,.dock button{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;position:relative;color:var(--mut);text-decoration:none;font-size:.72rem;font-weight:700;transition:transform .3s cubic-bezier(.3,1.8,.5,1),background .2s,color .2s}
.dock a:hover,.dock button:hover{transform:translateY(-6px) scale(1.12);color:var(--ink);background:var(--chip)}
.dock a[aria-current=true]{color:var(--acc);background:var(--chip)}
.dock button[aria-pressed=true][data-lang]{color:var(--acc)}
.dock svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dock i{width:1px;height:24px;background:var(--line);margin:0 3px}
.dock [data-tip]::after{content:attr(data-tip);position:absolute;bottom:54px;left:50%;transform:translateX(-50%) translateY(4px);background:var(--ink);color:var(--bg);padding:4px 9px;border-radius:7px;font-size:.7rem;font-weight:500;white-space:nowrap;opacity:0;pointer-events:none;transition:.18s}
.dock [data-tip]:hover::after,.dock [data-tip]:focus-visible::after{opacity:1;transform:translateX(-50%)}
.rv{opacity:0;transform:translateY(18px) scale(.985);transition:opacity .5s,transform .6s cubic-bezier(.3,1.4,.5,1)}
.rv.in{opacity:1;transform:none}
@media(max-width:560px){.groups div{grid-template-columns:1fr;gap:4px}.dock a,.dock button{width:40px;height:40px}.dock{gap:0;padding:5px}.dock i{margin:0 1px}}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}

  play: '<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M16 11.5h.01M18 13.5h.01"/>',
  contact: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>',
  moon: '<path d="M20 14A8 8 0 0110 4a8 8 0 1010 10z"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
const DOCK = [["home", "top"], ["experience", "experience"], ["work", "work"], ["play", "play"], ["contact", "contact"]];

function render(t) {
  const chipify = s => esc(s).replace(/\{([^}]+)\}/g, '<span class="chip">$1</span>');
  $("#app").innerHTML = `
<a class="skip" href="#main">${t.skip}</a>
<main id="main" class="card">
  <section id="top" style="padding-top:0">
    <span class="status"><span class="dot" aria-hidden="true"></span>${t.status}</span>
    <div class="who">${portrait()}<div><h3>${t.name}</h3><span class="mut">${t.remote}</span></div></div>
    <h1>Product <em>Engineer</em></h1>
    <p class="lead">${t.pitch}</p>
    <p class="mut">${t.sub}</p>
    <div class="btns"><a class="btn p" href="${mailto()}">${t.cta} →</a><a class="btn" href="${L.github}" ${ext}>GitHub ↗</a><a class="btn" href="${L.linkedin}" ${ext}>LinkedIn ↗</a></div>
    <div class="stats">${t.stats.slice(0, 6).map(s => `<div><b>${s.n}</b><span>${s.l}</span></div>`).join("")}</div>
  </section>

  <section id="about" class="rv"><h2><small>01</small>${t.h.about}</h2>
    ${t.about.map(p => `<p>${p}</p>`).join("")}
  </section>

  <section id="skills" class="rv"><h2><small>02</small>${t.h.skills}</h2>
    <p class="stack">${chipify(t.stackSentence)}</p>
    <div class="groups">${t.skills.map(s => `<div><span>${s.name}</span><span class="chips">${s.items.map(i => `<span class="chip">${i}</span>`).join("")}</span></div>`).join("")}</div>
  </section>

  <section id="experience" class="rv"><h2><small>03</small>${t.h.experience}</h2>
    ${t.timeline.map((e, i) => `<div class="row"><span class="n">${String(i + 1).padStart(2, "0")}</span><div><h3>${e.role}</h3><span class="w">${e.org} · ${e.when}</span>${e.note ? `<p>${e.note}</p>` : "<p></p>"}<span class="chips">${e.tags.map(x => `<span class="chip">${x}</span>`).join("")}</span></div></div>`).join("")}
  </section>

  <section id="work" class="rv"><h2><small>04</small>${t.h.work}</h2>
    ${t.cases.map((c, i) => `<article class="row"><span class="n">${String(i + 1).padStart(2, "0")}</span><div><h3>${c.name}</h3><span class="w">${c.org} · ${c.role} · ${c.when}</span><span class="imp">▲ ${c.impact}</span><p>${caseBody(c)}</p><span class="chips">${c.tags.map(x => `<span class="chip">${x}</span>`).join("")}${c.url ? `<a class="chip" style="padding:7px 10px" href="${c.url}" ${ext}>${t.repo} ↗</a>` : ""}</span></div></article>`).join("")}
  </section>

  <section id="play" class="rv"><h2><small>05</small>${t.b.playTitle}</h2>
    <p>${t.b.playBody}</p>
    <div class="hud"><span>${t.b.playHint}</span><span>${t.b.playScore}: <b id="sc">0</b> · ${t.b.playBest}: <b id="bs">0</b></span></div>
    <canvas id="game" width="640" height="360" tabindex="0" role="button" aria-label="${esc(t.b.playTitle)}: ${esc(t.b.playHint)}"></canvas>
    <div class="btns"><a class="btn" href="${L.games}" ${ext}>${t.b.originals} ↗</a></div>
    <h3 style="margin-top:34px">${t.h.lab}</h3><p class="mut">${t.labIntro}</p>
    ${t.lab.map(l => `<div class="row" style="grid-template-columns:1fr"><div><b>${labName(l)}${l.url ? " ↗" : ""}</b><p style="margin-bottom:0"># ${l.why}</p></div></div>`).join("")}
  </section>

  <section id="books" class="rv"><h2><small>06</small>${t.h.books}</h2>
    <p>${t.booksIntro}</p>
    <div class="term"><span class="cmd">$ ls ~/books --notes</span>
      <ol>${content.books.map(b => `<li><span>${b.url ? `<a href="${b.url}" ${ext}>${esc(b.title)}</a>` : `<b>${esc(b.title)}</b>`} — ${esc(b.author)}<br><span class="mut"># ${esc(b.note[lang] || "")}</span></span></li>`).join("")}</ol>
    </div>
    <p class="mut" style="margin-top:10px">// ${t.booksNote}</p>
  </section>

  <section id="writing" class="rv"><h2><small>07</small>${t.h.writing}</h2>
    <p>${t.writingIntro}</p>
    <ul class="log">${content.writing.map(w => `<li><span class="mut">${fmtDate(w.date)}</span>${w.url ? `<a href="${w.url}" ${ext}>${esc(w.title[lang])}</a>` : `<span>${esc(w.title[lang])} <span class="mut">· ${t.soon}</span></span>`}</li>`).join("")}</ul>
  </section>

  <section id="contact" class="contact rv">
    <h2>${t.h.contact}</h2>
    <p>${t.freelance}</p>
    <div style="text-align:left">${t.services.map((s, i) => `<div class="row"><span class="n">${String(i + 1).padStart(2, "0")}</span><div><h3>${s.name}</h3><span class="w">${s.sub}</span><p style="margin-bottom:0">${svcBody(s)}</p></div></div>`).join("")}</div>
    <p class="mut" style="margin-top:18px">${t.contactBody}</p>
    <div class="btns" style="justify-content:center"><a class="btn p" href="${mailto()}">${t.cta} →</a></div>
  </section>
</main>
<footer><span>${t.footer.rights}</span><span>${footerLinks()}</span></footer>
<nav class="dock" aria-label="Dock">
  ${DOCK.map(([k, id]) => `<a href="#${id}" data-tip="${esc(t.nav[k])}" aria-label="${esc(t.nav[k])}" data-sec="${id}">${svg(k)}</a>`).join("")}
  <i aria-hidden="true"></i>
  <button type="button" data-theme-btn data-tip="${esc(t.themeLabel)}" aria-label="${esc(t.themeLabel)}">${svg(theme === "dark" ? "sun" : "moon")}</button>
  <button type="button" data-lang="en" aria-pressed="${lang === "en"}" aria-label="English">EN</button>
  <button type="button" data-lang="es" aria-pressed="${lang === "es"}" aria-label="Español">ES</button>
</nav>`;
  spy(); game();
}

/* active dock item on scroll */
let so;
function spy() {
  if (so) so.disconnect();
  if (!("IntersectionObserver" in window)) return;
  so = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) $$(".dock a").forEach(a => a.setAttribute("aria-current", a.dataset.sec === e.target.id));
  }), { rootMargin: "-45% 0px -50% 0px" });
  DOCK.forEach(([, id]) => so.observe($("#" + id)));
}

/* tiny hop-through-the-gaps loop */
let raf;
function game() {
  cancelAnimationFrame(raf);
  const c = $("#game"), x = c.getContext("2d"), W = 640, H = 360;
  let st = "idle", y, v, pipes, score, best = +store.get("rj-best") || 0, f = 0;
  $("#bs").textContent = best;
  const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  const reset = () => { y = H / 2; v = 0; pipes = []; score = 0; f = 0; $("#sc").textContent = 0; };
  const hop = () => { if (st !== "play") { reset(); st = "play"; loop(); } v = -6.2; };
  function draw() {
    const ink = css("--ink"), acc = css("--acc"), mut = css("--mut"), line = css("--line");
    x.clearRect(0, 0, W, H);
    x.fillStyle = line; for (let i = 0; i < W; i += 22) for (let j = 0; j < H; j += 22) x.fillRect(i, j, 1.5, 1.5);
    x.fillStyle = mut; pipes.forEach(p => { x.fillRect(p.x, 0, 46, p.g); x.fillRect(p.x, p.g + 120, 46, H); });
    x.fillStyle = acc; x.fillRect(120, y - 11, 22, 22);
    x.fillStyle = ink; x.textAlign = "center";
    if (st !== "play") { x.font = '500 20px "JetBrains Mono",monospace'; x.fillText(st === "idle" ? T().b.playStart : T().b.playOver, W / 2, H / 2 - 40); }
  }
  function loop() {
    if (st !== "play") return;
    f++; v += 0.36; y += v;
    if (f % 95 === 1) pipes.push({ x: W, g: 40 + Math.random() * (H - 200), ok: false });
    pipes.forEach(p => {
      p.x -= 2.6;
      if (!p.ok && p.x + 46 < 120) { p.ok = true; $("#sc").textContent = ++score; }
      if (p.x < 142 && p.x + 46 > 120 && (y - 11 < p.g || y + 11 > p.g + 120)) st = "over";
    });
    pipes = pipes.filter(p => p.x > -50);
    if (y > H - 11 || y < 11) st = "over";
    if (st === "over" && score > best) { best = score; store.set("rj-best", best); $("#bs").textContent = best; }
    draw();
    if (st === "play") raf = requestAnimationFrame(loop);
  }
  c.onpointerdown = e => { e.preventDefault(); c.focus({ preventScroll: true }); hop(); };
  c.onkeydown = e => { if (e.code === "Space" || e.key === "Enter" || e.key === "ArrowUp") { e.preventDefault(); hop(); } };
  reset(); draw();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => st !== "play" && draw());
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-theme-btn]")) {
    theme = theme === "dark" ? "light" : "dark"; store.set("rj-theme-b", theme);
    document.documentElement.dataset.theme = theme; apply(); $("[data-theme-btn]").focus();
  }
});
apply();
</script>
</body>
</html>
